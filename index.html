<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --cream: #f5f0e8;
    --bone: #ede8dc;
    --ink: #1a1714;
    --charcoal: #2e2a26;
    --gold: #b89a6a;
    --muted: #7a7268;
    --rule: rgba(26, 23, 20, 0.12);
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bone); }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 0; }

  .nav-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(245, 240, 232, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
    padding: 0 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 56px;
  }

  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: var(--ink);
    text-decoration: none;
  }

  .nav-link {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .nav-link:hover {
    color: var(--gold);
  }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 60px 60px;
    text-align: center;
    animation: fadeDown 1.2s ease both;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 24px;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(3rem, 7vw, 6rem);
    font-weight: 300;
    letter-spacing: 0.08em;
    line-height: 0.9;
    color: var(--ink);
  }

  .hero-title em {
    font-style: italic;
    color: var(--charcoal);
  }

  .header-rule {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 36px auto 24px;
  }

  .hero-sub {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 64px;
  }

  .nav-cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2px;
    width: 100%;
    max-width: 900px;
    animation: fadeUp 1s ease 0.3s both;
  }

  .nav-card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 40px 36px;
    min-height: 260px;
    background: #fff;
    text-decoration: none;
    overflow: hidden;
    transition: box-shadow 0.4s ease, transform 0.4s ease;
    border: 1px solid var(--rule);
  }

  .nav-card:hover {
    box-shadow: 0 20px 60px rgba(26, 23, 20, 0.14);
    transform: translateY(-4px);
  }

  .nav-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(184, 154, 106, 0.04) 0%, transparent 60%);
    transition: opacity 0.4s ease;
    opacity: 0;
  }

  .nav-card:hover::before {
    opacity: 1;
  }

  .card-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: rgba(184, 154, 106, 0.15);
    line-height: 1;
    position: absolute;
    top: 24px;
    right: 28px;
    transition: color 0.4s ease;
  }

  .nav-card:hover .card-num {
    color: rgba(184, 154, 106, 0.3);
  }

  .card-label {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.6rem, 2.5vw, 2.2rem);
    font-weight: 400;
    letter-spacing: 0.03em;
    line-height: 1.1;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .card-desc {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.04em;
    line-height: 1.8;
    color: var(--muted);
    max-width: 30ch;
  }

  .card-arrow {
    margin-top: 24px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: gap 0.25s ease, color 0.25s ease;
  }

  .nav-card:hover .card-arrow {
    gap: 14px;
    color: var(--gold);
  }

  .site-footer {
    border-top: 1px solid var(--rule);
    padding: 28px 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-mark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  .footer-about {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .footer-about:hover {
    color: var(--ink);
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    .nav-bar    { padding: 0 24px; }
    .hero       { padding: 60px 24px 40px; }
    .nav-cards  { grid-template-columns: 1fr; }
    .nav-card   { min-height: 200px; }
    .site-footer { padding: 24px; flex-direction: column; gap: 10px; text-align: center; }
  }
</style>
</head>
<body>

<nav class="nav-bar">
  <a href="index.html" class="nav-logo">Portfolio</a>
  <a href="about.html" class="nav-link">About</a>
</nav>

<main class="hero">
  <div class="eyebrow">Brian Lua</div>
  <h1 class="hero-title">Select a <em>Section</em></h1>
  <div class="header-rule"></div>
  <p class="hero-sub">Front-end work &amp; reference library</p>

  <div class="nav-cards">
    <a href="myportfolio/" class="nav-card">
      <span class="card-num">01</span>
      <span class="card-label">Work</span>
      <h2 class="card-title">My Portfolio</h2>
      <p class="card-desc">Editorial pages, campaign layouts, and interactive builds.</p>
      <span class="card-arrow">View Work &rarr;</span>
    </a>

    <a href="mylayouts/" class="nav-card">
      <span class="card-num">02</span>
      <span class="card-label">Reference</span>
      <h2 class="card-title">My Layouts</h2>
      <p class="card-desc">Reusable HTML snippets and layout patterns.</p>
      <span class="card-arrow">View Layouts &rarr;</span>
    </a>
  </div>
</main>

<footer class="site-footer">
  <span class="footer-mark">Portfolio</span>
  <a href="about.html" class="footer-about">About Me &rarr;</a>
</footer>

</body>
</html>
