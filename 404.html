<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Brian Lua</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --cream: #f5f0e8;
    --ink:   #1a1714;
    --gold:  #b89a6a;
    --muted: #7a7268;
    --rule:  rgba(26,23,20,0.12);
  }

  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }

  .num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(6rem, 20vw, 12rem);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1;
    color: rgba(184,154,106,0.15);
  }

  .rule {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin: 24px auto;
  }

  .heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 300;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .sub {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 40px;
  }

  .home-link {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--gold);
    padding-bottom: 2px;
    transition: color 0.2s ease;
  }

  .home-link:hover { color: var(--gold); }
</style>
</head>
<body>
  <div class="num">404</div>
  <div class="rule"></div>
  <h1 class="heading">Page not found</h1>
  <p class="sub">The page you're looking for doesn't exist.</p>
  <a href="/" class="home-link">Back to Home &rarr;</a>
</body>
</html>
