<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout Snippet Library</title>
<style>
  :root {
    --bg: #000000;
    --surface: #161616;
    --border: #2a2a2a;
    --border-active: #3a3a3a;
    --text-primary: #f0f0f0;
    --text-secondary: #888;
    --text-muted: #4a4a4a;
    --accent: #c8a96e;
    --accent-dim: rgba(200,169,110,0.1);
    --tag-desktop: #1a2a1a; --tag-desktop-text: #6fcf97;
    --tag-mobile:  #1a1a2a; --tag-mobile-text:  #7eb8f7;
    --tag-web:     #2a1a2a; --tag-web-text:     #c77dff;
    --radius: 6px;
    --mono: 'SF Mono','Fira Code','Cascadia Code',monospace;
    --sans: 'Inter',system-ui,-apple-system,sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--sans); min-height: 100vh; }

  /* HEADER */
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: #000000;
    backdrop-filter: blur(12px);
    z-index: 50;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .header-title h1 {
    font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent);
  }
  .header-title p { font-size: 11px; color: var(--text-muted); font-family: var(--mono); margin-top: 1px; }
  .back-link {
    font-size: 10px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-muted);
    text-decoration: none; font-family: var(--sans);
    transition: color 0.15s; flex-shrink: 0;
  }
  .back-link:hover { color: var(--accent); }
  .search-wrap { position: relative; flex: 0 0 240px; margin-left: auto; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  #search {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 7px 28px 7px 30px;
    color: var(--text-primary); font-size: 12px; font-family: var(--sans); outline: none;
    transition: border-color 0.15s;
  }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--text-muted); }
  .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--text-muted);
    font-size: 13px; line-height: 1; padding: 2px 4px; display: none; transition: color 0.15s;
  }
  .search-clear:hover { color: var(--text-primary); }
  .search-clear.visible { display: block; }

  /* FILTER BAR */
  .filter-bar {
    padding: 10px 32px; display: flex; gap: 6px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border); align-items: center;
  }
  .filter-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-right: 2px; }
  .pill {
    padding: 3px 11px; border-radius: 20px; font-size: 11px; font-weight: 500;
    border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
    cursor: pointer; transition: all 0.12s; font-family: var(--sans);
  }
  .pill:hover { border-color: var(--border-active); color: var(--text-primary); }
  .pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .count-badge { margin-left: auto; font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
  .view-toggle { display: flex; gap: 2px; margin-left: 12px; }
  .view-btn {
    padding: 4px 7px; background: transparent; border: 1px solid var(--border);
    border-radius: 3px; color: var(--text-muted); cursor: pointer;
    transition: all 0.12s; line-height: 0;
  }
  .view-btn:hover { border-color: var(--border-active); color: var(--text-primary); }
  .view-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

  /* GRID */
  .grid-wrap { padding: 24px 32px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

  /* LIST MODE */
  .grid.list-mode { display: flex; flex-direction: column; gap: 0; }
  .grid.list-mode .section-divider { grid-column: unset; width: 100%; margin-top: 10px; }
  .grid.list-mode .card {
    flex-direction: row; align-items: center;
    border-radius: 0; border-left: none; border-right: none; border-top: none;
    box-shadow: none !important;
  }
  .grid.list-mode .card:first-of-type { border-top: 1px solid var(--border); }
  .grid.list-mode .card-preview { display: none; }
  .grid.list-mode .card-body {
    flex: 1; flex-direction: row; align-items: center;
    padding: 9px 14px; gap: 14px;
  }
  .grid.list-mode .card-tags { margin-bottom: 0; flex-wrap: nowrap; flex-shrink: 0; }
  .grid.list-mode .card-name {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; word-break: normal;
  }
  .grid.list-mode .card-footer { border-top: none; padding: 9px 14px 9px 0; flex-shrink: 0; }
  .grid.list-mode .card-filename { display: none; }

  /* CARD */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
    display: flex; flex-direction: column;
  }
  .card.hovered { border-color: var(--border-active); box-shadow: 0 6px 20px rgba(0,0,0,0.5); }

  /* IFRAME THUMBNAIL */
  .card-preview {
    position: relative; width: 100%; height: 180px;
    overflow: hidden; background: #111;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .card-preview.mobile-preview { height: 300px; }
  .card-preview iframe {
    position: absolute; top: 0; left: 0;
    width: 1280px; height: 900px;
    transform: scale(0.21875); transform-origin: top left;
    pointer-events: none; border: none; background: #fff;
  }
  .card-preview::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite;
    z-index: 1; transition: opacity 0.3s;
  }
  .card-preview.loaded::before { opacity: 0; pointer-events: none; }
  .preview-overlay {
    position: absolute; inset: 0; z-index: 3;
    background: rgba(0,0,0,0);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background 0.15s;
  }
  .card.hovered .preview-overlay { background: rgba(0,0,0,0.5); }
  .preview-btn {
    opacity: 0; transform: translateY(4px);
    transition: opacity 0.15s, transform 0.15s;
    padding: 6px 14px; border-radius: 4px; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: var(--sans); border: none;
  }
  .card.hovered .preview-btn { opacity: 1; transform: translateY(0); }
  .preview-btn-expand { background: var(--accent); color: #0e0e0e; }
  .preview-btn-open   { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.2) !important; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* CARD BODY */
  .card-body { padding: 12px 14px; flex: 1; }
  .card-tags { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .tag {
    font-size: 9px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 2px 6px; border-radius: 3px;
  }
  .tag-desktop  { background: var(--tag-desktop); color: var(--tag-desktop-text); }
  .tag-mobile   { background: var(--tag-mobile);  color: var(--tag-mobile-text); }
  .tag-web      { background: var(--tag-web);     color: var(--tag-web-text); }
  .tag-layout   { background: #1f1a10; color: #e0b96a; }
  .tag-media    { background: #0d1f22; color: #4dd0e8; }
  .tag-interact { background: #1f1020; color: #c084fc; }
  .tag-cta      { background: #0f1f10; color: #86efac; }
  .card-name { font-size: 12px; font-weight: 500; color: var(--text-primary); font-family: var(--mono); line-height: 1.4; word-break: break-word; }
  .card-footer {
    padding: 8px 14px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .card-filename { font-size: 9px; color: var(--text-muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .open-btn {
    font-size: 10px; font-weight: 600; color: var(--accent);
    background: var(--accent-dim); border: 1px solid transparent;
    border-radius: 3px; padding: 3px 8px; cursor: pointer;
    transition: all 0.12s; font-family: var(--sans); text-decoration: none; white-space: nowrap; flex-shrink: 0;
  }
  .open-btn:hover { border-color: var(--accent); }

  /* SECTION DIVIDER */
  .section-divider {
    grid-column: 1 / -1; padding: 2px 0 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-muted);
    display: flex; align-items: center; gap: 10px; margin-top: 14px;
  }
  .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* EMPTY */
  .empty { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--text-muted); }

  /* PAGINATION */
  .pagination { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 28px 0 20px; }
  #pagination-top { padding: 4px 0 20px; }
  .page-btn {
    padding: 5px 14px; font-size: 11px; font-family: var(--mono);
    border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
    border-radius: 4px; cursor: pointer; transition: border-color .15s, color .15s;
  }
  .page-btn:hover:not(:disabled) { border-color: var(--border-active); color: var(--text-primary); }
  .page-btn:disabled { opacity: 0.3; cursor: default; }
  .page-info { font-size: 11px; font-family: var(--mono); color: var(--text-secondary); padding: 0 2px; }
  .page-input {
    width: 36px; text-align: center; font-size: 11px; font-family: var(--mono);
    background: var(--surface); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 4px 0; outline: none;
  }
  .page-input:focus { border-color: var(--accent); }
  .empty span { display: block; font-size: 28px; margin-bottom: 10px; }
  .empty p { font-size: 13px; }

  /* DRAWER */
  .drawer-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 200; backdrop-filter: blur(6px);
  }
  .drawer-backdrop.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(900px, 100vw);
    background: #111; border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    z-index: 201;
  }
  .drawer.open { transform: translateX(0); }
  #drawer-swipe-hint { display: none; }
  @media (max-width: 640px) {
    #drawer-swipe-hint { display: inline; }
  }
  .drawer-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: #111;
  }
  .drawer-title { font-size: 13px; font-family: var(--mono); color: var(--text-primary); flex: 1; line-height: 1.4; }
  .drawer-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .drawer-btn {
    padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: 600;
    cursor: pointer; font-family: var(--sans); transition: all 0.12s;
  }
  .drawer-btn-primary { background: var(--accent); color: #0e0e0e; border: none; }
  .drawer-btn-primary:hover { background: #d9bc82; }
  .drawer-btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
  .drawer-btn-ghost:hover { color: var(--text-primary); border-color: var(--border-active); }
  #drawer-reload { color: var(--accent); }
  #drawer-reload.reloading { pointer-events: none; animation: reloadFlash 0.4s ease forwards; }
  @keyframes reloadFlash {
    0%   { background: var(--accent); color: #0e0e0e; border-color: var(--accent); }
    60%  { background: var(--accent); color: #0e0e0e; border-color: var(--accent); }
    100% { background: transparent;   color: var(--accent); border-color: var(--border); }
  }
  .drawer-close { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .drawer-close:hover { color: var(--text-primary); }
  .drawer-controls {
    padding: 8px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0; background: #0e0e0e;
    flex-wrap: wrap;
  }
  @media (max-width: 600px) {
    .drawer-controls { padding: 8px 14px; gap: 6px; }
    .vp-group { flex: 0 0 100%; }
    .vp-label { display: none; }
    .vp-size-display { display: none; }
  }
  .vp-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-right: 4px; }
  .vp-btn {
    padding: 3px 10px; border-radius: 3px; font-size: 11px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-secondary); cursor: pointer; font-family: var(--sans); transition: all 0.12s;
  }
  .vp-btn:hover { border-color: var(--border-active); color: var(--text-primary); }
  .vp-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .vp-size-display { margin-left: auto; font-size: 10px; color: var(--text-muted); font-family: var(--mono); }
  .drawer-meta {
    padding: 8px 20px; border-bottom: 1px solid var(--border);
    display: flex; gap: 20px; flex-shrink: 0; background: #0e0e0e; flex-wrap: wrap;
  }
  .meta-item label { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 2px; }
  .meta-item span  { font-size: 11px; color: var(--text-secondary); font-family: var(--mono); }
  .drawer-stage {
    flex: 1; min-height: 0; overflow: hidden; position: relative; background: #1a1a1a;
    display: flex; align-items: stretch; justify-content: center; padding: 16px;
  }
  .stage-inner {
    position: relative; min-height: 0; background: #fff;
    border-radius: 3px; overflow: hidden;
    box-shadow: 0 4px 32px rgba(0,0,0,0.6);
    transition: width 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  .stage-inner iframe { width: 100%; height: 100%; border: none; display: block; }
  .stage-loader {
    position: absolute; inset: 0; background: #fff;
    display: flex; align-items: center; justify-content: center;
    z-index: 2; transition: opacity 0.3s;
  }
  .stage-loader.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 28px; height: 28px; border: 2px solid #eee; border-top-color: #999; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* VIEW TABS (Preview / Code) */
  .view-tabs { display: flex; gap: 4px; flex-shrink: 0; }
  .view-tab {
    padding: 3px 11px; border-radius: 3px; font-size: 11px; font-weight: 500;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-secondary); cursor: pointer; font-family: var(--sans);
    transition: all 0.12s;
  }
  .view-tab:hover { border-color: var(--border-active); color: var(--text-primary); }
  .view-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .vp-group { display: flex; align-items: center; gap: 8px; flex: 1; }
  .vp-group.hidden { visibility: hidden; pointer-events: none; }

  /* CODE PANEL */
  .code-panel {
    display: none; flex-direction: column;
    flex: 1; overflow: hidden;
    background: #0a0a0a;
  }
  .code-panel.visible { display: flex; }
  .prompt-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; background: #0a0a0a; }
  .prompt-panel.visible { display: flex; }
  .prompt-scroll { flex: 1; overflow-y: auto; padding: 24px; }
  .prompt-intro { font-family: var(--sans); font-size: 13px; color: var(--text-primary); line-height: 1.7; margin-bottom: 18px; }
  .prompt-section { margin-bottom: 16px; }
  .prompt-section:last-child { margin-bottom: 0; }
  .prompt-heading { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 7px; font-family: var(--sans); }
  .prompt-list { list-style: none; padding: 0; }
  .prompt-list li { font-family: var(--sans); font-size: 13px; color: var(--text-secondary); line-height: 1.7; padding-left: 14px; position: relative; margin-bottom: 4px; }
  .prompt-list li:last-child { margin-bottom: 0; }
  .prompt-list li::before { content: '·'; position: absolute; left: 0; color: var(--text-muted); }
  .code-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    flex-shrink: 0; gap: 12px;
  }
  .code-filename { font-size: 10px; color: var(--text-muted); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .code-copy-btn {
    padding: 4px 12px; border-radius: 3px; font-size: 11px; font-weight: 600;
    background: var(--accent-dim); border: 1px solid var(--border);
    color: var(--accent); cursor: pointer; font-family: var(--sans);
    transition: all 0.12s; white-space: nowrap; flex-shrink: 0;
  }
  .code-copy-btn:hover { border-color: var(--accent); }
  .code-scroll { flex: 1; overflow: auto; padding: 20px; }
  .code-pre {
    margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.75;
    color: #abb2bf; white-space: pre; tab-size: 2;
  }
  .code-lang-tabs { display: flex; gap: 4px; padding: 6px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .code-lang-tab {
    padding: 3px 10px; border-radius: 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    font-family: var(--mono); cursor: pointer;
    background: transparent; border: 1px solid transparent;
    color: var(--text-muted); transition: all 0.1s;
  }
  .code-lang-tab.active { background: var(--accent-dim); border-color: var(--border); color: var(--accent); }
  .code-lang-tab.empty { opacity: 0.25; cursor: default; }
  /* Syntax tokens */
  .hl-cmt  { color: #5c6370; font-style: italic; }
  .hl-tag  { color: #e06c75; }
  .hl-attr { color: #d19a66; }
  .hl-str  { color: #98c379; }
  .hl-num  { color: #d19a66; }
  .hl-kw   { color: #c678dd; }
  .hl-fn   { color: #61afef; }
  .hl-prop { color: #56b6c2; }

  @keyframes pgFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  body { animation: pgFadeIn 0.25s ease both; }
  html { overflow-x: hidden; }

  @media (max-width: 600px) {
    header       { padding: 14px 32px; gap: 12px; }
    .search-wrap { flex: 1 1 auto; min-width: 0; margin-left: 0; }
    .filter-bar  { padding: 8px 32px; }
    .grid-wrap   { padding: 16px 32px 60px; }
  }

  /* Back to top */
  .back-to-top {
    position: fixed;
    bottom: 32px;
    right: 32px;
    z-index: 90;
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    background: rgba(17, 17, 17, 0.92);
    backdrop-filter: blur(8px);
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease, border-color 0.2s ease, color 0.2s ease;
    pointer-events: none;
  }
  .back-to-top.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .back-to-top:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .back-to-top svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
</style>
</head>
<body>

<header>
  <a href="/" class="back-link">← Home</a>
  <div class="header-title">
    <h1>Layout Snippet Library</h1>
    <p id="header-path">~/layouts/snippets/</p>
  </div>
  <div class="search-wrap">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="search" type="text" placeholder="Search layouts..." autocomplete="off">
    <button class="search-clear" id="searchClear" type="button" aria-label="Clear search">✕</button>
  </div>
</header>

<div class="filter-bar">
  <span class="filter-label">Filter</span>
  <button class="pill active" data-filter="essentials">Essentials</button>
  <button class="pill" data-filter="all">All</button>
  <button class="pill" data-filter="web">Web</button>
  <button class="pill" data-filter="desktop">Desktop</button>
  <button class="pill" data-filter="mobile">Mobile</button>

// Prefix all file paths with BASE so iframe src resolves correctly from this page's location
layouts.forEach(l => { l.file = BASE + l.file; });

// Returns [cssClass, displayLabel] for the platform badge on each card.
// CSS classes are defined in the <style> block above (tag-desktop, tag-mobile, tag-web, tag-layout).
function platformTag(p) {
  if (p==='desktop')   return ['tag-desktop','Desktop'];
  if (p==='mobile')    return ['tag-mobile','Mobile'];
  if (p==='fullwidth') return ['tag-layout','Full Width'];
  if (p==='hover')     return ['tag-layout','Hover'];
  if (p==='sliders')   return ['tag-layout','Carousel'];
  if (p==='redirects') return ['tag-layout','Redirect'];
  if (p==='special')   return ['tag-layout','Special'];
  return ['tag-web','Web'];
}

// Maps tag strings → [cssClass, chipLabel] for the extra badges shown on each card.
// Only tags listed here get a visible chip; unknown tags are silently ignored.
const FEATURE_MAP = {
  video:       ['tag-media',    'Video'],
  slider:      ['tag-interact', 'Slider'],
  hover:       ['tag-interact', 'Hover'],
  scroll:      ['tag-interact', 'Scroll'],
  sticky:      ['tag-interact', 'Sticky'],
  tabs:        ['tag-interact', 'Tabs'],
  interactive: ['tag-interact', 'Interactive'],
  quiz:        ['tag-interact', 'Quiz'],
  link:        ['tag-cta',      'Link'],
  product:     ['tag-layout',   'Product'],
  overlay:     ['tag-layout',   'Overlay'],
  banner:      ['tag-layout',   'Banner'],
  embed:       ['tag-layout',   'Embed'],
  editorial:   ['tag-layout',   'Editorial'],
  table:       ['tag-layout',   'Table'],
  timeline:    ['tag-layout',   'Timeline'],
  '5050':      ['tag-layout',   '50/50'],
  flexi:       ['tag-layout',   'Flexi'],
  collage:     ['tag-layout',   'Collage'],
  grid:        ['tag-layout',   'Grid'],
  text:        ['tag-layout',   'Text'],
  '2-col':     ['tag-layout',   '2-Col'],
  numbered:    ['tag-layout',   'Numbered'],
  stacked:     ['tag-layout',   'Stacked'],
  image:       ['tag-media',    'Image'],
};

// Builds the HTML string of extra tag chips for a card, filtering to only FEATURE_MAP-known tags.
function extraTagHTML(tags) {
  return tags
    .filter(t => FEATURE_MAP[t])
    .map(t => `<span class="tag ${FEATURE_MAP[t][0]}">${FEATURE_MAP[t][1]}</span>`)
    .join('');
}


// ─────────────────────────────────────────────
// CARD GRID — CONSTANTS & STATE
// ─────────────────────────────────────────────
const IFRAME_W        = 1280; // desktop snippet viewport width
const IFRAME_W_MOBILE = 375;  // mobile snippet viewport width
const CARD_W          = 280;  // card thumbnail width (matches CSS minmax)
const ITEMS_PER_PAGE  = 20;

let currentPage       = 1;
let allFilteredItems  = []; // holds the full sorted+filtered list across all pages

// Recalculates iframe scale for every card thumbnail after render or window resize.
// Needed because the grid is fluid (auto-fill minmax) so card width changes with viewport.
// Each iframe is rendered at full snippet width then scaled down with CSS transform to fit the card.
function scaleCardPreviews() {
  const firstPreview = document.querySelector('#grid .card-preview');
  if (!firstPreview) return;
  const cardW = firstPreview.offsetWidth;
  document.querySelectorAll('#grid .card-preview iframe').forEach(f => {
    const pw    = parseInt(f.dataset.previewW || IFRAME_W);
    const scale = cardW / pw;
    const prevH = (f.closest('.card-preview') || {}).offsetHeight || 180;
    f.style.transform = `scale(${scale})`;
    f.style.height    = Math.round(prevH / scale) + 'px'; // compensate height so the iframe fills the card
  });
}

window.addEventListener('resize', scaleCardPreviews);

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────

// Controls the order of section dividers in the grid (top → bottom)
const PLATFORM_ORDER = ['web','desktop','mobile','fullwidth','hover','sliders','redirects','special'];

// Entry point after any filter/search change.
// Sorts all matching items by platform order, resets to page 1, then renders the first page.
function renderCards(items) {
  allFilteredItems = [...items].sort((a, b) => {
    const pDiff = PLATFORM_ORDER.indexOf(a.platform) - PLATFORM_ORDER.indexOf(b.platform);
    if (pDiff !== 0) return pDiff;
    return a.name.localeCompare(b.name);
  });
  currentPage = 1;
  renderPage();
}

// Renders the current page slice of allFilteredItems into the grid.
// Groups items by platform and inserts a section-divider heading above each group.
// Also builds the pagination controls (only shown when totalPages > 1).
function renderPage() {
  const grid        = document.getElementById('grid');
  const badge       = document.getElementById('count-badge');
  const paginationEl    = document.getElementById('pagination');
  const paginationTopEl = document.getElementById('pagination-top');
  grid.innerHTML           = '';
  paginationEl.innerHTML   = '';
  paginationTopEl.innerHTML= '';

  const total      = allFilteredItems.length;
  const totalPages = Math.ceil(total / ITEMS_PER_PAGE);
  badge.textContent = `${total} layout${total!==1?'s':''}`;

  if (!total) {
    grid.innerHTML = '<div class="empty"><span>&#128269;</span><p>No layouts match your search.</p></div>';
    return;
  }

  const start     = (currentPage - 1) * ITEMS_PER_PAGE;
  const end       = Math.min(start + ITEMS_PER_PAGE, total);
  const pageItems = allFilteredItems.slice(start, end);

  // Group the current page's items by platform so we can render section dividers
  const grouped = {};
  pageItems.forEach(item => { (grouped[item.platform]=grouped[item.platform]||[]).push(item); });
  const order  = ['web','desktop','mobile','fullwidth','hover','sliders','redirects','special'];
  const labels = { web:'Web', desktop:'Desktop', mobile:'Mobile', fullwidth:'Full Width', hover:'Hover', sliders:'Carousels', redirects:'Redirects', special:'Special' };

  order.forEach(platform => {
    const group = grouped[platform];
    if (!group) return;
    const div = document.createElement('div');
    div.className = 'section-divider';
    div.textContent = `${labels[platform]} -- ${group.length}`;
    grid.appendChild(div);

    group.forEach(item => {
      const [tagClass, tagLabel] = platformTag(item.platform);
      const card = document.createElement('div');
      card.className = 'card';

      // Mobile snippets use a 375px iframe; everything else uses 1280px desktop width
      const previewW     = item.platform === 'mobile' ? IFRAME_W_MOBILE : IFRAME_W;
      const previewScale = (CARD_W / previewW).toFixed(5);

      card.innerHTML = `
        <div class="card-preview${item.platform === 'mobile' ? ' mobile-preview' : ''}" id="prev-${CSS.escape(item.file)}">
          <iframe
            loading="lazy"
            src="${item.file}"
            style="transform:scale(${previewScale});width:${previewW}px;height:900px;"
            data-preview-w="${previewW}"
            sandbox="allow-same-origin allow-scripts"
            allow="autoplay"
            tabindex="-1"
            aria-hidden="true"
          ></iframe>
          <div class="preview-overlay">
            <button class="preview-btn preview-btn-expand" data-action="expand">Preview</button>
            <button class="preview-btn preview-btn-open"   data-action="open">Open</button>
          </div>
        </div>
        <div class="card-body">
          <div class="card-tags">
            <span class="tag ${tagClass}">${tagLabel}</span>
            ${extraTagHTML(item.tags)}
          </div>
          <div class="card-name">${item.name}</div>
        </div>
        <div class="card-footer">
          <span class="card-filename">${item.file}</span>
          <a class="open-btn" href="${item.file}" target="_blank">Open</a>
        </div>`;

      const iframe = card.querySelector('iframe');
      const prevEl = card.querySelector('.card-preview');
      iframe.addEventListener('load', function onFirstLoad() {
        iframe.removeEventListener('load', onFirstLoad);
        const src = iframe.src;
        iframe.src = 'about:blank';
        requestAnimationFrame(() => { iframe.src = src; });
        iframe.addEventListener('load', function onReady() {
          if (iframe.src !== 'about:blank') {
            iframe.removeEventListener('load', onReady);
            setTimeout(() => prevEl.classList.add('loaded'), 800);
          }
        });
      });

      card.addEventListener('mouseenter', () => card.classList.add('hovered'));
      card.addEventListener('mouseleave', () => card.classList.remove('hovered'));

      card.querySelector('[data-action="expand"]').addEventListener('click', e => {
        e.stopPropagation(); openDrawer(item);
      });
      card.querySelector('[data-action="open"]').addEventListener('click', e => {
        e.stopPropagation(); window.open(item.file, '_blank');
      });
      card.querySelector('.open-btn').addEventListener('click', e => e.stopPropagation());
      card.querySelector('.card-body').addEventListener('click', () => openDrawer(item));

      grid.appendChild(card);
    });
  });

  requestAnimationFrame(scaleCardPreviews);

  if (totalPages > 1) {
    [paginationTopEl, paginationEl].forEach(el => {
      const prev = document.createElement('button');
      prev.className = 'page-btn';
      prev.textContent = '← Prev';
      prev.disabled = currentPage === 1;
      prev.addEventListener('click', () => { currentPage--; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); });

      const input = document.createElement('input');
      input.className = 'page-input';
      input.type = 'text';
      input.value = currentPage;
      input.setAttribute('aria-label', 'Page number');
      input.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const p = parseInt(input.value);
        if (p >= 1 && p <= totalPages && p !== currentPage) {
          currentPage = p;
          renderPage();
          window.scrollTo({top:0,behavior:'smooth'});
        } else {
          input.value = currentPage;
        }
      });
      input.addEventListener('blur', () => { input.value = currentPage; });

      const total = document.createElement('span');
      total.className = 'page-info';
      total.textContent = `/ ${totalPages}`;

      const next = document.createElement('button');
      next.className = 'page-btn';
      next.textContent = 'Next →';
      next.disabled = currentPage === totalPages;
      next.addEventListener('click', () => { currentPage++; renderPage(); window.scrollTo({top:0,behavior:'smooth'}); });

      el.appendChild(prev);
      el.appendChild(input);
      el.appendChild(total);
      el.appendChild(next);
    });
  }
}

// ─────────────────────────────────────────────
// PROMPTS — fetched once from prompts.json, keyed by snippet filename
// ─────────────────────────────────────────────
let promptsCache = null;
let currentPrompt = '';
fetch('layouts/prompts.json')
  .then(r => r.ok ? r.json() : {})
  .then(data => { promptsCache = data; })
  .catch(() => { promptsCache = {}; });

// ─────────────────────────────────────────────
// DRAWER — right-side panel for full preview + code view
// ─────────────────────────────────────────────
const drawer         = document.getElementById('drawer');
const drawerBackdrop = document.getElementById('drawer-backdrop');
const drawerIframe   = document.getElementById('drawer-iframe');
const stageInner     = document.getElementById('stage-inner');
const stageLoader    = document.getElementById('stage-loader');

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderPrompt(text) {
  const lines = text.split('\n');
  let html = '';
  let inSection = false;
  for (const line of lines) {
    const t = line.trim();
    if (!t) continue;
    if (t.startsWith('### ')) {
      if (inSection) html += '</ul></div>';
      html += `<div class="prompt-section"><p class="prompt-heading">${escHtml(t.slice(4))}</p><ul class="prompt-list">`;
      inSection = true;
    } else if (t.startsWith('* ') || t.startsWith('- ')) {
      html += `<li>${escHtml(t.slice(2))}</li>`;
    } else {
      if (inSection) { html += '</ul></div>'; inSection = false; }
      html += `<p class="prompt-intro">${escHtml(t)}</p>`;
    }
  }
  if (inSection) html += '</ul></div>';
  return html;
}

function openDrawer(item) {
  document.getElementById('drawer-title').textContent = item.name;
  document.getElementById('drawer-open').href = item.file;

  const [,pLabel] = platformTag(item.platform);
  document.getElementById('drawer-meta').innerHTML = `
    <div class="meta-item"><label>Platform</label><span>${pLabel}</span></div>
    <div class="meta-item"><label>Layout</label><span>${item.layout}</span></div>
    <div class="meta-item"><label>Mobile</label><span>${item.mobile}</span></div>
    <div class="meta-item"><label>File</label><span>${item.file}</span></div>`;

  document.getElementById('drawer-copy').onclick = () => {
    navigator.clipboard.writeText(item.file).then(() => {
      document.getElementById('drawer-copy').textContent = 'Copied!';
      setTimeout(() => document.getElementById('drawer-copy').textContent = 'Copy path', 1500);
    });
  };

  const snippetPrompt = promptsCache && promptsCache[item.file.replace(BASE, '')];
  currentPrompt = snippetPrompt || '';
  tabPrompt.style.display = snippetPrompt ? '' : 'none';
  document.getElementById('prompt-text').innerHTML = snippetPrompt ? renderPrompt(snippetPrompt) : '';
  if (!snippetPrompt && tabPrompt.classList.contains('active')) setView('preview');

  stageLoader.classList.remove('hidden');
  drawerIframe.src = 'about:blank';
  requestAnimationFrame(() => { drawerIframe.src = item.file; });
  drawerIframe.onload = () => {
    if (drawerIframe.src === 'about:blank') return;
    stageLoader.classList.add('hidden');
    try {
      const doc = drawerIframe.contentDocument;
      const activeW = (document.querySelector('.vp-btn.active') || {}).dataset.w || '1280px';
      // Inject a Bootstrap display-utility shim so snippets that use .d-none/.d-md-block etc.
      // respond correctly to the chosen viewport size without needing a real Bootstrap file.
      if (doc && !doc.getElementById('__bs-shim')) {
        const s = doc.createElement('style');
        s.id = '__bs-shim';
        s.textContent = buildBsShimCSS(vpIsMobile(activeW));
        doc.head.appendChild(s);
      }
      updateIframeViewport(activeW);
    } catch(e) {}
  };

  // Auto-select the most appropriate starting viewport for the snippet's platform
  if      (item.platform === 'mobile')  setViewport('375px',  '375px');
  else if (item.platform === 'desktop') setViewport('1280px', '1280px');
  else                                  setViewport('1280px', '1280px');
  drawer.classList.add('open');
  drawerBackdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  drawer.classList.remove('open');
  drawerBackdrop.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { drawerIframe.src = 'about:blank'; }, 300);
}

document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('drawer-reload').addEventListener('click', () => {
  const btn = document.getElementById('drawer-reload');
  btn.classList.add('reloading');
  stageLoader.classList.remove('hidden');
  const src = drawerIframe.src;
  drawerIframe.src = 'about:blank';
  requestAnimationFrame(() => { drawerIframe.src = src; });
  drawerIframe.addEventListener('load', function onReload() {
    if (drawerIframe.src !== 'about:blank') {
      btn.classList.remove('reloading');
      drawerIframe.removeEventListener('load', onReload);
    }
  });
});
drawerBackdrop.addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key==='Escape') closeDrawer(); });

// Swipe right to close on mobile (right-side drawer dismisses when pushed rightward)
let _swipeStartX = 0, _swipeStartY = 0;
drawer.addEventListener('touchstart', e => {
  _swipeStartX = e.touches[0].clientX;
  _swipeStartY = e.touches[0].clientY;
}, { passive: true });
drawer.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - _swipeStartX;
  const dy = e.changedTouches[0].clientY - _swipeStartY;
  if (dx > 80 && Math.abs(dx) > Math.abs(dy)) closeDrawer();
}, { passive: true });

// Generates a CSS string that overrides Bootstrap responsive display utilities
// to match the selected viewport (mobile vs desktop). This is injected into the snippet iframe
// so that .d-md-none / .d-md-block etc. behave as they would in a real responsive browser.
function buildBsShimCSS(isMobileVP) {
  if (isMobileVP) {
    return [
      '.d-none{display:none!important}',
      '.d-block{display:block!important}',
      '.d-flex{display:flex!important}',
      '.d-inline{display:inline!important}',
      '.d-inline-block{display:inline-block!important}',
      '.d-md-none{display:block!important}',
      '.d-md-block{display:none!important}',
      '.d-md-flex{display:none!important}',
      '.d-md-inline{display:none!important}',
      '.d-md-inline-block{display:none!important}',
      '.d-sm-none{display:none!important}',
      '.d-sm-block{display:block!important}',
    ].join('');
  } else {
    return [
      '.d-none{display:none!important}',
      '.d-block{display:block!important}',
      '.d-flex{display:flex!important}',
      '.d-inline{display:inline!important}',
      '.d-inline-block{display:inline-block!important}',
      '.d-md-none{display:none!important}',
      '.d-md-block{display:block!important}',
      '.d-md-flex{display:flex!important}',
      '.d-md-inline{display:inline!important}',
      '.d-md-inline-block{display:inline-block!important}',
      '.d-sm-none{display:block!important}',
      '.d-sm-block{display:none!important}',
    ].join('');
  }
}

function vpIsMobile(w) {
  return parseInt(w) < 768;
}

// Overrides the viewport meta tag inside the drawer iframe so CSS media queries
// fire at the correct breakpoints for the chosen viewport width.
function updateIframeViewport(w) {
  try {
    const doc = drawerIframe.contentDocument;
    if (!doc) return;
    const px = parseInt(w) || 1280;
    let meta = doc.querySelector('meta[name="viewport"]');
    if (!meta) {
      meta = doc.createElement('meta');
      meta.name = 'viewport';
      doc.head.appendChild(meta);
    }
    meta.setAttribute('content', `width=${px}`);
  } catch(e) {}
}

// Applies a viewport preset to the drawer preview.
// If targetW is wider than the available stage space, the iframe is rendered at full width
// then scaled down with CSS transform — same technique as the card thumbnails.
function setViewport(w, label) {
  document.getElementById('vp-size-display').textContent = label;
  document.querySelectorAll('.vp-btn').forEach(b => b.classList.toggle('active', b.dataset.w===w));

  const availW  = (stageInner.parentElement.clientWidth || 900) - 32; // usable stage width
  const targetW = parseInt(w) || availW;
  const scale   = availW / targetW;

  if (scale < 1) {
    // Target is wider than stage — render at target width then scale down
    stageInner.style.width             = availW + 'px';
    const stageH                       = stageInner.offsetHeight || 600;
    drawerIframe.style.width           = targetW + 'px';
    drawerIframe.style.height          = Math.ceil(stageH / scale) + 'px'; // expand height to compensate for scale
    drawerIframe.style.transform       = `scale(${scale})`;
    drawerIframe.style.transformOrigin = 'top left';
  } else {
    // Target fits — no scaling needed
    stageInner.style.width             = targetW + 'px';
    drawerIframe.style.width           = '100%';
    drawerIframe.style.height          = '100%';
    drawerIframe.style.transform       = '';
    drawerIframe.style.transformOrigin = '';
  }

  try {
    const doc = drawerIframe.contentDocument;
    const shim = doc && doc.getElementById('__bs-shim');
    if (shim) shim.textContent = buildBsShimCSS(vpIsMobile(w));
  } catch(e) {}
  updateIframeViewport(w);
}

document.querySelectorAll('.vp-btn').forEach(btn => {
  btn.addEventListener('click', () => setViewport(btn.dataset.w, btn.dataset.label));
});

// ─────────────────────────────────────────────
// FILTER + SEARCH
// activeFilters is a Set of currently selected pill values (e.g. {'5050', 'image'}).
// AND logic: all active filters must match for an item to show (uses .every()).
// ─────────────────────────────────────────────
const activeFilters = new Set();
let currentSearch = '';

// Returns true if this item satisfies filter f.
// Some filters check platform (e.g. 'web', 'carousel'), others check item.tags.
function itemMatchesFilter(item, f) {
  if (f==='essentials') return item.essential === true;
  if (f==='web')       return item.platform==='web';
  if (f==='desktop')   return item.platform==='desktop';
  if (f==='mobile')    return item.platform==='mobile';
  if (f==='5050')      return item.tags.includes('5050');
  if (f==='flexi')     return item.tags.includes('flexi');
  if (f==='collage')   return item.tags.includes('collage')||item.tags.includes('grid');
  if (f==='video')     return item.tags.includes('video');
  if (f==='fullwidth') return item.platform==='fullwidth';
  if (f==='hover')     return item.platform==='hover';
  if (f==='carousel')  return item.platform==='sliders';
  if (f==='special')   return item.platform==='special';
  if (f==='image') return item.tags.includes('image');
  if (f==='text')      return item.tags.includes('text');
  if (f==='scroll')    return item.tags.includes('scroll') || item.tags.includes('sticky');
  if (f==='editorial') return item.tags.includes('editorial');
  if (f==='product')   return item.tags.includes('product');
  if (f==='link')      return item.tags.includes('link');
  if (f==='redirects') return item.platform==='redirects';
  return false;
}

// Runs after every filter pill click or search keystroke.
// Filters run first (AND across all active pills), then search narrows further.
function applyFilters() {
  let items = layouts;
  if (activeFilters.size > 0) {
    // AND logic — item must satisfy every active filter
    items = items.filter(item => [...activeFilters].every(f => itemMatchesFilter(item, f)));
  }
  if (currentSearch.trim()) {
    // Search matches against file path, display name, layout label, or any tag string
    const q = currentSearch.toLowerCase();
    items = items.filter(item =>
      item.file.toLowerCase().includes(q) ||
      item.name.toLowerCase().includes(q) ||
      item.layout.toLowerCase().includes(q) ||
      item.tags.some(t => t.includes(q))
    );
  }
  renderCards(items);
}

// Refreshes the .active class on all pills to match the current activeFilters Set.
// 'All' pill is active only when no filters are selected.
function syncPillStates() {
  document.querySelectorAll('.pill').forEach(p => {
    const f = p.dataset.filter;
    if (f === 'all') {
      p.classList.toggle('active', activeFilters.size === 0);
    } else {
      p.classList.toggle('active', activeFilters.has(f));
    }
  });
}

// Pill click logic:
// - 'All'       → clears all active filters (shows everything)
// - 'Essentials'→ clears all others and sets only 'essentials' (mutually exclusive)
// - Any other   → removes 'essentials', then toggles this filter on/off (multi-select)
document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    const f = pill.dataset.filter;
    if (f === 'all') {
      activeFilters.clear();
    } else if (f === 'essentials') {
      activeFilters.clear();
      activeFilters.add('essentials');
    } else {
      activeFilters.delete('essentials');
      if (activeFilters.has(f)) activeFilters.delete(f);
      else activeFilters.add(f);
    }
    syncPillStates();
    applyFilters();
  });
});
const searchClear = document.getElementById('searchClear');
document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value;
  searchClear.classList.toggle('visible', e.target.value.length > 0);
  applyFilters();
});
searchClear.addEventListener('click', () => {
  const input = document.getElementById('search');
  input.value = '';
  input.dispatchEvent(new Event('input'));
  input.focus();
});

// VIEW TOGGLE
let viewMode = 'grid';
document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    viewMode = btn.dataset.view;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('grid').classList.toggle('list-mode', viewMode === 'list');
    if (viewMode === 'grid') requestAnimationFrame(scaleCardPreviews);
  });
});

activeFilters.add('essentials');
applyFilters();

// ─────────────────────────────────────────────
// CODE VIEW — fetches the raw snippet file and splits it into CSS / HTML / JS tabs
// ─────────────────────────────────────────────
const codePanel    = document.getElementById('code-panel');
const codePre      = document.getElementById('code-pre');
const codeFilename = document.getElementById('code-filename');
const vpGroup      = document.getElementById('vp-group');
const drawerStage  = document.getElementById('drawer-stage');
const tabPreview   = document.getElementById('tab-preview');
const tabCode      = document.getElementById('tab-code');
const tabPrompt    = document.getElementById('tab-prompt');
const promptPanel  = document.getElementById('prompt-panel');
const codeCopyBtn  = document.getElementById('code-copy-btn');
const langTabs     = document.querySelectorAll('.code-lang-tab');

const splitCache = new Map(); // caches parsed {css, html, js} per file path to avoid re-fetching
let currentFile = '';
let currentLang = 'css';

function highlight(src, type) {
  const e = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  if (type === 'css') return e
    .replace(/(\/\*[\s\S]*?\*\/)/g,             '<span class="hl-cmt">$1</span>')
    .replace(/([\n\s{;])([\w-]+)(\s*:(?!\/))/g, '$1<span class="hl-prop">$2</span>$3');
  if (type === 'js') return e
    .replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g,  '<span class="hl-cmt">$1</span>')
    .replace(/('[^'\n]*'|"[^"\n]*")/g,           '<span class="hl-str">$1</span>')
    .replace(/\b(const|let|var|function|return|if|else|for|forEach|while|new|this|typeof|class|async|await|import|export|from|default|null|undefined|true|false)\b/g,
             '<span class="hl-kw">$1</span>');
  return e // html
    .replace(/(&lt;!--[\s\S]*?--&gt;)/g,         '<span class="hl-cmt">$1</span>')
    .replace(/(&lt;!DOCTYPE[^&]*?&gt;)/gi,        '<span class="hl-cmt">$1</span>')
    .replace(/(&lt;\/)([\w-]+)(&gt;)/g,          '$1<span class="hl-tag">$2</span>$3')
    .replace(/(&lt;)([\w-]+)/g,                  '$1<span class="hl-tag">$2</span>');
}

// Splits a raw HTML file string into its three parts.
// Extracts <style> blocks → css, inline <script> blocks (no src attr) → js, everything else → html.
function parseSections(src) {
  const css = [], js = [];
  const html = src
    .replace(/<style[^>]*>([\s\S]*?)<\/style>/gi, (_, c) => { css.push(c.trim()); return ''; })
    .replace(/<script(?![^>]*\bsrc\b)[^>]*>([\s\S]*?)<\/script>/gi, (_, j) => { j.trim() && js.push(j.trim()); return ''; })
    .trim();
  return { css: css.join('\n\n'), html, js: js.join('\n\n') };
}

function showLang(lang) {
  currentLang = lang;
  langTabs.forEach(t => t.classList.toggle('active', t.dataset.lang === lang));
  const split = splitCache.get(currentFile);
  const sec = split ? split[lang] : '';
  codePre.innerHTML = sec ? highlight(sec, lang) : '<span class="hl-cmt">// (empty)</span>';
}

// Fetches and parses the snippet file, then displays the active language tab.
// Uses splitCache to avoid re-fetching the same file.
// Falls back to a helpful message if fetch fails (e.g. file:// protocol — needs Live Server).
async function loadCode(file) {
  codeFilename.textContent = file;
  currentFile = file;

  if (!splitCache.has(file)) {
    codePre.innerHTML = '<span class="hl-cmt">Loading…</span>';
    let raw = null;
    try {
      const res = await fetch(file);
      if (res.ok) raw = await res.text();
    } catch {}
    if (!raw) {
      langTabs.forEach(t => t.classList.add('empty'));
      codePre.innerHTML =
        '<span class="hl-cmt">// Code view requires a local server.\n' +
        '// In VS Code: right-click index.html → Open with Live Server</span>';
      return;
    }
    splitCache.set(file, parseSections(raw));
  }

  const split = splitCache.get(file);
  langTabs.forEach(t => t.classList.toggle('empty', !split[t.dataset.lang]));
  if (!split[currentLang]) currentLang = ['css', 'html', 'js'].find(l => split[l]) || 'html';
  showLang(currentLang);
}

function setView(mode) {
  const isCode   = mode === 'code';
  const isPrompt = mode === 'prompt';
  tabPreview.classList.toggle('active', mode === 'preview');
  tabCode.classList.toggle('active', isCode);
  tabPrompt.classList.toggle('active', isPrompt);
  drawerStage.style.display = (isCode || isPrompt) ? 'none' : '';
  codePanel.classList.toggle('visible', isCode);
  promptPanel.classList.toggle('visible', isPrompt);
  vpGroup.classList.toggle('hidden', isCode || isPrompt);
}

tabPreview.addEventListener('click', () => setView('preview'));
tabCode.addEventListener('click', () => { setView('code'); if (currentFile) loadCode(currentFile); }); // loadCode is async, fire-and-forget is fine
tabPrompt.addEventListener('click', () => setView('prompt'));
langTabs.forEach(t => t.addEventListener('click', () => { if (!t.classList.contains('empty')) showLang(t.dataset.lang); }));

codeCopyBtn.addEventListener('click', () => {
  const split = splitCache.get(currentFile);
  if (!split) return;
  navigator.clipboard.writeText(split[currentLang] || '').then(() => {
    codeCopyBtn.textContent = 'Copied!';
    setTimeout(() => { codeCopyBtn.textContent = 'Copy'; }, 1500);
  });
});

document.getElementById('prompt-copy-btn').addEventListener('click', () => {
  if (!currentPrompt) return;
  navigator.clipboard.writeText(currentPrompt).then(() => {
    document.getElementById('prompt-copy-btn').textContent = 'Copied!';
    setTimeout(() => { document.getElementById('prompt-copy-btn').textContent = 'Copy'; }, 1500);
  });
});

// Wraps the original openDrawer so that switching cards while the Code tab is open
// immediately loads the new file's code without needing to click the Code tab again.
const _origOpenDrawer = openDrawer;
openDrawer = function(item) {
  currentFile = item.file;
  if (tabCode.classList.contains('active')) loadCode(item.file);
  _origOpenDrawer(item);
};
</script>

      btn.classList.toggle('visible', window.scrollY > 300);

<script>
  // Fade-out page transition for internal navigation links (skips anchors, mailto, external, _blank)
  document.addEventListener('click', function(e) {
    var link = e.target.closest('a');
    if (!link) return;
    var href = link.getAttribute('href');
    if (!href || href.startsWith('#') || href.startsWith('mailto') || href.startsWith('tel') || href.startsWith('http') || link.target === '_blank') return;
    e.preventDefault();
    document.body.style.transition = 'opacity 0.2s ease';
    document.body.style.opacity = '0';
    setTimeout(function() { window.location.href = href; }, 200);
  });
