<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Person Profile */
.person-profile {
  font-family: proxima-nova, sans-serif;
  margin: 100px auto;
  text-align: left;
  width: 40%;
}

/* Mobile — max-width: 767.98px */
@media (max-width: 767.98px) {
  /* Person Profile */
  .person-profile {
    margin: 60px auto;
    width: 90%;
  }
}
</style>

<div class="person-profile">

    <!-- Name + Role -->
    <p style="font-size: 20px; line-height: 1.2;">
        <span style="font-weight: 500;">Name Surname,</span><br>
        <span style="font-style: italic;">Role / Title</span>
    </p>

    <!-- Short editorial description -->
    <p style="font-size: 14px; line-height: 1.2; margin-bottom: 3rem;">
        Short editorial description about this person — their background, philosophy, and connection to the work.
    </p>

    <!-- Q&A pair 1 -->
    <p style="font-size: 14px; line-height: 1.2; font-weight: 500;">
        Question one goes here?
    </p>
    <p style="font-size: 14px; line-height: 1.2;">
        Answer to question one goes here. Keep the tone authentic and direct.
    </p>

    <!-- Q&A pair 2 -->
    <p style="font-size: 14px; line-height: 1.2; font-weight: 500;">
        Question two goes here?
    </p>
    <p style="font-size: 14px; line-height: 1.2;">
        Answer to question two goes here.
    </p>

</div>
