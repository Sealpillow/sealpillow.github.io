<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Main Title Text */
.main-title-text {
  margin: 100px 0px 65px 0px;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Main Title Text */
  .main-title-text {
    margin: 65px 0px 65px 0px;
  }
}

/* Section Links */
.section-links {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  font-size: 12px;
  justify-content: space-between;
  width: 100%;
}

/* Section Links > Left Link > Spacing Text1 */
.section-links .left-link,
.section-links .spacing-text1 {
  font-family: baskerville;
}

/* Left Group */
.left-group {
  display: flex;
  gap: 100px;
  padding-left: 10%;
}

/* Section Links > Spacing Text3 */
.section-links .spacing-text3 {
  font-family: baskerville;
  padding-right: 10%;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Left Group */
  .left-group {
    display: contents;
  }

  /* Section Links > Left Link */
  .section-links .left-link {
    display: block;
    padding-left: 10%;
    text-align: left;
    width: 100%;
  }

  /* Section Links > Spacing Text1 */
  .section-links .spacing-text1 {
    flex: 1;
    padding-left: 10%;
    text-align: left;
  }

  /* Section Links > Spacing Text3 */
  .section-links .spacing-text3 {
    padding-right: 10%;
  }
}
</style>

<!-- Editorial article title + 3-part meta row (handle | role | collab label) -->
<section class="main-title-text text-center">

    <!-- Desktop title -->
    <p class="mb-0 d-none d-lg-block"
        style="font-family: aktiv-grotesk-extended; font-size: 30px; width: 100%; margin: 0 auto; text-align: center; line-height: 30px;">
        Article Title Line One<br>
        Article Title Line Two
    </p>

    <!-- Mobile title -->
    <p class="mb-0 d-block d-lg-none"
        style="font-family: aktiv-grotesk-extended; font-size: 30px; width: 100%; margin: 0 auto; text-align: center; line-height: 30px;">
        Article Title Line One<br>
        Article Title Line Two
    </p>

    <br><br><br>

    <!-- Meta row: handle | role | collab label -->
    <div class="section-links">
        <div class="left-group">
            <span class="left-link">@handle</span>
            <div class="spacing-text1">Role / Discipline</div>
        </div>
        <div class="spacing-text3">Brand x Collaborator</div>
    </div>

</section>
