<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Hero Wrap */
.hero-wrap {
  height: 100vh;
  overflow: hidden;
  position: relative;
}

/* Hero Wrap > Img */
.hero-wrap img {
  height: 100%;
  left: 0;
  object-fit: cover;
  position: absolute;
  top: 0;
  width: 100%;
}

/* Hero Content */
.hero-content {
  align-items: center;
  display: flex;
  flex-direction: column;
  height: 100%;
  justify-content: center;
  left: 0;
  position: absolute;
  text-align: center;
  top: 0;
  width: 100%;
}

/* Hero Eyebrow */
.hero-eyebrow {
  color: rgba(255,255,255,0.7);
  font-family: proxima-nova;
  font-size: 11px;
  letter-spacing: 0.3em;
  margin-bottom: 20px;
  text-transform: uppercase;
}

/* Hero Title */
.hero-title {
  color: #fff;
  font-family: proxima-nova;
  font-size: clamp(2.5rem, 7vw, 6rem);
  font-weight: 300;
  letter-spacing: 0.08em;
  line-height: 1;
}

/* Hero Rule */
.hero-rule {
  background: rgba(255,255,255,0.45);
  height: 1px;
  margin: 28px auto;
  width: 48px;
}

/* Hero Sub */
.hero-sub {
  color: rgba(255,255,255,0.6);
  font-family: proxima-nova;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
}

/* Hero Scroll */
.hero-scroll {
  bottom: 32px;
  color: rgba(255,255,255,0.45);
  font-family: proxima-nova;
  font-size: 9px;
  letter-spacing: 0.25em;
  position: absolute;
  text-transform: uppercase;
}
</style>

<div class="hero-wrap">
  <img src="../../media/landscape-1.jpg" alt="">
  <div class="hero-content">
    <p class="hero-eyebrow">Spring / Summer 2026</p>
    <h1 class="hero-title">A New<br>Dimension</h1>
    <div class="hero-rule"></div>
    <p class="hero-sub">Campaign Editorial</p>
  </div>
  <p class="hero-scroll">Scroll ↓</p>
</div>
