}

@media (max-width: 768px) {

  .main-title-text {
    margin: 65px 0px 65px 0px;

}

/* Section Links */
.section-links {
  align-items: center;
  display: grid;
  font-family: baskerville;
  font-size: 12px;
  grid-template-columns: 1fr auto 1fr auto 1fr;
  width: 100%;
}

/* Section Links > Left Link */
.section-links .left-link {

  grid-column: 1;
}

/* Section Links > Spacing Text1 */
.section-links .spacing-text1 {

  grid-column: 3;
  justify-self: center;
}

/* Section Links > Spacing Text2 */

  grid-column: 4;
  justify-self: center;
}

/* Section Links > Spacing Text3 */
.section-links .spacing-text3 {
  font-family: baskerville;
  grid-column: 5;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Section Links */
  .section-links {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
    row-gap: 5px;
    text-align: center;
  }

  /* Section Links > Left Link */
  .section-links .left-link {
    grid-column: 1;
    grid-row: 1;
    justify-self: start;
    padding-left: 20%

  /* Section Links > Spacing Text1 > Spacing Text2 > Spacing Text3 */
  .section-links .spacing-text1,
    .section-links .spacing-text2,
    .section-links .spacing-text3 {
    grid-row: 2;
  }

  /* Section Links > Spacing Text1 */
  .section-links .spacing-text1 {
    justify-self: start;
    padding-left: 20%
  }

  /* Section Links > Spacing Text3 */
  .section-links .spacing-text3 {
    justify-self: end;
    padding-right: 20%
  }

  /* Section Links */
  .section-links {
    grid-template-columns: 1fr 1fr 1fr;
  }

  /* Section Links > Spacing Text1 */
  .section-links .spacing-text1 {
    grid-column: 1;
  }

  /* Section Links > Spacing Text2 */
  .section-links .spacing-text2 {
    grid-column: 2;
  }

  /* Section Links > Spacing Text3 */
  .section-links .spacing-text3 {
    grid-column: 3;
  }
}
</style>
