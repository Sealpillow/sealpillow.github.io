<style>
  .hero-video-wrap {
    display: block;
    max-width: 100%;
    position: relative;
  }

  .hero-video-wrap video {
    display: block;
    height: auto;
    object-fit: cover;
    width: 100%;
  }

  /* Smooth jump to sections from the hero nav */
  html {
    scroll-behavior: smooth;
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }
  }

  /* Section nav over the video, right side, vertically centred */
  .hero-jump-nav {
    position: absolute;
    top: 50%;
    right: 48px;
    z-index: 2;
    transform: translateY(-50%);
  }

  .hero-jump-nav__list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .hero-jump-nav__link {
    display: flex;
    gap: 34px;
    padding: 1px 0;
    font-family: baskerville, "Libre Baskerville", Georgia, serif;
    font-size: 15px;
    line-height: 1.4;
    color: #000;
    text-decoration: none;
  }

  .hero-jump-nav__link:hover .hero-jump-nav__text,
  .hero-jump-nav__link:focus-visible .hero-jump-nav__text {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .hero-jump-nav__link:focus-visible {
    outline: 1px solid #000;
    outline-offset: 2px;
  }

  .hero-jump-nav__num {
    min-width: 18px;
  }

  /* Icon fixed to the left edge, vertically centred. Once the target section's
     centre reaches it, the script moves it up so it stays level with it. */
  .hero-float-icon {
    position: fixed;
    top: 50%;
    left: 44px;
    z-index: 10;
    transform: translateY(-50%);
    pointer-events: none;
    will-change: transform;
  }

  .hero-float-icon__img {
    display: block;
    width: 88px;
    height: auto;
  }

  /* Mobile */
  @media (max-width: 767.98px) {
    .hero-jump-nav {
      right: 16px;
    }

    .hero-jump-nav__link {
      gap: 14px;
      font-size: 12px;
    }

    .hero-float-icon {
      left: 12px;
    }

    .hero-float-icon__img {
      width: 44px;
    }
  }
</style>

<div class="hero-video-wrap">
  <!-- Desktop -->
  <video class="d-md-block d-none" playsinline autoplay loop muted style="width: 100%; object-fit: cover;">
    <source src="../../media/landscape_video-1.mp4" type="video/mp4">

  <!-- Mobile -->

  <nav class="hero-jump-nav" aria-label="Page sections">

      </li>
      <li class="hero-jump-nav__item">
        <a class="hero-jump-nav__link" href="#section-two"><span class="hero-jump-nav__num">02</span><span class="hero-jump-nav__text">Beyond the Cut</span></a>
      </li>
      <li class="hero-jump-nav__item">
        <a class="hero-jump-nav__link" href="#section-three"><span class="hero-jump-nav__num">03</span><span class="hero-jump-nav__text">The Collection</span></a>
      </li>
    </ol>
  </nav>
</div>

<!-- Place this anywhere after the hero; it stays centred on screen until
     data-stop-at's target scrolls into the middle, then travels with it -->
<div class="hero-float-icon js-hero-float-icon" data-stop-at="#section-three">
  <img class="hero-float-icon__img" src="../../media/product-portrait-1.jpg" alt="">
</div>

<script>
// Fixed icon: stays centred on screen until it lines up with the target
// section's centre, then moves up with it as if it were part of that section.
(function () {
  var icon = document.querySelector('.js-hero-float-icon');
  if (!icon) return;
  var target = document.querySelector(icon.getAttribute('data-stop-at'));
  if (!target) return;
  var ticking = false;

  function update() {
    ticking = false;
    var rect = target.getBoundingClientRect();
    var shift = Math.min(0, rect.top + rect.height / 2 - window.innerHeight / 2);
    icon.style.transform = 'translateY(calc(-50% + ' + shift + 'px))';
  }

  function onScroll() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(update);
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
})();
</script>
