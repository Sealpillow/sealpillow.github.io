<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* Img Swap */
.img-swap {
  display: block;
  overflow: hidden;
  position: relative;
  width: 100%;
}

/* Img Swap > Img */
.img-swap img {
  display: block;
  height: auto;
  width: 100%;
}

/* Img Swap > Img Default */
.img-swap .img-default {
  opacity: 1;
  position: relative;
  transition: opacity 0.4s ease;
}

/* Img Swap > Img Hover */
.img-swap .img-hover {
  height: 100%;
  left: 0;
  object-fit: cover;
  opacity: 0;
  position: absolute;
  top: 0;
  transition: opacity 0.4s ease;
  width: 100%;
}

/* Img Swap:Hover > Img Default */
.img-swap:hover .img-default {
  opacity: 0;
}

/* Img Swap:Hover > Img Hover */
.img-swap:hover .img-hover {
  opacity: 1;
}
</style>
</head>
<body>

  <div style="display: flex; gap: 5px;">

    <div style="flex: 1;">
      <div class="img-swap">
        <img class="img-default" src="../../media/portrait.jpg" alt="">
        <img class="img-hover"   src="../../media/landscape.jpg" alt="">
      </div>
      <p style="font-family: proxima-nova; font-size: 14px; margin: 12px 0 0;">Product Name</p>
    </div>

    <div style="flex: 1;">
      <div class="img-swap">
        <img class="img-default" src="../../media/portrait.jpg" alt="">
        <img class="img-hover"   src="../../media/landscape.jpg" alt="">
      </div>
      <p style="font-family: proxima-nova; font-size: 14px; margin: 12px 0 0;">Product Name</p>
    </div>

    <div style="flex: 1;">
      <div class="img-swap">
        <img class="img-default" src="../../media/portrait.jpg" alt="">
        <img class="img-hover"   src="../../media/landscape.jpg" alt="">
      </div>
      <p style="font-family: proxima-nova; font-size: 14px; margin: 12px 0 0;">Product Name</p>
    </div>

  </div>

</body>
</html>
