<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>

<style>
/* Img Swap */
.img-swap {
  display: block;
  overflow: hidden;
  position: relative;
  width: 100%;
}

/* Img Swap > Img */
.img-swap img {
  display: block;
  height: auto;
  width: 100%;
}

/* Img Swap > Img Default */
.img-swap .img-default {
  opacity: 1;
  position: relative;
  transition: opacity 0.4s ease;
}

/* Img Swap > Img Hover */
.img-swap .img-hover {
  height: 100%;
  left: 0;
  object-fit: cover;
  opacity: 0;
  position: absolute;
  top: 0;
  transition: opacity 0.4s ease;
  width: 100%;
}

/* Img Swap:Hover > Img Default */
.img-swap:hover .img-default {
  opacity: 0;
}

/* Img Swap:Hover > Img Hover */
.img-swap:hover .img-hover {
  opacity: 1;
}

/* Slide Content */
.slide-content {
  overflow: hidden;
  position: relative;
  width: 100%;
}

/* Slide Content > Img */
.slide-content img {
  display: block;
  height: auto;
  object-fit: cover;
  width: 100%;
}

/* Splide Arrows > Splide Pagination */
.splide__arrows,
  .splide__pagination {
  display: none;
}

/* Splide Track */
.splide__track {
  cursor: grab;
}

/* Splide Track:Active */
.splide__track:active {
  cursor: grabbing;
}
</style>

<!-- DESKTOP: 3-column hover swap grid -->
<div class="d-md-flex d-none" style="gap: 5px;">

  <div style="flex: 1;">
    <a href="$url('Page-Show', 'cid', 'page-id')$">
      <div class="img-swap">
        <img class="img-default" src="../../media/portrait-1.jpg" alt="">
        <img class="img-hover" src="../../media/landscape-1.jpg" alt="">
      </div>
    </a>
    <p style="font-family: proxima-nova; font-size: 14px; margin: 12px 0 0;">Product Name</p>
  </div>

  <div style="flex: 1;">
    <a href="$url('Page-Show', 'cid', 'page-id')$">
      <div class="img-swap">
        <img class="img-default" src="../../media/portrait-2.jpg" alt="">
        <img class="img-hover" src="../../media/landscape-2.jpg" alt="">
      </div>
    </a>
    <p style="font-family: proxima-nova; font-size: 14px; margin: 12px 0 0;">Product Name</p>
  </div>

  <div style="flex: 1;">
    <a href="$url('Page-Show', 'cid', 'page-id')$">
      <div class="img-swap">
        <img class="img-default" src="../../media/portrait-1.jpg" alt="">
        <img class="img-hover" src="../../media/landscape-1.jpg" alt="">
      </div>
    </a>
    <p style="font-family: proxima-nova; font-size: 14px; margin: 12px 0 0;">Product Name</p>
  </div>

</div>

<!-- MOBILE: Splide carousel -->
<div class="d-block d-md-none">
  <div class="splide" id="hoverSwapSlider">
    <div class="splide__track">
      <ul class="splide__list"></ul>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const slider = document.getElementById('hoverSwapSlider');
  if (!slider) return;
  const list = slider.querySelector('.splide__list');

  const slides = [
    { src: '../../media/portrait-1.jpg', alt: 'Slide 1', url: "$url('Page-Show', 'cid', 'page-id')$", label: 'Product Name' },
    { src: '../../media/portrait-2.jpg', alt: 'Slide 2', url: "$url('Page-Show', 'cid', 'page-id')$", label: 'Product Name' },
    { src: '../../media/portrait-1.jpg', alt: 'Slide 3', url: "$url('Page-Show', 'cid', 'page-id')$", label: 'Product Name' },
  ];

  slides.forEach(slide => {
    const li = document.createElement('li');
    li.className = 'splide__slide';

    const wrapper = document.createElement('div');
    wrapper.className = 'slide-content';

    wrapper.innerHTML = `
      <a href="${slide.url}">
        <img src="${slide.src}" alt="${slide.alt}">
      </a>
      <p style="font-family: proxima-nova; font-size: 14px; margin: 12px 0 0;">${slide.label}</p>
    `;

    li.appendChild(wrapper);
    list.appendChild(li);
  });

  new Splide('#hoverSwapSlider', {
    type: 'loop',
    drag: 'free',
    perPage: 1,
    arrows: false,
    pagination: false,
    padding: { right: '6rem' },
  }).mount();
});
</script>
