<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
/* P */
p {
  color: black;
  font-size: 18px;
  line-height: 1.6;
}

/* Grey */
.grey {
  color: black;
  transition: color 0.3s ease;
}

/* P > Grey */
p:hover .grey {
  color: #aaa;
}
</style>
</head>
<body>
  <p>
    This is a <span class="grey">hidden</span> message where certain 
    <span class="grey">words</span> will grey out when you hover the paragraph.
  </p>
</body>
</html>
