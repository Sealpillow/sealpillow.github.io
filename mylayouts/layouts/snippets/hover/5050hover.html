  <style>
/* Hover Half Section */
.hover-half-section {
  width: 100%;
}

/* Hover Half Grid */
.hover-half-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

/* Hover Half Block */
.hover-half-block {
  aspect-ratio: 4 / 3;
  flex: 1 1 48%;
  overflow: hidden;
  position: relative;
}

/* Hover Half Block > Img */
.hover-half-block img {
  height: 100%;
  inset: 0;
  object-fit: cover;
  position: absolute;
  transition: opacity 0.4s ease;
  width: 100%;
}

/* Hover Half Block > Hover Img */
.hover-half-block .hover-img {
  opacity: 0;
  z-index: 2;
}

/* Hover Half Block > Hover Img */
.hover-half-block:hover .hover-img {
  opacity: 1;
}

/* Hover Half Block > Default Img */
.hover-half-block:hover .default-img {
  opacity: 0;
}

/* Hover Half Caption */
.hover-half-caption {
  bottom: 10px;
  font-size: 0.9rem;
  left: 10px;
  padding: 4px 8px;
  position: absolute;
  z-index: 3;
}

/* Mobile — max-width: 767px */
@media (max-width: 767px) {
  /* Hover Half Block */
  .hover-half-block {
    flex: 1 1 100%;
    gap: 0px;
  }
}
</style>
