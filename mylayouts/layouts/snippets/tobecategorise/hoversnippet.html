    <style>


.slider-container {
    width: 100%;
    overflow: hidden;
    position: relative;
  }
  .slide-content {
    width: 100%;
    overflow: hidden;
    position: relative;
  }
  .slide-content img,
  .slide-content video {
    width: 100%;
    height: auto;
    object-fit: cover;
    display: block;
  }

  /* Text below each slide image, outside the image */
  .slide-text {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 10;
  }
  .slide-text h3 {
    font-size: 14px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  .slide-text p {
    font-size: 12px;
    margin: 0;
  }

  /* Hide arrows & pagination */
  .splide__arrows,
  .splide__pagination { display: none; }

  .splide__track { cursor: grab; }
  .splide__track:active { cursor: grabbing; }


    /* ----------------------------------------------------
    RESPONSIVENESS
    ---------------------------------------------------- */

    /* Mobile: stack vertically */
    @media (max-width: 767px) {
        .img-left-text {

        }

    }

    .img-swap .img-hover { display: none; }
    .img-swap:hover .img-default { display: none; }
    .img-swap:hover .img-hover { display: block; }
 </style>

<div class="d-block d-md-none slider-container">
    <div class="splide" id="carouselExploreSlider3">
        <div class="splide__track">
            <ul class="splide__list"></ul>
        </div>
    </div>
</div>




<script>
  document.addEventListener('DOMContentLoaded', function () {

    function createSplideSliderCarousel({ sliderId, slides, options = {} }) {

    const slider = document.getElementById(sliderId);
    if (!slider) return;

    const list = slider.querySelector('.splide__list');

    slides.forEach(slide => {
      const li = document.createElement('li');
      li.className = 'splide__slide';

      const wrapper = document.createElement('div');
      wrapper.className = 'slide-content';

      // Media
      let mediaHtml = '';
      if (slide.type === 'video') {
        mediaHtml = `
          <video autoplay muted loop playsinline">
            <source src="${slide.src}" type="video/mp4">
          </video>
        `;
      } else {
        mediaHtml = `<img src="${slide.src}" alt="${slide.alt || ''}" ">`;
      }

      // Wrap in anchor
      let content = '';
      if (slide.url) {
        if (slide.analytics) {
          content = `<a href="${slide.url}" data-content-analytic='{"contentId": "${slide.analytics}", "contentType": "asset"}'>${mediaHtml}</a>`;
        } else {
          content = `<a href="${slide.url}">${mediaHtml}</a>`;
        }
      } else {
        content = mediaHtml;
      }

      // Text below image (outside anchor)
      if (slide.title || slide.description) {
        content += `
          <div class="slide-text" style="color:${slide.textcolor}">
            ${slide.title ? `<h3>${slide.title}</h3>` : ''}
            ${slide.description ? `<p>${slide.description}</p>` : ''}
          </div>
        `;
      }

      wrapper.innerHTML = content;
      li.appendChild(wrapper);
      list.appendChild(li);
    });

    const splide = new Splide(`#${sliderId}`, {
      type: 'loop',
      drag: 'free',
      focus: 'center',
      perPage: 3,
      gap: 5,
      arrows: false,
      pagination: false,
      padding: { left: '0rem', right: '6rem' },
      breakpoints: {
        1024: { perPage: 1 },
        640: { perPage: 1 },
      },
      ...options,
    });

    splide.mount();
  }

  createSplideSliderCarousel({
  sliderId: 'carouselExploreSlider3',
  slides: [
      { type: 'image', src: "images/curated-by-the-house/design-philosophy/demi/20apr26/dp-demi-g1-hover.jpg?$staticlink$", alt: 'Slide 3', url:"$url('Page-Show', 'cid', 'summer-demi-pastel-edition')$"},
      { type: 'image', src: "images/curated-by-the-house/design-philosophy/demi/dp-demi-f1_hover.jpg?$staticlink$", alt: 'Slide 3', url:"$url('Page-Show', 'cid', 'demi-global-edition-series')$"},
      { type: 'image', src: "images/curated-by-the-house/design-philosophy/demi/dp-demi-f2_hover.jpg?$staticlink$", alt: 'Slide 3', url:"$url('Page-Show', 'cid', anatomy-of-empowerment-demi')$"}
  ],
  options: {
    perPage: 1,
  }
  });

});
</script>
