<style>
  /* Root snapping only while the component is on the page */
  html:has(.snap-feature) {
    scroll-snap-type: y mandatory;
    scroll-padding-top: var(--snap-feature-offset, 0px);
  }

  /* Snap point at the very top so the header stays reachable */
  html:has(.snap-feature) body {
    scroll-snap-align: start;
  }

  .snap-feature {
    --snap-feature-offset: 0px; /* set to sticky header height, e.g. 64px */
    --snap-feature-ink: #1a1a1a;
    --snap-feature-muted: #767676;
    --snap-feature-bg: #ffffff;
    background: var(--snap-feature-bg);
    color: var(--snap-feature-ink);
  }

  .snap-feature__project {
    display: grid;
    grid-template-rows: 1fr auto;
    height: calc(100svh - var(--snap-feature-offset));
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
  }

  .snap-feature__figure {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    margin: 0;
    padding: 24px 16px 0;
  }

  .snap-feature__media {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }

  .snap-feature__caption {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 12px 16px 20px;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
  }

  .snap-feature__title {
    margin: 0;
    font-size: inherit;
    font-weight: 500;
  }

  .snap-feature__client {
    margin: 0;
    color: var(--snap-feature-muted);
  }

  /* Lets the page release into whatever follows the component */
  .snap-feature__release {
    height: 1px;
    scroll-snap-align: start;
  }
</style>

<section class="snap-feature">
  <article class="snap-feature__project">
    <figure class="snap-feature__figure">
      <img class="snap-feature__media" src="https://picsum.photos/id/1011/900/1200" alt="" loading="eager">
    </figure>
    <div class="snap-feature__caption">
      <h2 class="snap-feature__title">The Dare</h2>
      <p class="snap-feature__client">PEDRO Fall Winter</p>
    </div>
  </article>

  <article class="snap-feature__project">
    <figure class="snap-feature__figure">
      <img class="snap-feature__media" src="https://picsum.photos/id/1025/900/1200" alt="" loading="lazy">
    </figure>
    <div class="snap-feature__caption">
      <h2 class="snap-feature__title">Weekend Edit</h2>
      <p class="snap-feature__client">PEDRO Studio</p>
    </div>
  </article>

  <article class="snap-feature__project">
    <figure class="snap-feature__figure">
      <img class="snap-feature__media" src="https://picsum.photos/id/1040/900/1200" alt="" loading="lazy">
    </figure>
    <div class="snap-feature__caption">
      <h2 class="snap-feature__title">City Lines</h2>
      <p class="snap-feature__client">PEDRO Men</p>
    </div>
  </article>

  <div class="snap-feature__release" aria-hidden="true"></div>
</section>
