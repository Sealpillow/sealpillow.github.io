<style>
  .circular {
    --circular-text: #000;
    --circular-muted: #333;
    --circular-center: 460px;
    --circular-gap: 64px;
    --circular-sticky-top: 40px;
    padding: 40px 24px 0;
    color: var(--circular-text);
    background: #fff;
  }

  .circular__grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, var(--circular-center)) minmax(0, 1fr);
    grid-template-areas:
      ".     intro aside"
      "label body  aside"
      ".     media aside";
    column-gap: var(--circular-gap);
    max-width: 1440px;
    margin: 0 auto;
    clip-path: inset(0);
  }

  /* Label */
  .circular__label {
    grid-area: label;
    justify-self: center;
    margin: 0;
    font-family: baskerville, "Libre Baskerville", Georgia, serif;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.35;
  }

  /* The Collection slider: slides keep their own proportions, centre slide grows */
  .circular--collection {
    --circular-slide-h: clamp(120px, 20vw, 230px);
    --circular-slide-h-active: calc(var(--circular-slide-h) * 1.5);
    --circular-slide-gap: 10px;
    --circular-slide-speed: 0.6s;
    padding-top: 120px;
    padding-bottom: 120px;
    padding-left: 0;
    padding-right: 0;
  }

  .circular--collection .circular__grid {
    grid-template-areas: "label . .";
    padding: 0 24px;
    margin-bottom: 24px;
    clip-path: none;
  }

  .circular__slider {
    position: relative;
    overflow: hidden;
    height: var(--circular-slide-h-active);
    outline: none;
  }

  .circular__slider:focus-visible {
    outline: 1px solid var(--circular-text);
    outline-offset: 4px;
  }

  /* Hidden element used by the script to read the slide heights in px */
  .circular__slider-probe {
    position: absolute;
    visibility: hidden;
    pointer-events: none;
    width: var(--circular-slide-h);
    height: var(--circular-slide-h-active);
  }

  .circular__slider-track {
    display: flex;
    align-items: center;
    gap: var(--circular-slide-gap);
    height: 100%;
    touch-action: pan-y;
    cursor: grab;
    user-select: none;
    will-change: transform;
    transition: transform var(--circular-slide-speed) cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .circular__slider-track--dragging {
    cursor: grabbing;
    transition: none;
  }

  .circular__slide {
    flex: 0 0 auto;
    height: var(--circular-slide-h);
    cursor: pointer;
    transition: height var(--circular-slide-speed) cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .circular__slide--active {
    height: var(--circular-slide-h-active);
    cursor: grab;
  }

  .circular__slider-track--dragging .circular__slide {
    transition: none;
  }

  .circular__slide-img {
    display: block;
    width: auto;
    height: 100%;
    pointer-events: none;
    -webkit-user-drag: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .circular__slider-track,
    .circular__slide {
      transition: none;
    }
  }

  /* Mobile */
  @media (max-width: 767.98px) {
    .circular__grid {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "intro"
        "label"
        "body"
        "aside"
        "media";
      clip-path: none;
    }

    .circular--collection {
      --circular-slide-h: 32vw;
      --circular-slide-gap: 6px;
      padding-top: 56px;
      padding-bottom: 56px;
    }

    .circular--collection .circular__grid {
      grid-template-areas: "label";
      margin-bottom: 16px;
    }
  }
</style>

<section class="circular circular--collection" id="circular-collection">
  <div class="circular__grid">
    <h2 class="circular__label">The Collection</h2>
  </div>

  <div class="circular__slider js-circular-slider" tabindex="0" role="region" aria-roledescription="carousel" aria-label="The Collection">
    <div class="circular__slider-probe" aria-hidden="true"></div>
    <div class="circular__slider-track">
      <div class="circular__slide" role="group" aria-roledescription="slide" aria-label="1 of 4">
        <img class="circular__slide-img" src="images/testfile/12.jpg?$staticlink$" alt="Stack of round leather coasters" >
      </div>
      <div class="circular__slide" role="group" aria-roledescription="slide" aria-label="2 of 4">
        <img class="circular__slide-img" src="images/testfile/13.jpg?$staticlink$" alt="Heart-shaped leather charm on a bag" >
      </div>
      <div class="circular__slide" role="group" aria-roledescription="slide" aria-label="3 of 4">
        <img class="circular__slide-img" src="images/testfile/14.jpg?$staticlink$" alt="Round black leather pouch" >
      </div>
      <div class="circular__slide" role="group" aria-roledescription="slide" aria-label="4 of 4">
        <img class="circular__slide-img" src="images/testfile/15.jpg?$staticlink$" alt="Black leather key loop" >
      </div>
    </div>
  </div>
</section>

<script>
// Fixed icon: stays centred on screen until it lines up with the slider's centre,
// then moves up with the slider as if it were part of that section
(function () {
  var icon = document.querySelector('.js-circular-icon');
  if (!icon) return;
  var target = document.querySelector(icon.getAttribute('data-stop-at'));
  if (!target) return;
  var ticking = false;

  function update() {
    ticking = false;
    var rect = target.getBoundingClientRect();
    var shift = Math.min(0, rect.top + rect.height / 2 - window.innerHeight / 2);
    icon.style.transform = 'translateY(calc(-50% + ' + shift + 'px))';
  }

  function onScroll() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(update);
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
})();

(function () {
  document.querySelectorAll('.js-circular-slider').forEach(function (slider) {
    var track = slider.querySelector('.circular__slider-track');
    var probe = slider.querySelector('.circular__slider-probe');
    var slides = Array.prototype.slice.call(track.querySelectorAll('.circular__slide'));
    if (!slides.length) return;
    var imgs = slides.map(function (slide) {
      return slide.querySelector('.circular__slide-img');
    });

    var draggingClass = 'circular__slider-track--dragging';
    var activeClass = 'circular__slide--active';
    var start = parseInt(slider.getAttribute('data-start'), 10);
    var index = isNaN(start) ? Math.floor((slides.length - 1) / 2) : start;
    var startX = null;
    var delta = 0;
    var dragged = false;

    function metrics() {
      return {
        h: probe.offsetWidth,
        hActive: probe.offsetHeight,
        gap: parseFloat(getComputedStyle(track).columnGap) || 0
      };
    }

    // Width / height of each image, 1 until it has loaded
    function ratio(n) {
      var img = imgs[n];
      return img && img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 1;
    }

    // Uses the final (settled) widths, so the centre lands correctly while sizes animate
    function render() {
      var m = metrics();
      var offset = 0;
      for (var j = 0; j < index; j++) offset += m.h * ratio(j) + m.gap;
      offset += (m.hActive * ratio(index)) / 2;
      var x = slider.clientWidth / 2 - offset + delta;
      track.style.transform = 'translate3d(' + x + 'px, 0, 0)';
    }

    function goTo(i) {
      index = Math.min(Math.max(i, 0), slides.length - 1);
      slides.forEach(function (slide, n) {
        var isActive = n === index;
        slide.classList.toggle(activeClass, isActive);
        slide.setAttribute('aria-current', isActive ? 'true' : 'false');
      });
      render();
    }

    track.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      startX = e.clientX;
      delta = 0;
      dragged = false;
    });

    track.addEventListener('pointermove', function (e) {
      if (startX === null) return;
      delta = e.clientX - startX;
      if (!dragged && Math.abs(delta) > 6) {
        dragged = true;
        track.classList.add(draggingClass);
        track.setPointerCapture(e.pointerId);
      }
      if (dragged) render();
    });

    function endDrag() {
      if (startX === null) return;
      startX = null;
      track.classList.remove(draggingClass);
      if (!dragged) return;
      var m = metrics();
      var steps = Math.round(-delta / (m.h * ratio(index) + m.gap));
      if (steps === 0 && Math.abs(delta) > 40) steps = delta < 0 ? 1 : -1;
      delta = 0;
      goTo(index + steps);
    }

    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);

    // Click a side slide to bring it to the centre
    track.addEventListener('click', function (e) {
      if (dragged) {
        dragged = false;
        return;
      }
      var slide = e.target.closest('.circular__slide');
      if (slide) goTo(slides.indexOf(slide));
    });

    slider.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goTo(index - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        goTo(index + 1);
      }
    });

    window.addEventListener('resize', render);

    imgs.forEach(function (img) {
      if (img && !img.complete) img.addEventListener('load', render);
    });

    // First paint without animating into place
    track.classList.add(draggingClass);
    goTo(index);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        track.classList.remove(draggingClass);
      });
    });
  });
})();
</script>
