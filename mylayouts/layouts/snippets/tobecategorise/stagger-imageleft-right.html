<!-- ============================================================
     Snippet: editorial-staggered-duo-product
     Use case: Product/lookbook staggered image pair, no copy —
     left image sits higher and smaller, right image sits lower
     and larger, creating asymmetric editorial rhythm.
     Assets: product-a.jpg, product-b.jpg (swap to real static paths)
     ============================================================ -->

<style>
  .staggered-duo {
    width: 100%;
    margin: 0 auto;
  }

  .staggered-duo__grid {
    display: flex;
    align-items: flex-start;
    gap: 40px;
  }

  /* Left column: smaller image, anchored at the top */
  .staggered-duo__col--left {
    flex: 0 0 45%;
  }

  /* Right column: larger image, pushed down to sit lower than the left shot */
  .staggered-duo__col--right {
    flex: 0 0 50%;
    margin-left: auto;
    margin-top: 90px;
  }

  .staggered-duo__img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: cover;
  }

  .staggered-duo__col--left .staggered-duo__img {
    aspect-ratio: 4 / 3;
  }

  .staggered-duo__col--right .staggered-duo__img {
    aspect-ratio: 4 / 5;
  }

  /* Mobile: stack in natural order, drop the offset */
  @media (max-width: 768px) {
    .staggered-duo__grid {
      flex-direction: column;
      gap: 24px;
    }
    .staggered-duo__col--left,
    .staggered-duo__col--right {
      flex: 0 0 100%;
      margin: 0;
    }
  }
</style>

<section class="staggered-duo">
  <div class="staggered-duo__grid">

    <!-- LEFT: smaller image, sits higher -->
    <div class="staggered-duo__col--left">
      <a href="$url('Product-Show','pid','PW2-15060012-4_BLK.CA')$">
        <picture>
          <source srcset="images/thejournal/2026/aug26/in-dialogue-with-ana-kras/dialogue-ana-kras-d1.jpg?$staticlink$" media="(min-width: 768px)">
          <img src="images/thejournal/2026/aug26/in-dialogue-with-ana-kras/dialogue-ana-kras-d1.jpg?$staticlink$" alt="" class="staggered-duo__img">
        </picture>
      </a>
    </div>

    <!-- RIGHT: larger image, sits lower -->
    <div class="staggered-duo__col--right">
      <a href="$url('Product-Show','pid','PW2-15060012-4_BLK.CA')$">
        <picture>
          <source srcset="images/thejournal/2026/aug26/in-dialogue-with-ana-kras/dialogue-ana-kras-d2.jpg?$staticlink$" media="(min-width: 768px)">
          <img src="images/thejournal/2026/aug26/in-dialogue-with-ana-kras/dialogue-ana-kras-d2.jpg?$staticlink$" alt="" class="staggered-duo__img">
        </picture>
      </a>
    </div>

  </div>
</section>
