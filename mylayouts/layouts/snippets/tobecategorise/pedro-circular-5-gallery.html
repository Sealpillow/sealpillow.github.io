<style>
  .circular {
    --circular-text: #000;
    --circular-muted: #333;
    --circular-center: 460px;
    --circular-gap: 64px;
    --circular-sticky-top: 40px;
    padding: 40px 24px 0;
    color: var(--circular-text);
    background: #fff;
  }

  .circular__grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, var(--circular-center)) minmax(0, 1fr);
    grid-template-areas:
      ".     intro aside"
      "label body  aside"
      ".     media aside";
    column-gap: var(--circular-gap);
    max-width: 1440px;
    margin: 0 auto;
    clip-path: inset(0);
  }

  /* Gallery (part 1): one large + two tall images, from centre column to the right edge */
  .circular--gallery {
    padding-top: 40px;
    padding-bottom: 0;
  }

  .circular--gallery .circular__grid {
    grid-template-areas: ". gallery gallery";
    clip-path: none;
  }

  .circular__gallery {
    grid-area: gallery;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(0, 1fr);
    gap: 10px;
    aspect-ratio: 37 / 22;
  }

  /* Shared gallery tile */
  .circular__tile {
    min-height: 0;
    margin: 0;
    overflow: hidden;
  }

  .circular__tile-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Tablet */
  @media (max-width: 991.98px) {
    .circular {
      --circular-center: 420px;
      --circular-gap: 32px;
    }
  }

  /* Mobile */
  @media (max-width: 767.98px) {
    .circular__grid {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "intro"
        "label"
        "body"
        "aside"
        "media";
      clip-path: none;
    }

    .circular--gallery .circular__grid {
      grid-template-areas: "gallery";
    }

    .circular__gallery {
      gap: 6px;
    }
  }
</style>

<section class="circular circular--gallery">
  <div class="circular__grid">

    <div class="circular__gallery">
      <div class="circular__tile">
        <img class="circular__tile-img" src="images/testfile/6.jpg?$staticlink$" alt="Annotated paper pattern pieces on a cutting mat" loading="lazy">
      </div>
      <div class="circular__tile">
        <img class="circular__tile-img" src="images/testfile/7.jpg?$staticlink$" alt="Dark brown leather pendant on a cord" loading="lazy">
      </div>
    </div>

  </div>
</section>
