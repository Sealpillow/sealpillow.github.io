<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trail & Co — Company Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E7DFC6;
    --paper-dark: #DCD1AE;
    --ink: #23201C;
    --card: #FBF7EE;
    --thread: #7A3B2E;
    --stamp: #33534C;
    --line: rgba(35, 32, 28, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--paper);
    font-family: 'Lora', serif;
    color: var(--ink);
    overflow-x: auto;
    overflow-y: hidden;
    cursor: grab;
  }

  body.grabbing { cursor: grabbing; }

  /* subtle paper grain so flat kraft color doesn't feel flat/AI-flat */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(rgba(35,32,28,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  body::-webkit-scrollbar { height: 10px; }
  body::-webkit-scrollbar-track { background: var(--paper-dark); }
  body::-webkit-scrollbar-thumb { background: var(--thread); border-radius: 10px; }

  /* ---- Intro marker ---- */
  .intro {
    min-width: 46vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8vw;
    position: relative;
    border-right: 1px dashed var(--line);
  }

  .intro .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--thread);
    margin-bottom: 18px;
  }

  .intro h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-size: clamp(38px, 5vw, 64px);
    line-height: 1.02;
    max-width: 9ch;
    color: var(--ink);
  }

  .intro p {
    margin-top: 22px;
    max-width: 34ch;
    font-size: 17px;
    line-height: 1.7;
    color: rgba(35,32,28,0.72);
  }

  .intro .drag-note {
    margin-top: 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--stamp);
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 1;
    transition: opacity 0.5s ease;
  }

  .intro .drag-note.is-hidden { opacity: 0; }

  .intro .drag-note svg { width: 22px; height: 14px; }

  /* ---- Timeline wrapper ---- */
  .timeline-wrapper {
    display: flex;
    width: max-content;
    position: relative;
    z-index: 1;
  }

  .timeline-section {
    min-width: 62vw;
    max-width: 620px;
    height: 100vh;
    display: flex;
    align-items: center;
    padding: 0 5vw;
    position: relative;
    border-right: 1px dashed var(--line);
  }

  .timeline-section:nth-child(even) { background: var(--paper-dark); }

  /* ---- Tag card ---- */
  .tag-card {
    background: var(--card);
    width: 100%;
    padding: 46px 42px 40px;
    position: relative;
    box-shadow: 0 18px 40px rgba(35,32,28,0.16);
    border: 1px solid var(--line);
    opacity: 0;
    transform: translateY(28px) rotate(var(--tilt, -1.2deg));
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .timeline-section:nth-child(odd) .tag-card { --tilt: -1.4deg; }
  .timeline-section:nth-child(even) .tag-card { --tilt: 1.1deg; }

  .tag-card.is-visible {
    opacity: 1;
    transform: translateY(0) rotate(var(--tilt, -1.2deg));
  }

  /* stitched border effect */
  .tag-card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1.5px dashed rgba(122, 59, 46, 0.35);
    pointer-events: none;
  }

  /* punch hole + string loop, top left */
  .tag-card::after {
    content: "";
    position: absolute;
    top: -13px;
    left: 38px;
    width: 16px;
    height: 16px;
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 50%;
    box-shadow: 0 0 0 1px var(--card);
  }

  .stamp {
    position: absolute;
    top: 24px;
    right: 30px;
    width: 76px;
    height: 76px;
    border: 2px solid var(--stamp);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(-9deg);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--stamp);
    text-align: center;
    line-height: 1.3;
  }

  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--thread);
    margin-bottom: 16px;
  }

  .year-title {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: rgba(35,32,28,0.5);
    margin-bottom: 6px;
  }

  .title {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 30px;
    line-height: 1.12;
    margin-bottom: 18px;
    max-width: 15ch;
  }

  .description {
    font-size: 16px;
    line-height: 1.75;
    color: rgba(35,32,28,0.78);
    font-style: italic;
    max-width: 40ch;
  }

  /* ---- Fixed tape-measure progress bar ---- */
  .tape {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 46px;
    background: var(--ink);
    z-index: 50;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }

  .tape-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: var(--thread);
    z-index: 0;
    transition: width 0.05s linear;
  }

  .tape-ticks {
    position: relative;
    z-index: 1;
    display: flex;
    width: 100%;
    height: 100%;
  }

  .tape-tick {
    flex: 1;
    border-left: 1px solid rgba(251,247,238,0.25);
    display: flex;
    align-items: flex-end;
    padding: 0 0 6px 8px;
    cursor: pointer;
    background: transparent;
    transition: background 0.2s ease;
  }

  .tape-tick:hover {
    background: rgba(251,247,238,0.08);
  }

  .tape-tick span {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: rgba(251,247,238,0.55);
    transition: color 0.2s ease;
  }

  .tape-tick.is-active span {
    color: #FBF7EE;
    font-weight: 500;
  }
</style>
</head>
<body>

  <div class="timeline-wrapper" id="timelineWrapper">
    <div class="intro">
      <div class="eyebrow">Trail &amp; Co — Est. 2020</div>
      <h1>Seven years on the last</h1>
      <p>Every pair starts as a tag on a workbench. This is the record of ours — one entry per milestone, in order.</p>
      <div class="drag-note" id="dragNote">
        <svg viewBox="0 0 22 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 7H21M21 7L15 1M21 7L15 13" stroke="#33534C" stroke-width="1.5"/>
        </svg>
        Drag or scroll to read on
      </div>
    </div>
    <!-- Timeline sections injected here -->
  </div>

  <div class="tape" id="tape">
    <div class="tape-fill" id="tapeFill"></div>
    <div class="tape-ticks" id="tapeTicks"></div>
  </div>

<script>
(function () {
  const timelineData = [
    {
      year: 2020,
      date: "Jan 2020",
      title: "First Last Carved",
      description: "A single wooden last, cut by hand, became the pattern every shoe in the line still traces back to.",
      badge: "No. 01"
    },
    {
      year: 2020,
      date: "Mar 2020",
      title: "The Workbench Sample",
      description: "Three stitched prototypes, none for sale, all for testing whether the idea survived contact with a real foot.",
      badge: "No. 02"
    },
    {
      year: 2020,
      date: "Jul 2020",
      title: "Fifty Pairs, Friends Only",
      description: "A trial run sent to people who'd tell us the truth. Half the seams got redrawn after their notes came back.",
      badge: "No. 03"
    },
    {
      year: 2020,
      date: "Dec 2020",
      title: "Opening the Ledger",
      description: "Version one went on sale with a paper care card in every box, numbered by hand at a kitchen table.",
      badge: "No. 04"
    },
    {
      year: 2021,
      date: "Jun 2021",
      title: "The Reinforced Heel",
      description: "Our most-returned complaint became our most-rebuilt part. The fix outlasted the shoe it was fixing.",
      badge: "No. 05"
    },
    {
      year: 2022,
      date: "Jan 2022",
      title: "Second Workshop Opens",
      description: "A cutting floor twice the size, three time zones of wholesale partners, and a lot more tags to print.",
      badge: "No. 06"
    },
    {
      year: 2022,
      date: "Sep 2022",
      title: "10,000th Pair Logged",
      description: "The ledger crossed five digits. We kept the numbering system anyway — it's the only part we never redesigned.",
      badge: "No. 07"
    }
  ];

  const wrapper = document.getElementById('timelineWrapper');
  const tapeTicks = document.getElementById('tapeTicks');
  const tapeFill = document.getElementById('tapeFill');
  const dragNote = document.getElementById('dragNote');

  const sections = [];
  const tickEls = [];

  timelineData.forEach((item) => {
    const section = document.createElement('div');
    section.className = 'timeline-section';
    section.innerHTML = `
      <div class="tag-card">
        <div class="stamp">${item.badge}</div>
        <div class="year-title">${item.year}</div>
        <div class="kicker">${item.date}</div>
        <div class="title">${item.title}</div>
        <p class="description">${item.description}</p>
      </div>
    `;
    wrapper.appendChild(section);
    sections.push(section);

    const tick = document.createElement('div');
    tick.className = 'tape-tick';
    tick.innerHTML = `<span>${item.year}</span>`;
    tick.addEventListener('click', () => {
      section.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
    });
    tapeTicks.appendChild(tick);
    tickEls.push(tick);
  });

  // ---- Fade-in cards as they enter/exit view (both scroll directions) ----
  const cardObserver = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        entry.target.querySelector('.tag-card').classList.toggle('is-visible', entry.isIntersecting);
      });
    },
    { root: null, threshold: 0.35 }
  );
  sections.forEach((s) => cardObserver.observe(s));

  // ---- Horizontal scroll via wheel ----
  window.addEventListener('wheel', (e) => {
    if (e.deltaY !== 0) {
      e.preventDefault();
      document.body.scrollLeft += e.deltaY;
    }
  }, { passive: false });

  // ---- Drag-to-scroll ----
  let isDown = false;
  let startX = 0;
  let startScroll = 0;

  document.body.addEventListener('mousedown', (e) => {
    isDown = true;
    document.body.classList.add('grabbing');
    startX = e.clientX;
    startScroll = document.body.scrollLeft;
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    document.body.scrollLeft = startScroll - (e.clientX - startX);
  });
  window.addEventListener('mouseup', () => {
    isDown = false;
    document.body.classList.remove('grabbing');
  });

  // ---- Progress tape + active tick + hide drag note after first scroll ----
  let hasScrolled = false;
  function updateTape() {
    const max = document.body.scrollWidth - window.innerWidth;
    const pct = max > 0 ? (document.body.scrollLeft / max) * 100 : 0;
    tapeFill.style.width = pct + '%';

    if (!hasScrolled && document.body.scrollLeft > 40) {
      hasScrolled = true;
      dragNote.classList.add('is-hidden');
    }

    const activeIndex = Math.min(
      tickEls.length - 1,
      Math.floor((pct / 100) * tickEls.length)
    );
    tickEls.forEach((t, i) => t.classList.toggle('is-active', i === activeIndex));
  }

  document.addEventListener('scroll', updateTape, true);
  window.addEventListener('resize', updateTape);
  updateTape();
})();
</script>
</body>
</html>
