<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Stylesheets -->
<link rel="stylesheet" href="https://use.typekit.net/dzf2sjt.css" />
<link rel="stylesheet" href="https://use.typekit.net/pkr8irj.css" />

<style>
  /* Body > Html */
  body,
  html {
    color: black;
    height: auto;
    margin: 0;
    /* clip instead of hidden so position: sticky keeps working */
    overflow-x: clip;
    padding: 0;
    text-wrap: pretty;
  }

  /* Folder Header */
  .folder-header {
    display: none;
    visibility: hidden;
  }

  /* Folder_Post > Folder Container > Container */
  .folder_post .folder-container .container {
    display: none;
  }

  /* Page > Parallax */
  .page.parallax {
    padding-top: 0px !important;
  }

  /* Video Wrap */
  .video-wrap {
    display: block;
    max-width: 100%;
    position: relative;
  }

  /* Video Wrap > Video */
  .video-wrap video {
    display: block;
    height: auto;
    object-fit: cover;
    width: 100%;
    filter: grayscale(0);
  }

  /* Smooth jump to sections from the video nav */
  html {
    scroll-behavior: smooth;
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }
  }

  /* Section nav over the video, right side, vertically centred */
  .circular-nav {
    position: absolute;
    top: 50%;
    right: 48px;
    z-index: 2;
    transform: translateY(-50%);
  }

  .circular-nav__list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .circular-nav__link {
    display: flex;
    gap: 34px;
    padding: 1px 0;
    font-family: baskerville, "Libre Baskerville", Georgia, serif;
    font-size: 15px;
    line-height: 1.4;
    color: #000;
    text-decoration: none;
  }

  .circular-nav__link:hover .circular-nav__text,
  .circular-nav__link:focus-visible .circular-nav__text {
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .circular-nav__link:focus-visible {
    outline: 1px solid #000;
    outline-offset: 2px;
  }

  .circular-nav__num {
    min-width: 18px;
  }

  /* Icon fixed to the left edge, vertically centred. Once the slider's centre
     reaches it, the script moves it up with the slider so it stays level with it */
  .circular-icon {
    position: fixed;
    top: 50%;
    left: 44px;
    z-index: 10;
    transform: translateY(-50%);
    pointer-events: none;
    will-change: transform;
  }

  .circular-icon__img {
    display: block;
    width: 88px;
    height: auto;
  }

  /* Mobile */
  @media (max-width: 767.98px) {
    .circular-nav {
      right: 16px;
    }

    .circular-nav__link {
      gap: 14px;
      font-size: 12px;
    }

    .circular-icon {
      left: 12px;
    }

    .circular-icon__img {
      width: 44px;
    }
  }
</style>

<div class="video-wrap js-vertical-slider">
    <!-- Video Background (Desktop) -->
    <video class="d-md-block d-none"  playsinline auto autoplay loop muted
        style="width: 100%; object-fit: cover;">
        <source src="images/homepage/2026/21sep26/h_journal_generic_productvideo_1.mp4?$staticlink$" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Mobile Video -->
    <video class="d-md-none d-block" playsinline auto autoplay loop muted
        style="width: 100%; object-fit: cover;">
        <source src="images/homepage/2026/21sep26/h_journal_generic_productvideo_1.mp4?$staticlink$" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <nav class="circular-nav" aria-label="Pedro Circular sections">
      <ol class="circular-nav__list">
        <li class="circular-nav__item">
          <a class="circular-nav__link" href="#circular-about"><span class="circular-nav__num">01</span><span class="circular-nav__text">About</span></a>
        </li>
        <li class="circular-nav__item">
          <a class="circular-nav__link" href="#circular-beyond"><span class="circular-nav__num">02</span><span class="circular-nav__text">Beyond the Cut</span></a>
        </li>
        <li class="circular-nav__item">
          <a class="circular-nav__link" href="#circular-collection"><span class="circular-nav__num">03</span><span class="circular-nav__text">The Collection</span></a>
        </li>
      </ol>
    </nav>
</div>

<div class="circular-icon js-circular-icon" data-stop-at="#circular-collection .js-circular-slider">
  <img class="circular-icon__img" src="images/testfile/icon.jpg?$staticlink$" alt="">
</div>
