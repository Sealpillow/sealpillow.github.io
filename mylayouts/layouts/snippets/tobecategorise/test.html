<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dual-Panel Synchronized Carousel</title>

<!-- ============================== DEPENDENCIES ============================== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<style>
/* ============================== BASE / RESET ============================== */
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }

img, video {
  width: 100%;
  height: auto;
  object-fit: cover;
  display: block;
}

/* ============================== WRAPPER / LAYOUT ============================== */
.carousel-wrapper {
  width: 100%;
  overflow: hidden;
}

.left-panel-col,
.right-panel-col {
  padding: 0;
}

.left-swiper,
.right-swiper {
  width: 100%;
  height: 640px;
  overflow: hidden;
}

@media (max-width: 767px) {
  .left-swiper,
  .right-swiper {
    height: 420px;
  }
}

/* ============================== LEFT PANEL: MEDIA + OVERLAY ============================== */
.left-slide {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.left-slide .media-wrapper {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.left-slide .media-wrapper img,
.left-slide .media-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.overlay-text {
  position: absolute;
  left: 20px;
  bottom: 20px;
  z-index: 2;
  max-width: 80%;
}

.overlay-text .slide-title {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.2;
  margin: 0 0 8px 0;
}

.discover-link {
  position: relative;
  display: inline-block;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  color: inherit;
}

.discover-link::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -4px;
  width: 0;
  height: 1px;
  transition: width 0.35s ease;
}

.discover-link.underline-black::after { background-color: #000; }
.discover-link.underline-white::after { background-color: #fff; }

.discover-link:hover::after { width: 100%; }

/* ============================== LEFT PANEL: PAGINATION ============================== */
.left-pagination {
  position: absolute;
  right: 20px;
  left: auto;
  bottom: 20px;
  width: auto;
  text-align: right;
  z-index: 3;
}

.left-pagination .swiper-pagination-bullet {
  width: 28px;
  height: 4px;
  border-radius: 0;
  background-color: #999;
  opacity: 1;
  margin: 0 4px;
  transition: height 0.2s ease, background-color 0.2s ease;
}

.left-pagination .swiper-pagination-bullet-active {
  height: 6px;
  background-color: #000;
}

/* ============================== RIGHT PANEL: PRODUCT GRID ============================== */
.right-slide {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.product-grid {
  display: grid;
  width: 100%;
  height: 100%;
  align-items: center;
  padding: 2rem;
}

.product-item {
  display: block;
  overflow: hidden;
}

.product-item img {
  width: 100%;
  height: auto;
  object-fit: cover;
}

/* --- 1x2: one row, two columns at 40% width each, centered --- */
.product-grid[data-layout="1x2"] {
  grid-template-columns: 40% 40%;
  grid-template-rows: 1fr;
  justify-content: center;
  column-gap: 1.5rem;
}

/* --- 1x3: one row, three equal columns --- */
.product-grid[data-layout="1x3"] {
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: 1fr;
  column-gap: 1rem;
}

/* --- 2x1: two rows, one column at 60% width, centered --- */
.product-grid[data-layout="2x1"] {
  grid-template-columns: 60%;
  grid-template-rows: repeat(2, 1fr);
  justify-content: center;
  row-gap: 1.5rem;
}

/* --- 2x2: two rows, two columns at 35% width each, centered --- */
.product-grid[data-layout="2x2"] {
  grid-template-columns: repeat(2, 35%);
  grid-template-rows: repeat(2, 1fr);
  justify-content: center;
  gap: 1.25rem;
}

/* --- 3x1: three rows, one column at 40% width, centered; forced 4:3 images --- */
.product-grid[data-layout="3x1"] {
  grid-template-columns: 40%;
  grid-template-rows: repeat(3, 1fr);
  justify-content: center;
  row-gap: 1rem;
}

.product-grid[data-layout="3x1"] .product-item img {
  aspect-ratio: 4 / 3;
  object-fit: cover;
  object-position: bottom;
}

/* --- 2x3: virtual 6-col grid; top row 3 items spanning 2 cols each; bottom row 2 items --- */
.product-grid[data-layout="2x3"] {
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 1rem;
}
.product-grid[data-layout="2x3"] .product-item:nth-child(1) { grid-column: 1 / 3; grid-row: 1; }
.product-grid[data-layout="2x3"] .product-item:nth-child(2) { grid-column: 3 / 5; grid-row: 1; }
.product-grid[data-layout="2x3"] .product-item:nth-child(3) { grid-column: 5 / 7; grid-row: 1; }
.product-grid[data-layout="2x3"] .product-item:nth-child(4) { grid-column: 2 / 4; grid-row: 2; }
.product-grid[data-layout="2x3"] .product-item:nth-child(5) { grid-column: 4 / 6; grid-row: 2; }

/* --- 3x2: virtual 6-col grid; top row 2 items centered; bottom row 3 items spanning 2 cols each --- */
.product-grid[data-layout="3x2"] {
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 1rem;
}
.product-grid[data-layout="3x2"] .product-item:nth-child(1) { grid-column: 2 / 4; grid-row: 1; }
.product-grid[data-layout="3x2"] .product-item:nth-child(2) { grid-column: 4 / 6; grid-row: 1; }
.product-grid[data-layout="3x2"] .product-item:nth-child(3) { grid-column: 1 / 3; grid-row: 2; }
.product-grid[data-layout="3x2"] .product-item:nth-child(4) { grid-column: 3 / 5; grid-row: 2; }
.product-grid[data-layout="3x2"] .product-item:nth-child(5) { grid-column: 5 / 7; grid-row: 2; }

/* --- 3-product: 3x3 grid; item1 top-left, item2 top-right, item3 center-bottom --- */
.product-grid[data-layout="3-product"] {
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 1rem;
}
.product-grid[data-layout="3-product"] .product-item:nth-child(1) { grid-column: 1; grid-row: 1; }
.product-grid[data-layout="3-product"] .product-item:nth-child(2) { grid-column: 3; grid-row: 1; }
.product-grid[data-layout="3-product"] .product-item:nth-child(3) { grid-column: 2; grid-row: 3; }

/* --- special: virtual 6-col grid; 2 items top row centered; 1 item bottom row centered --- */
.product-grid[data-layout="special"] {
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(2, 1fr);
  gap: 1rem;
}
.product-grid[data-layout="special"] .product-item:nth-child(1) { grid-column: 2 / 4; grid-row: 1; }
.product-grid[data-layout="special"] .product-item:nth-child(2) { grid-column: 4 / 6; grid-row: 1; }
.product-grid[data-layout="special"] .product-item:nth-child(3) { grid-column: 3 / 5; grid-row: 2; }

/* --- dice-layout: 3x3 grid; 5 products at corners + center --- */
.product-grid[data-layout="dice-layout"] {
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 1rem;
}
.product-grid[data-layout="dice-layout"] .product-item:nth-child(1) { grid-column: 1; grid-row: 1; }
.product-grid[data-layout="dice-layout"] .product-item:nth-child(2) { grid-column: 3; grid-row: 1; }
.product-grid[data-layout="dice-layout"] .product-item:nth-child(3) { grid-column: 1; grid-row: 3; }
.product-grid[data-layout="dice-layout"] .product-item:nth-child(4) { grid-column: 3; grid-row: 3; }
.product-grid[data-layout="dice-layout"] .product-item:nth-child(5) { grid-column: 2; grid-row: 2; }

/* ============================== RESPONSIVE OVERRIDES ============================== */
@media (max-width: 767px) {
  .product-grid[data-layout="2x1"] {
    grid-template-columns: 80%;
    padding: 3rem;
  }

  .product-grid[data-layout="3x1"] {
    grid-template-columns: 50%;
  }
}
</style>
</head>
<body>

<!-- ============================== HTML STRUCTURE ============================== -->
<div class="carousel-wrapper">
  <div class="row no-gutters">
    <div class="col-12 col-md-6 left-panel-col">
      <div class="swiper left-swiper">
        <div class="swiper-wrapper" id="leftSwiperWrapper"></div>
        <div class="swiper-pagination left-pagination"></div>
      </div>
    </div>
    <div class="col-12 col-md-6 right-panel-col">
      <div class="swiper right-swiper">
        <div class="swiper-wrapper" id="rightSwiperWrapper"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============================== DEPENDENCY JS ============================== -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
/* ============================== DATA ARRAYS ============================== */

// Each entry: media type, desktop/mobile src, title, discover link text,
// text color, href, and an analytics object.
const leftSlides = [
  {
    type: "image",
    desktopSrc: "https://picsum.photos/seed/pedro-editorial-1/1200/1400",
    mobileSrc: "https://picsum.photos/seed/pedro-editorial-1m/800/1000",
    title: "The Weekend Edit",
    discoverText: "Discover the collection",
    textColor: "#fff",
    href: "/collections/weekend-edit",
    analytics: { contentId: "left_slide_01", contentType: "editorial_lifestyle" }
  },
  {
    type: "video",
    desktopSrc: "https://cdn.coverr.co/videos/coverr-walking-in-the-city-1080p.mp4",
    mobileSrc: "https://cdn.coverr.co/videos/coverr-walking-in-the-city-mobile.mp4",
    title: "Made to Move",
    discoverText: "Shop the story",
    textColor: "#fff",
    href: "/collections/made-to-move",
    analytics: { contentId: "left_slide_02", contentType: "editorial_video" }
  },
  {
    type: "image",
    desktopSrc: "https://picsum.photos/seed/pedro-editorial-3/1200/1400",
    mobileSrc: "https://picsum.photos/seed/pedro-editorial-3m/800/1000",
    title: "Everyday Essentials",
    discoverText: "See what's new",
    textColor: "#000",
    href: "/collections/everyday-essentials",
    analytics: { contentId: "left_slide_03", contentType: "editorial_lifestyle" }
  },
  {
    type: "image",
    desktopSrc: "https://picsum.photos/seed/pedro-editorial-4/1200/1400",
    mobileSrc: "https://picsum.photos/seed/pedro-editorial-4m/800/1000",
    title: "Off-Duty Hours",
    discoverText: "Explore the range",
    textColor: "#fff",
    href: "/collections/off-duty",
    analytics: { contentId: "left_slide_04", contentType: "editorial_lifestyle" }
  },
  {
    type: "image",
    desktopSrc: "https://picsum.photos/seed/pedro-editorial-5/1200/1400",
    mobileSrc: "https://picsum.photos/seed/pedro-editorial-5m/800/1000",
    title: "Statement Pieces",
    discoverText: "Discover more",
    textColor: "#000",
    href: "/collections/statement-pieces",
    analytics: { contentId: "left_slide_05", contentType: "editorial_lifestyle" }
  }
];

// Each entry: a layout key and a products array,
// where each product has an image src, href, and analytics object.
const rightSlides = [
  {
    layout: "1x2",
    products: [
      { src: "https://picsum.photos/seed/prod-01/500/650", href: "/products/prod-01", analytics: { contentId: "prod_01", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-02/500/650", href: "/products/prod-02", analytics: { contentId: "prod_02", contentType: "product_tile" } }
    ]
  },
  {
    layout: "1x3",
    products: [
      { src: "https://picsum.photos/seed/prod-03/500/650", href: "/products/prod-03", analytics: { contentId: "prod_03", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-04/500/650", href: "/products/prod-04", analytics: { contentId: "prod_04", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-05/500/650", href: "/products/prod-05", analytics: { contentId: "prod_05", contentType: "product_tile" } }
    ]
  },
  {
    layout: "2x3",
    products: [
      { src: "https://picsum.photos/seed/prod-06/500/650", href: "/products/prod-06", analytics: { contentId: "prod_06", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-07/500/650", href: "/products/prod-07", analytics: { contentId: "prod_07", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-08/500/650", href: "/products/prod-08", analytics: { contentId: "prod_08", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-09/500/650", href: "/products/prod-09", analytics: { contentId: "prod_09", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-10/500/650", href: "/products/prod-10", analytics: { contentId: "prod_10", contentType: "product_tile" } }
    ]
  },
  {
    layout: "dice-layout",
    products: [
      { src: "https://picsum.photos/seed/prod-11/500/650", href: "/products/prod-11", analytics: { contentId: "prod_11", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-12/500/650", href: "/products/prod-12", analytics: { contentId: "prod_12", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-13/500/650", href: "/products/prod-13", analytics: { contentId: "prod_13", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-14/500/650", href: "/products/prod-14", analytics: { contentId: "prod_14", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-15/500/650", href: "/products/prod-15", analytics: { contentId: "prod_15", contentType: "product_tile" } }
    ]
  },
  {
    layout: "3x1",
    products: [
      { src: "https://picsum.photos/seed/prod-16/500/375", href: "/products/prod-16", analytics: { contentId: "prod_16", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-17/500/375", href: "/products/prod-17", analytics: { contentId: "prod_17", contentType: "product_tile" } },
      { src: "https://picsum.photos/seed/prod-18/500/375", href: "/products/prod-18", analytics: { contentId: "prod_18", contentType: "product_tile" } }
    ]
  }
];

/* ============================== RENDER FUNCTIONS ============================== */

function renderLeftSlides() {
  const wrapper = document.getElementById("leftSwiperWrapper");

  wrapper.innerHTML = leftSlides.map((slide) => {
    const underlineClass = slide.textColor === "#fff" ? "underline-white" : "underline-black";

    const mediaHtml = slide.type === "video"
      ? `
        <video class="d-none d-md-block" autoplay muted loop playsinline>
          <source src="${slide.desktopSrc}" type="video/mp4">
        </video>
        <video class="d-block d-md-none" autoplay muted loop playsinline>
          <source src="${slide.mobileSrc}" type="video/mp4">
        </video>
      `
      : `
        <img class="d-none d-md-block" src="${slide.desktopSrc}" alt="${slide.title}">
        <img class="d-block d-md-none" src="${slide.mobileSrc}" alt="${slide.title}">
      `;

    return `
      <div class="swiper-slide left-slide">
        <div class="media-wrapper">${mediaHtml}</div>
        <div class="overlay-text" style="color: ${slide.textColor};">
          <p class="slide-title">${slide.title}</p>
          <a href="${slide.href}" class="discover-link ${underlineClass}" data-content-analytic='${JSON.stringify(slide.analytics)}'>
            ${slide.discoverText}
          </a>
        </div>
      </div>
    `;
  }).join("");
}

function renderRightSlides() {
  const wrapper = document.getElementById("rightSwiperWrapper");

  wrapper.innerHTML = rightSlides.map((slide) => {
    const productsHtml = slide.products.map((product) => `
      <a href="${product.href}" class="product-item" data-content-analytic='${JSON.stringify(product.analytics)}'>
        <img src="${product.src}" alt="">
      </a>
    `).join("");

    return `
      <div class="swiper-slide right-slide">
        <div class="product-grid" data-layout="${slide.layout}">
          ${productsHtml}
        </div>
      </div>
    `;
  }).join("");
}

/* ============================== SWIPER INITIALIZATION ============================== */

renderLeftSlides();
renderRightSlides();

const leftSwiper = new Swiper(".left-swiper", {
  effect: "fade",
  fadeEffect: { crossFade: true },
  speed: 800,
  loop: true,
  autoplay: {
    delay: 5000,
    disableOnInteraction: false
  },
  pagination: {
    el: ".left-pagination",
    clickable: true
  }
});

const rightSwiper = new Swiper(".right-swiper", {
  effect: "fade",
  fadeEffect: { crossFade: true },
  speed: 800,
  loop: false,
  allowTouchMove: false,
  autoplay: {
    delay: 5000
  }
});

/* ============================== CROSS-SYNC BEHAVIOUR ============================== */

leftSwiper.on("slideChange", () => {
  if (rightSwiper.realIndex !== leftSwiper.realIndex) {
    rightSwiper.slideTo(leftSwiper.realIndex);
  }
});

rightSwiper.on("slideChange", () => {
  if (leftSwiper.realIndex !== rightSwiper.realIndex) {
    leftSwiper.slideToLoop(rightSwiper.realIndex);
  }
});
</script>
</body>
</html>
