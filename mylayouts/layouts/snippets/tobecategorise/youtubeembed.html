<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

.video-media-container {
    width: 80%;
    margin: 0 auto;
}
.iframe-wrapper iframe {
    filter: grayscale(0);
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  .video-media-container {
    width: 100%;
  }
}
</style>

<div class="video-media-container">
  <!-- Desktop Video -->
  <div class="iframe-wrapper d-none d-md-block" style="padding:56.2% 0 0 0;position:relative;">
    <iframe
      src="https://www.youtube.com/embed/4tFWqtwe3jk?si=XqC53FlD8jymwcZO"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      style="position:absolute;top:0;left:0%;width:100%;height:100%;"
      title="YouTube video player"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Mobile Video -->
  <div class="iframe-wrapper d-block d-md-none" style="padding:56% 0 0 0;position:relative;">
    <iframe
      src="https://www.youtube.com/embed/4tFWqtwe3jk?si=XqC53FlD8jymwcZO"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      style="position:absolute;top:0;left:0;width:100%;height:100%;"
      title="YouTube video player"
      allowfullscreen>
    </iframe>
  </div>

</div>
