<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<style>
/* Pull Quote Right */
.pull-quote-right {
  margin-bottom: 100px;
}

/* Pull Quote Right > P */
.pull-quote-right p {
  font-family: baskerville;
  font-style: italic;
}
</style>

<!-- Right-aligned pull quote — desktop: narrow column pushed to the right; mobile: wider, right-margin -->
<section class="pull-quote-right">

    <!-- Desktop -->
    <p class="mb-0 d-md-block d-none"
        style="font-size: 12px; width: 12%; margin-right: 37.5%; text-align: left; justify-self: end;">
        "Pull quote text goes here. A short, memorable line from the subject of the editorial."
    </p>

    <!-- Mobile -->
    <p class="mb-0 d-block d-md-none"
        style="font-size: 20px; width: 40%; margin: 0px 10% 0px auto; text-align: left;">
        "Pull quote text goes here. A short, memorable line from the subject of the editorial."
    </p>

</section>
