<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<!-- Splide CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">

<!-- Splide JS -->
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>

<style>
/* ===== Layout ===== */
.journal {
  width: 85%;
  margin: 0 auto;
}

.journal__heading {
  font-size: 30px;
  font-weight: 500;
  text-align: center;
  margin: 3rem 0 2rem;
}

@media (max-width: 767px) {
  .journal__heading {
    font-size: 26px;
  }
}

/* ===== Text Blocks ===== */
.journal__meta {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.journal__featured-meta {
  display: flex;
  justify-content: space-between;
}

.journal__featured-meta h5 {
  font-size: 13px;
  font-weight: bold;
  width: 95%;
}

.journal__meta h5 {
  font-size: 13px;
  font-weight: bold;
}

.journal__meta p,
.journal__featured-meta p {
  font-size: 13px;
  margin-bottom: 0;
}

/* Centre text in mobile slider only */
#journal-mobile .journal__meta {
  text-align: center;
  width: 70%;
  margin: 0 auto;
}

/* ===== Pagination — Mobile slider ===== */
#journal-mobile .splide__pagination {
  bottom: -1.5em;
}

#journal-mobile .splide__pagination__page {
  width: 30px;
  height: 4px;
  background-color: #ccc;
  margin: 0 8px;
  border-radius: 2px;
  transition: background-color 0.3s;
}

#journal-mobile .splide__pagination__page.is-active {
  background-color: #000;
}

/* ===== Pagination — Desktop carousel ===== */
.journal__desktop .splide__pagination__page {
  width: 20px;
  height: 4px;
  border-radius: 0;
  border: none;
  box-shadow: none;
}

.journal__desktop .splide__pagination__page.is-active {
  background: #000;
}
</style>

<div class="journal">

  <div class="journal__heading">
    PEDRO JOURNAL
  </div>

  <!-- Desktop layout -->
  <div class="journal__desktop d-none d-md-block">
    <div class="row" id="journal-desktop"></div>
  </div>

  <!-- Mobile slider -->
  <div id="journal-mobile" class="splide d-block d-md-none" style="margin-top:8px">
    <div class="splide__track">
      <ul class="splide__list" id="journal-mobile-list"></ul>
    </div>
  </div>

  <!-- CTA -->
  <div class="mt-5 mb-5 text-center">
    <a href="$url('Search-ShowContent', 'fdid','thejournal')$">
      <div class="text-uppercase">Discover More</div>
    </a>
  </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  const journalEntries = [
    {
      imgDesktop: "../../media/landscape-1.jpg",
      imgMobile: "../../media/portrait-2.jpg",
      title: "THE SPLASH",
      description: "Inspired by the sun-drenched ease of coastal living, Summer 2026 captures the fluid space between the shoreline and the refined tempo of the city.",
      link: "$url('Page-show','cid','the-splash-summer26')$",
      analytics: { contentId: "h_journal_generic_modelimage_1", contentType: "asset" },
    },
    {
      imgDesktop: "../../media/portrait-1.jpg",
      imgMobile: "../../media/portrait-1.jpg",
      title: "YANA BOVENISTIER: DUAL NARRATIVES",
      description: "While Yana Bovenistier's career has been defined by her ability to inhabit different characters in front of the lens, it is her other role, motherhood, which has brought her into her most authentic self.",
      link: "$url('Page-show','cid','yana-on-motherhood')$",
      analytics: { contentId: "h_journal_generic_modelimage_2", contentType: "asset" },
    },
    {
      imgDesktop: "../../media/product-portrait-2.jpg",
      imgMobile: "../../media/portrait-2.jpg",
      title: "THE DEMI: PASTEL EDITION",
      description: "An evolution of a classic, the Demi returns in a palette of pastel hues that introduce a lighter, more playful mood.",
      link: "$url('Page-show','cid','summer-demi-pastel-edition')$",
      analytics: { contentId: "h_journal_generic_productimage_3", contentType: "asset" },
    },
  ];

  /* ===== Build desktop grid ===== */
  const desktopGrid = document.getElementById('journal-desktop');
  if (desktopGrid) {
    const left = `
      <div class="col-md-7 position-relative">
        <div class="row mb-4">
          <div class="col-12">
            <a href="${journalEntries[0].link}"
              data-content-analytic='{"contentId":"${journalEntries[0].analytics.contentId}","contentType":"${journalEntries[0].analytics.contentType}"}'>
              <img loading="lazy" class="w-100" src="${journalEntries[0].imgDesktop}" alt="${journalEntries[0].title}">
            </a>
          </div>
          <div class="col-12 journal__featured-meta mt-3">
            <h5>${journalEntries[0].title}</h5>
            <p>${journalEntries[0].description}</p>
          </div>
        </div>
      </div>`;

    const right = `
      <div class="col-md-5 position-relative">
        ${journalEntries.slice(1).map(item => `
          <div class="row mb-4">
            <div class="col-md-5 p-0">
              <a href="${item.link}"
                data-content-analytic='{"contentId":"${item.analytics.contentId}","contentType":"${item.analytics.contentType}"}'>
                <img loading="lazy" class="w-100" src="${item.imgDesktop}" alt="${item.title}">
              </a>
            </div>
            <div class="col-md-7 journal__meta">
              <h5>${item.title}</h5>
              <p>${item.description}</p>
            </div>
          </div>`).join('')}
      </div>`;

    desktopGrid.innerHTML = left + right;
  }

  /* ===== Build mobile slider ===== */
  const mobileList = document.getElementById('journal-mobile-list');
  if (mobileList) {
    mobileList.innerHTML = journalEntries.map(item => `
      <li class="splide__slide">
        <a href="${item.link}"
          data-content-analytic='{"contentId":"${item.analytics.contentId}","contentType":"${item.analytics.contentType}"}'>
          <img loading="lazy" class="w-100" src="${item.imgMobile}" alt="${item.title}">
        </a>
        <div class="journal__meta mt-3">
          <h5>${item.title}</h5>
          <p>${item.description}</p>
        </div>
      </li>`).join('');
  }

  /* ===== Init Splide (mobile) ===== */
  if (document.getElementById('journal-mobile')) {
    new Splide('#journal-mobile', {
      type       : 'loop',
      perPage    : 1,
      autoplay   : true,
      interval   : 4000,
      arrows     : false,
      pagination : true,
      speed      : 800,
    }).mount();
  }

});
</script>
