<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Credits Strip */
.credits-strip {
  border-bottom: 1px solid #e0e0e0;
  border-top: 1px solid #e0e0e0;
  display: flex;
  flex-wrap: wrap;
  padding: 16px 0;
}

/* Credits Item */
.credits-item {
  border-right: 1px solid #e0e0e0;
  padding: 0 24px;
}

/* Credits Item > First Child */
.credits-item:first-child {
  padding-left: 0;
}

/* Credits Item > Last Child */
.credits-item:last-child {
  border-right: none;
}

/* Credits Label */
.credits-label {
  color: #999;
  font-family: proxima-nova;
  font-size: 9px;
  letter-spacing: 0.2em;
  margin-bottom: 4px;
  text-transform: uppercase;
}

/* Credits Value */
.credits-value {
  font-family: proxima-nova;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
}

/* Mobile — max-width: 767px */
@media (max-width: 767px) {
  /* Credits Strip */
  .credits-strip {
    gap: 20px;
  }

  /* Credits Item */
  .credits-item {
    border-right: none;
    padding: 0;
  }
}
</style>

<div class="credits-strip">
  <div class="credits-item">
    <p class="credits-label">Photography</p>
    <p class="credits-value">Studio Name</p>
  </div>
  <div class="credits-item">
    <p class="credits-label">Styling</p>
    <p class="credits-value">Stylist Name</p>
  </div>
  <div class="credits-item">
    <p class="credits-label">Hair & Make-up</p>
    <p class="credits-value">Artist Name</p>
  </div>
  <div class="credits-item">
    <p class="credits-label">Location</p>
    <p class="credits-value">City, Country</p>
  </div>
  <div class="credits-item">
    <p class="credits-label">Season</p>
    <p class="credits-value">Spring 2026</p>
  </div>
</div>
