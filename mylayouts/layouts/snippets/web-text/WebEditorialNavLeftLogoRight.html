<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Editorial Nav */
.editorial-nav {
  align-items: center;
  display: flex;
  justify-content: space-between;
  padding: 20px 40px;
}

/* Editorial Nav__Left > Editorial Nav__Right */
.editorial-nav__left,
.editorial-nav__right {
  align-items: center;
  color: #000;
  cursor: pointer;
  display: flex;
  font-size: 11px;
  gap: 6px;
  letter-spacing: 0.1em;
  opacity: 1;
  text-decoration: none;
  transition: opacity 0.2s ease;
  white-space: nowrap;
}

/* Editorial Nav__Left > Is Active > Editorial Nav__Right */
.editorial-nav__left.is-active,
.editorial-nav__right.is-active {
  cursor: default;
  opacity: 0.4;
  pointer-events: none;
}

/* Editorial Nav__Center */
.editorial-nav__center {
  align-items: center;
  display: flex;
  gap: 20px;
}

/* Editorial Nav__Center > Img */
.editorial-nav__center img {
  display: block;
  height: 30px;
  width: auto;
}

/* Nav Text */
.nav-text {
  display: inline-block;
  font-size: 14px;
  position: relative;
}

/* Nav Text */
.nav-text::after {
  background: #000;
  bottom: -2px;
  content: '';
  height: 1px;
  left: 0;
  position: absolute;
  transition: width 0.3s ease;
  width: 0;
}

/* Editorial Nav__Left > Nav Text > Editorial Nav__Right */
.editorial-nav__left:hover .nav-text::after,
.editorial-nav__right:hover .nav-text::after {
  width: 100%;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Editorial Nav */
  .editorial-nav {
    padding: 20px 0;
  }

  /* Editorial Nav__Center */
  .editorial-nav__center {
    margin: 0 auto;
  }

  /* Editorial Nav > Display Desktop */
  .editorial-nav .display-desktop {
    display: none;
  }
}
</style>

<div class="editorial-nav">

    <!-- Left label + arrow -->
    <a class="editorial-nav__left display-desktop" href="javascript:void(0)">
        <img src="images/thejournal/2026/jun26/future-in-hand/arrow_left_black.svg?$staticlink$"
            alt="" style="width: 5px; height: 9px; pointer-events: none;">
        <span class="nav-text">BEHIND THE CRAFT</span>
    </a>

    <!-- Center logo -->
    <div class="editorial-nav__center">
        <img src="../../media/landscape-1.jpg" alt="PEDRO">
    </div>

    <!-- Right label + arrow -->
    <a class="editorial-nav__right display-desktop" href="javascript:void(0)">
        <span class="nav-text">FUTURE IN HAND</span>
        <img src="images/thejournal/2026/jun26/future-in-hand/arrow_right_black.svg?$staticlink$"
            alt="" style="width: 5px; height: 9px; pointer-events: none;">
    </a>

</div>
