<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* Html, Body */
html, body {
  margin: 0;
  padding: 0;
}

/* Section Nav */
.section-nav {
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  gap: 32px;
  justify-content: center;
  margin-bottom: 32px;
  padding-bottom: 0;
}

/* Section Nav > Nav Link */
.section-nav .nav-link {
  color: #999;
  cursor: pointer;
  font-family: proxima-nova;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  padding-bottom: 12px;
  position: relative;
  text-decoration: none;
  text-transform: uppercase;
  transition: color 0.2s;
}

/* Section Nav > Nav Link Active */
.section-nav .nav-link.active {
  color: #000;
}

/* Section Nav > Nav Link::After */
.section-nav .nav-link::after {
  background: #000;
  bottom: 0;
  content: '';
  height: 1px;
  left: 0;
  position: absolute;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.25s ease;
  width: 100%;
}

/* Section Nav > Nav Link Active::After */
.section-nav .nav-link.active::after {
  transform: scaleX(1);
}

/* Panel */
.panel {
  display: none;
}

/* Panel Active */
.panel.active {
  display: block;
}
</style>

<!-- Navigation tabs -->
<nav class="section-nav">
  <a class="nav-link active" data-panel="panel-one">Panel One</a>
  <a class="nav-link"        data-panel="panel-two">Panel Two</a>
  <a class="nav-link"        data-panel="panel-three">Panel Three</a>
</nav>

<!-- Panel One -->
<div class="panel active" id="panel-one">
  <img src="../../media/landscape-1.jpg" alt="" style="display: block; width: 100%;">
  <p style="font-family: proxima-nova; font-size: 14px; padding: 20px; text-align: center;">Panel One content</p>
</div>

<!-- Panel Two -->
<div class="panel" id="panel-two">
  <img src="../../media/portrait-1.jpg" alt="" style="display: block; width: 100%;">
  <p style="font-family: proxima-nova; font-size: 14px; padding: 20px; text-align: center;">Panel Two content</p>
</div>

<!-- Panel Three -->
<div class="panel" id="panel-three">
  <img src="../../media/landscape-2.jpg" alt="" style="display: block; width: 100%;">
  <p style="font-family: proxima-nova; font-size: 14px; padding: 20px; text-align: center;">Panel Three content</p>
</div>

<script>
document.querySelectorAll('.section-nav .nav-link').forEach(function(link) {
  link.addEventListener('click', function() {
    var target = this.dataset.panel;
    document.querySelectorAll('.section-nav .nav-link').forEach(function(l) { l.classList.remove('active'); });
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
    this.classList.add('active');
    document.getElementById(target).classList.add('active');
  });
});
</script>
