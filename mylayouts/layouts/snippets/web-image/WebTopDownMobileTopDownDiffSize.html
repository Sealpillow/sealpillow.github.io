<style>

.responsive-container {

  justify-content: center;
  margin: 100px auto;
  width: 100%;
}

/* Responsive Container > A */
.responsive-container a {
  display: block;
  position: relative;
  width: 100%;
}

/* Mobile — max-width: 767px */
@media (max-width: 767px) {
  /* Responsive Container */
  .responsive-container {
    width: 85%;

  .responsive-container a {

}

/* Desktop — min-width: 768px */
@media (min-width: 768px) {
  /* Responsive Container */
  .responsive-container {
    flex-direction: column;

  }
}
