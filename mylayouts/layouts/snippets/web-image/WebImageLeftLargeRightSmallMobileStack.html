<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Flexi Col Image — All */
.flexi-col-image *,
.flexi-col-image *::before,
.flexi-col-image *::after {
  box-sizing: border-box;
}

/* Flexi Col Image */
.flexi-col-image {
  display: grid;
  grid-template-columns: 2fr 1fr;
}

/* Flexi Col Image Right > A > Flexi Col Image Left */
.flexi-col-image-right a,
.flexi-col-image-left a {
  display: block;
  width: 100%;
}

/* Flexi Col Image Right */
.flexi-col-image-right {
  width: 100%;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Flexi Col Image */
  .flexi-col-image {
    display: grid;
    grid-template-columns: none;
    grid-template-rows: 0.5fr 0.5fr;
  }

  /* Flexi Col Image Left */
  .flexi-col-image-left {
    order: 1;
  }

  /* Flexi Col Image Right */
  .flexi-col-image-right {
    order: 2;
    padding: 10% 10% 0% 10%;
    width: 100%;
  }
}
</style>

<div class="flexi-col-image" style="width: 100%;">
    <!-- Left side: Two smaller images stacked -->
    <div class="flexi-col-image-left">
        <a class="js-shop-the-collection" data-pid="PM1-46600218_DK.BRW" href="$url('Product-Show','pid','PM1-46600218_DK.BRW')$">
            <picture>
                <source srcset="../../media/landscape.jpg" media="(min-width: 768px)">
                <img src="../../media/landscape.jpg" alt="Shoes on white background" style="width: 100%; height: 100%; object-fit: cover;">
            </picture>      
        </a>
    </div>

    <!-- Right side: One large image -->
    <div class="flexi-col-image-right" style="display: grid; grid-template-columns: 1fr;">
        <a class="js-shop-the-collection" data-pid="PM2-26320217-4_DK.TAU" href="$url('Product-Show','pid','PM2-26320217-4_DK.TAU')$">
            <picture>
                <source srcset="../../media/landscape.jpg" media="(min-width: 768px)">
                <img src="../../media/landscape.jpg" alt="Shoes on white background" style="width: 100%; object-fit: cover;">
            </picture>
        </a>    
    </div>
</div>
