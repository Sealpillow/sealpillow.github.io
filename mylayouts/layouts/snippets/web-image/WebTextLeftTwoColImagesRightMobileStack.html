
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Stylesheets -->
<link rel="stylesheet" href="https://use.typekit.net/dzf2sjt.css" />
<link rel="stylesheet" href="https://use.typekit.net/pkr8irj.css" />


<style>
/* Three Way Styling */
.three-way-styling {
  display: grid;
  gap: 40px;
  grid-template-columns: 220px 1fr;
  margin: 0 auto;
  max-width: 1200px;
  padding: 60px 0px;
}

/* Styling Text */
.styling-text {
  padding: 0px 30px;
}

/* Styling Text > H3 */
.styling-text h3 {
  font-family:proxima-nova;
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 16px;
}

/* Styling Text > Ul */
.styling-text ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

/* Styling Text > Li */
.styling-text li {
  font-family:proxima-nova;
  font-size: 14px;
  line-height: 1.8;
}

/* Styling Images */
.styling-images {
  display: grid;
  gap: 24px;
  grid-template-columns: 1fr 1fr;
}

/* Styling Images > Img */
.styling-images img {
  display: block;
  height: auto;
  object-fit: cover;
  width: 100%;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Three Way Styling */
  .three-way-styling {
    grid-template-columns: 1fr;
  }

  /* Styling Text */
  .styling-text {
    order: 1;
    padding: 0px;
    text-align: center;
  }

  /* Styling Text > Ul */
  .styling-text ul {
    display: inline-block;
    text-align: left;
  }

  /* Styling Images */
  .styling-images {
    gap: 0px;
    grid-template-columns: 1fr;
    order: 2;
  }
}
</style>



<section class="three-way-styling">
    <!-- Text -->
    <div class="styling-text">
      <h3>Three-way Styling</h3>
      <ul>
        <li>01&nbsp;&nbsp;Shoulder</li>
        <li>02&nbsp;&nbsp;Sling</li>
        <li>03&nbsp;&nbsp;Carry</li>
      </ul>
    </div>

    <!-- Images -->
    <div class="styling-images">
      <a href="$url('Product-Show', 'pid','PW2-75210189_RED')$">
        <img src="../../media/landscape-1.jpg"
          alt="Shoulder styling" loading="lazy" />
      </a>
      <a href="$url('Product-Show', 'pid','PW2-75210189_RED')$">
        <img src="../../media/landscape-2.jpg"
            alt="Shoulder styling" loading="lazy" />
      </a>
    </div>
  </section>
