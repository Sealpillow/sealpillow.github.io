<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Stagger Stack */
.stagger-stack {
  padding: 40px;
}

/* Stagger Item */
.stagger-item {
  margin-bottom: 40px;
  max-width: 68%;
}

/* Stagger Item — Even */
.stagger-item:nth-child(even) {
  margin-left: auto;
}

/* Stagger Item > Img */
.stagger-item img {
  display: block;
  height: auto;
  width: 100%;
}

/* Stagger Caption */
.stagger-caption {
  color: #999;
  font-family: proxima-nova;
  font-size: 11px;
  letter-spacing: 0.1em;
  margin-top: 10px;
}

/* Mobile — max-width: 767px */
@media (max-width: 767px) {
  /* Stagger Stack */
  .stagger-stack {
    padding: 20px;
  }

  /* Stagger Item */
  .stagger-item {
    max-width: 85%;
  }
}
</style>

<div class="stagger-stack">

  <div class="stagger-item">
    <img src="../../media/portrait.jpg" alt="">
    <p class="stagger-caption">01 — Caption text here</p>
  </div>

  <div class="stagger-item">
    <img src="../../media/portrait.jpg" alt="">
    <p class="stagger-caption">02 — Caption text here</p>
  </div>

  <div class="stagger-item">
    <img src="../../media/portrait.jpg" alt="">
    <p class="stagger-caption">03 — Caption text here</p>
  </div>

</div>
