<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Hanging Wrap */
.hanging-wrap {
  padding: 0 40px;
  position: relative;
}

/* Hanging Image */
.hanging-image {
  display: block;
  width: 75%;
}

/* Hanging Image > Img */
.hanging-image img {
  display: block;
  height: auto;
  width: 100%;
}

/* Hanging Caption */
.hanging-caption {
  bottom: 0;
  font-family: proxima-nova;
  position: absolute;
  right: 0;
  width: calc(25% - 20px);
}

/* Hanging Caption > P */
.hanging-caption p {
  color: #555;
  font-size: 12px;
  line-height: 1.75;
}

/* Hanging Caption > Span */
.hanging-caption span {
  color: #aaa;
  display: block;
  font-size: 10px;
  letter-spacing: 0.15em;
  margin-top: 14px;
  text-transform: uppercase;
}

/* Mobile — max-width: 767px */
@media (max-width: 767px) {
  /* Hanging Wrap */
  .hanging-wrap {
    padding: 0 20px;
  }

  /* Hanging Image */
  .hanging-image {
    width: 100%;
  }

  /* Hanging Caption */
  .hanging-caption {
    margin-top: 16px;
    position: static;
    width: 100%;
  }
}
</style>

<div class="hanging-wrap">
  <div class="hanging-image">
    <img src="../../media/portrait.jpg" alt="">
  </div>
  <div class="hanging-caption">
    <p>A considered approach to material and form — where every element earns its place.</p>
    <span>Spring 2026</span>
  </div>
</div>
