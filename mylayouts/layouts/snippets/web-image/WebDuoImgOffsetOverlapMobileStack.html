<style>
/* Flexi Col Image */
.flexi-col-image {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin-bottom: 50px;
    width: 90%;
    margin: 0 auto;
}

.flexi-col-image-right a,
.flexi-col-image-left a {
    display: block;
    width: 100%;
}

/* Right image is narrower and dropped down, overlapping the left image */
.flexi-col-image-right {
    margin-left: auto;
    width: 70%;
    margin-top: 30%;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
    .flexi-col-image {
        display: block;
        width: 100%;
    }
    .flexi-col-image-right {
        width: 80%;
        margin: 75px auto;
    }
}
</style>

<!-- Two shoppable images side by side: left is full height, right is
     narrower and offset downward so it overlaps the left image. Stacks
     full-width on mobile. Swap data-pid/href and images. -->
<div class="flexi-col-image">
    <!-- Left: full-height image -->
    <div class="flexi-col-image-left">
        <a class="js-shop-the-collection" data-pid="PW2-46390028-1_BLU.CA,PM2-26320262-2_BLU.CA" href="$url('Product-Show','pid','PW2-46390028-1_BLU.CA')$">
        <picture>
            <source srcset="../../media/portrait-1.jpg" media="(min-width: 768px)">
            <img src="../../media/portrait-1.jpg" alt="Shoes on white background" style="width: 100%; height: 100%; object-fit: cover;">
        </picture>
        </a>
    </div>

    <!-- Right: narrower, offset image -->
    <div class="flexi-col-image-right">
        <a class="js-shop-the-collection" data-pid="PW2-46390028-1_BLU.CA" href="$url('Product-Show','pid','PW2-46390028-1_BLU.CA')$">
            <picture>
                <source srcset="../../media/portrait-2.jpg" media="(min-width: 768px)">
                <img src="../../media/portrait-2.jpg" alt="Shoes on white background" style="width: 100%; object-fit: cover;">
            </picture>
        </a>
    </div>
</div>
