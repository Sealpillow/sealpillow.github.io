<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Flexi Col Image3 */
.flexi-col-image3 {
  display: grid;
  grid-template-columns: 1fr 2fr;
}

/* Flexi Col Image Left3 > A > Flexi Col Image Right3 */
.flexi-col-image-left3 a,
.flexi-col-image-right3 a {
  display: block;
  width: 100%;
}

/* Flexi Col Image Left3 > Img > Flexi Col Image Right3 */
.flexi-col-image-left3 img,
.flexi-col-image-right3 img {
  display: block;
  height: 100%;
  object-fit: cover;
  width: 100%;
}

/* Flexi Col Image3 Mobile */
.flexi-col-image3-mobile {
  display: grid;
  grid-template-rows: 0.5fr 0.5fr;
}

/* Flexi Col Image Left3 Mobile */
.flexi-col-image-left3-mobile {
  justify-self: start;
  order: 1;
  width: 50%;
}

/* Flexi Col Image Left3 Mobile > Img */
.flexi-col-image-left3-mobile img {
  object-fit: cover;
  width: 100%;
}

/* Flexi Col Image Right3 Mobile */
.flexi-col-image-right3-mobile {
  order: 2;
  width: 100%;
}

/* Flexi Col Image Right3 Mobile > Img */
.flexi-col-image-right3-mobile img {
  object-fit: cover;
  width: 100%;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Flexi Col Image3 */
  .flexi-col-image3 {
    display: none;
  }
}

/* Desktop — min-width: 769px */
@media (min-width: 769px) {
  /* Flexi Col Image3 Mobile */
  .flexi-col-image3-mobile {
    display: none;
  }
}
</style>

<!-- Desktop: 1/3 left small + 2/3 right large -->
<div class="flexi-col-image3" style="margin: 100px 0;">
    <div class="flexi-col-image-left3">
        <a class="js-shop-the-collection" data-pid="PM2-26320222-3_MUL.TU" href="$url('Product-Show','pid','PM2-26320222-3_MUL.TU')$">
            <img src="../../media/landscape.jpg" alt="">
        </a>
    </div>
    <div class="flexi-col-image-right3">
        <a class="js-shop-the-collection" data-pid="PM2-26320222-3_BLK.TU,PM1-65110332_DBW.BU" href="$url('Product-Show','pid','PM2-26320222-3_BLK.TU')$">
            <img src="../../media/landscape.jpg" alt="">
        </a>
    </div>
</div>

<!-- Mobile: top = small image left-aligned at 50%, bottom = large image full-width -->
<div class="flexi-col-image3-mobile" style="margin: 100px 0;">
    <div class="flexi-col-image-left3-mobile">
        <a class="js-shop-the-collection" data-pid="PM1-86380191-2_NVY.DE" href="$url('Product-Show','pid','PM1-86380191-2_NVY.DE')$">
            <img src="../../media/landscape.jpg" alt="">
        </a>
    </div>
    <div class="flexi-col-image-right3-mobile">
        <a class="js-shop-the-collection" data-pid="PM2-26320222-3_BLK.TU,PM1-65110332_DBW.BU" href="$url('Product-Show','pid','PM2-26320222-3_BLK.TU')$">
            <img src="../../media/landscape.jpg" alt="">
        </a>
    </div>
</div>
