Template: Curated Media Carousel
Desktop: Static multi-column media grid (images + video)

<!-- ================= STYLES ================= -->
<style>
/* Carousel Container — All */
.carousel-container *,
.carousel-container *::before,
.carousel-container *::after {
  box-sizing: border-box;
}

/* Carousel Container */
.carousel-container {
  display: flex;
  margin: 0 auto;
  position: relative;
  width: 100%;
}

/* Carousel Container > A */
.carousel-container a {
  display: block;
  position: relative;
  width: 100%;
}

/* Carousel Container > Img > Video */
.carousel-container img,
.carousel-container video {
  display: block;
  height: auto;
  margin: 0 auto;
  width: 100%;
}

/* Curated Bottom Left */
.curated-bottom-left {
  bottom: 30px;
  color: black;
  font-size: 22px;
  font-weight: 600;
  left: 16px;
  position: absolute;
}

/* Curated Bottom Left Discover */
.curated-bottom-left-discover {
  bottom: 13px;
  color: black;
  font-size: 14px;
  font-weight: 600;
  left: 16px;
  position: absolute;
}

/* Splide */
.splide {
  margin: auto;
  overflow-x: hidden;
  width: 100%;
}

/* Splide__Slide */
.splide__slide {
  overflow: hidden;
  position: relative;
}

/* Splide__Slide > Img > Video */
.splide__slide img,
.splide__slide video {
  display: block;
  height: 100%;
  object-fit: cover;
  width: 100%;
}

/* Main Img */
.main-img {
  display: block;
  width: 100%;
}

/* Hover Img */
.hover-img {
  inset: 0;
  opacity: 0;
  position: absolute;
  transition: opacity 0.3s ease;
  width: 100%;
}

/* Splide__Slide > Hover Img */
.splide__slide:hover .hover-img {
  opacity: 1;
}

/* Desktop: show carousel-container, hide splide */
@media (min-width: 768px) {
  .carousel-container { display: flex; }
  .splide { display: none; }
}

/* Mobile: hide carousel-container, show splide */
@media (max-width: 767px) {
  .carousel-container { display: none; }
  .splide { display: block; }
}
</style>
