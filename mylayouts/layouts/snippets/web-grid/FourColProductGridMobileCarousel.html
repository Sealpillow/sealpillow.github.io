<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ================= SPLIDE CSS ================= -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">

<!-- ================= SPLIDE JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide-extension-auto-scroll@0.5.3/dist/js/splide-extension-auto-scroll.min.js"></script>

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<!-- ================= STYLES ================= -->
<style>

  /* Bottom left text */
  .btm-carousel-text {
    position: absolute;
    bottom: 12px;
    left: 16px;
    font-weight: 600;
    font-size: 12px;
    color: white;
    text-transform: uppercase;
  }
#desktopBestsellerGrid video,
#desktopBestsellerGrid img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
video {
    clip-path: fill-box;
}
  /* Ensure Splide wrapper doesn't overflow */
  .splide {
    overflow-x: hidden;
  }


 /* ================= SLIDER ================= */
.slider-container {
  width: 100%;
  overflow: hidden;
  position: relative;
}

.slide-content {
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  position: relative;
}

.slide-content img,
.slide-content video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}


/* Text Overlay - Bottom Left */
.slide-text {
  position: absolute;
  bottom: 0px;
  left: 20px;
  color: white;
  z-index: 10;
}

/* Hide arrows & pagination */
.splide__arrows,
.splide__pagination {
  display: none;
}

/* Drag cursor */
.splide__track {
  cursor: grab;
}
.splide__track:active {
  cursor: grabbing;
}

.btm-carousel video {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
}

</style>

<!-- Image Containers -->
<!-- DESKTOP GRID -->
<div class="container-fluid d-none d-md-block">
  <div class="row" id="desktopBestsellerGrid"></div>
</div>

<!-- MOBILE SLIDER -->
<div class="slider-container d-md-none d-block">
  <div class="splide" id="bottomCarouselExploreSlider2">
    <div class="splide__track">
      <ul class="splide__list"></ul>
    </div>
  </div>
</div>


<script>
const productsData = [
  {
    title: "TALIA CAGED SANDALS",
    textColor: "black",
    url: "$url('Product-Show', 'pid', 'PW1-66220048_GOLD')$",
    analytics: {
      contentId: "e_bestsellers_pw_productimage_1",
      contentType: "asset"
    },
    media: {
      type: "image",
      src: "../../media/product-portrait-1.jpg",
    }
  },
  {
    title: "KRISTEN HOBO BAG",
    textColor: "white",
    url: "$url('Product-Show', 'pid', 'PW2-35060024-1_BEIGE')$",
    analytics: {
      contentId: "e_bestsellers_pw_productimage_2",
      contentType: "asset"
    },
    media: {
      type: "image",
      src: "../../media/product-portrait-2.jpg",
    }
  },
  {
    title: "FLYNN CROSSBODY BAG",
    textColor: "black",
    url: "$url('Product-Show', 'pid', 'PM2-26320262_BLACK2')$",
    analytics: {
      contentId: "e_bestsellers_pm_productimage_3",
      contentType: "asset"
    },
    media: {
      type: "image",
      src: "../../media/portrait-1.jpg",
    }
  },
  {
    title: "PENNY STRAP SLIDE SANDALS",
    textColor: "black",
    url: "$url('Product-Show', 'pid', 'PM1-86380171-2_DK.TAU')$",
    analytics: {
      contentId: "e_bestsellers_pm_productimage_4",
      contentType: "asset"
    },
    media: {
      type: "image",
      src: "../../media/portrait-2.jpg",
    }
  },
];

const desktopGrid = document.getElementById('desktopBestsellerGrid');

productsData.forEach(item => {
  const col = document.createElement('div');
  col.className = 'col-3 p-0';

  if (item.media.type === 'image') {
    col.innerHTML = `
      <a href="${item.url}"
         data-content-analytic='{"contentId":"${item.analytics.contentId}","contentType":"${item.analytics.contentType}"}'>
        <img src="${item.media.src}" class="card-img-top border-0 img-fluid">
        <div style="position:relative;text-align:center">
          <div class="btm-carousel-text" style="color:${item.textColor}">${item.title}</div>
        </div>
      </a>
    `;
  } else if (item.media.type === 'video') {
    col.innerHTML = `
      <a href="${item.url}"
         data-content-analytic='{"contentId":"${item.analytics.contentId}","contentType":"${item.analytics.contentType}"}'>
        <video playsinline autoplay loop muted class="card-img-top border-0 img-fluid">
          <source src="${item.media.src}" type="video/mp4">
        </video>
        <div style="position:relative;text-align:center">
          <div class="btm-carousel-text" style="color:${item.textColor}">${item.title}</div>
        </div>
      </a>
    `;
  }

  desktopGrid.appendChild(col);
});
</script>


<script>
document.addEventListener('DOMContentLoaded', function () {

  function createSplideExploreSlider({ sliderId, slides, options = {} }) {
    const slider = document.getElementById(sliderId);
    if (!slider) return;

    const list = slider.querySelector('.splide__list');

    slides.forEach(slide => {
      const li = document.createElement('li');
      li.className = 'splide__slide';

      const wrapper = document.createElement('div');
      wrapper.className = 'slide-content';

      // Create media HTML
      let mediaHtml = '';
      if (slide.type === 'video') {
        mediaHtml = `
          <video autoplay muted loop playsinline loading="lazy">
            <source src="${slide.src}" type="video/mp4">
          </video>
        `;
      } else {
        mediaHtml = `<img src="${slide.src}" alt="${slide.alt || ''}" loading="lazy">`;
      }

      // Add overlay text if exists
      if (slide.title || slide.description) {
        mediaHtml += `
          <div class="slide-text" style="color:${slide.textColor || '#fff'}">
            ${slide.title ? `<h3>${slide.title}</h3>` : ''}
            ${slide.description ? `<p>${slide.description}</p>` : ''}
          </div>
        `;
      }

      // Wrap in anchor if url exists
      if (slide.url) {
        if(slide.analytics){
            wrapper.innerHTML = `<a href="${slide.url}" data-content-analytic='{"contentId": "${slide.analytics.contentId}", "contentType": "${slide.analytics.contentType}"}'>${mediaHtml}</a>`;
        }
        else{
            wrapper.innerHTML = `<a href="${slide.url}">${mediaHtml}</a>`;
        }
      } else {
        wrapper.innerHTML = mediaHtml;
      }

      li.appendChild(wrapper);
      list.appendChild(li);
    });

    // Initialize Splide
    const splide = new Splide(`#${sliderId}`, {
      type: 'loop',
      drag: 'free',
      focus: 'center',
      perPage: 3,

      autoScroll: {
        speed: 1,
        pauseOnHover: true,
        pauseOnFocus: false,
      },
      arrows: false,
      pagination: false,
      breakpoints: {
        1024: { perPage: 2 },
        640: { perPage: 2 },
      },
      ...options,
    });

    splide.mount(window.splide.Extensions);
  }

  /* ================= SLIDER DATA ================= */

  createSplideExploreSlider({
    sliderId: 'bottomCarouselExploreSlider2',
    slides: productsData.map(item => ({
      type: item.media.type,
      src: item.media.src,
      url: item.url,
      description: item.title,
      analytics: item.analytics,
      textColor: item.textColor
    })),
    options: {
      perPage: 4,
    }
  });

});
</script>
