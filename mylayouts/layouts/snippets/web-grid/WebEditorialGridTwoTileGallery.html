<style>
  .editorial-grid {
    --eg-center: 460px;
    --eg-gap: 64px;
    padding: 40px 24px 0;
    background: #fff;
  }

  .editorial-grid__grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, var(--eg-center)) minmax(0, 1fr);
    grid-template-areas:
      ".     intro aside"
      "label body  aside"
      ".     media aside";
    column-gap: var(--eg-gap);
    max-width: 1440px;
    margin: 0 auto;
    clip-path: inset(0);
  }

  /* Gallery: two tiles, from the centre column to the right edge */
  .editorial-grid--gallery {
    padding-top: 40px;
    padding-bottom: 0;
  }

  .editorial-grid--gallery .editorial-grid__grid {
    grid-template-areas: ". gallery gallery";
    clip-path: none;
  }

  .editorial-grid__gallery {
    grid-area: gallery;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: minmax(0, 1fr);
    gap: 10px;
    aspect-ratio: 37 / 22;
  }

  /* Shared gallery tile */
  .editorial-grid__tile {
    min-height: 0;
    margin: 0;
    overflow: hidden;
  }

  .editorial-grid__tile-img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Tablet */
  @media (max-width: 991.98px) {
    .editorial-grid {
      --eg-center: 420px;
      --eg-gap: 32px;
    }
  }

  /* Mobile */
  @media (max-width: 767.98px) {
    .editorial-grid__grid {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "intro"
        "label"
        "body"
        "aside"
        "media";
      clip-path: none;
    }

    .editorial-grid--gallery .editorial-grid__grid {
      grid-template-areas: "gallery";
    }

    .editorial-grid__gallery {
      gap: 6px;
    }
  }
</style>

<section class="editorial-grid editorial-grid--gallery">
  <div class="editorial-grid__grid">

    <div class="editorial-grid__gallery">
      <div class="editorial-grid__tile">
        <img class="editorial-grid__tile-img" src="../../media/landscape-1.jpg" alt="" loading="lazy">
      </div>
      <div class="editorial-grid__tile">
        <img class="editorial-grid__tile-img" src="../../media/portrait-1.jpg" alt="" loading="lazy">
      </div>
    </div>

  </div>
</section>
