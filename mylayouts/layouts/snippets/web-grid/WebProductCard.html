<style>
/* Product Card Grid */
.product-card-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 20px;
}

/* Product Card */
.product-card {
  flex: 0 0 calc(25% - 12px);
}

/* Product Card > Img Wrap */
.product-card .img-wrap {
  overflow: hidden;
  position: relative;
}

/* Product Card > Img */
.product-card img {
  display: block;
  height: auto;
  transition: transform 0.45s ease;
  width: 100%;
}

/* Product Card > Img Wrap Hover Img */
.product-card .img-wrap:hover img {
  transform: scale(1.04);
}

/* Product Tag */
.product-tag {
  background: #000;
  color: #fff;
  font-family: proxima-nova;
  font-size: 9px;
  left: 10px;
  letter-spacing: 0.14em;
  padding: 3px 8px;
  position: absolute;
  text-transform: uppercase;
  top: 10px;
}

/* Product Info */
.product-info {
  padding: 10px 0 0;
}

/* Product Name */
.product-name {
  font-family: proxima-nova;
  font-size: 13px;
  letter-spacing: 0.02em;
  margin-bottom: 4px;
}

/* Product Price */
.product-price {
  color: #666;
  font-family: proxima-nova;
  font-size: 12px;
}

/* Mobile — max-width: 767px */
@media (max-width: 767px) {
  /* Product Card */
  .product-card {
    flex: 0 0 calc(50% - 8px);
  }
}
</style>
