<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Split 50 50 */
.split-50-50 {
  display: grid;
  grid-template-columns: 50% 50%;
  width: 100%;
}

/* Split Left */
.split-left {
  padding: 35px 55px;
  position: relative;
}

/* Split Top Row */
.split-top-row {
  align-items: start;
  display: grid;
  grid-template-columns: 50% 50%;
}

/* Split Title */
.split-title {
  font-family: Baskerville;
  font-size: 24px;
  font-weight: 400;
  line-height: 1.2;
  margin: 0;
}

/* Split Desc */
.split-desc {
  font-size: 14px;
  line-height: 1.45;
  margin: 0;
}

/* Split Bottom Image */
.split-bottom-image {
  bottom: 0%;
  left: 55px;
  position: absolute;
  width: 42%;
}

/* Split Bottom Image > Img > Split Right */
.split-bottom-image img,
.split-right img {
  display: block;
  height: 100%;
  object-fit: cover;
  width: 100%;
}

/* Split Right > Img */
.split-right img {
  object-position: center;
}

/* Split Number Text Desktop */
.split-number-text-desktop {
  align-items: start;
  display: grid;
  grid-template-columns: 50% 50%;
  margin-bottom: 50px;
}

/* Left Num > Span */
.left-num span {
  font-family: Baskerville;
  font-size: 14px;
  letter-spacing: 0.08em;
  padding-left: 10px;
}

/* Right Text > Span */
.right-text span {
  display: block;
  font-family: Baskerville;
  font-size: 14px;
  letter-spacing: 0.08em;
  padding-left: 10px;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Split 50 50 > Split Number Text Desktop */
  .split-50-50,
  .split-number-text-desktop {
    display: none;
  }
}
</style>

<!-- DESKTOP: Split 50/50 intro — title, description, images 03 + 04 -->

      <p class="split-title">The Splash</p>

      </p>
    </div>

    <div class="split-bottom-image">
      <img src="../../media/portrait.jpg" alt="">
    </div>
  </div>

  <div class="split-right">
    <a class="js-shop-the-collection" data-pid="PW2-46390031_OLIVE" href="$url('Product-Show','pid','PW2-46390031_OLIVE')$">
      <img src="../../media/portrait.jpg" alt="">
    </a>
  </div>
</section>

<!-- Item label 01 -->

  <div class="right-text"><span>( 01 )</span></div>
</div>
