<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Split 50 50 List */
.split-50-50-list {
  display: grid;
  grid-template-columns: 50% 50%;
}

/* Split Left Img > Img */
.split-left-img img {
  display: block;
  height: 100%;
  object-fit: cover;
  width: 100%;
}

/* Split Right List */
.split-right-list {
  align-self: end;
  padding: 40px 50px;
  position: relative;
}

/* Split Right List > Product List > Div */
.split-right-list .product-list div {
  display: grid;
  grid-template-columns: 80px 1fr;
  margin-bottom: 14px;
}

/* Split Right List > Product List > Span */
.split-right-list .product-list span {
  font-family: Baskerville;
  font-size: 14px;
  letter-spacing: 0.08em;
}

/* Split Right List > Product List > P */
.split-right-list .product-list p {
  font-size: 14px;
  line-height: 1.3;
  margin: 0;
}

/* Split Number Text Desktop */
.split-number-text-desktop {
  align-items: start;
  display: grid;
  grid-template-columns: 50% 50%;
  margin-bottom: 50px;
}

/* Left Num > Span */
.left-num span {
  font-family: Baskerville;
  font-size: 14px;
  letter-spacing: 0.08em;
  padding-left: 10px;
}

/* Right Text > Span */
.right-text span {
  display: block;
  font-family: Baskerville;
  font-size: 14px;
  letter-spacing: 0.08em;
  padding-left: 10px;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Split 50 50 List > Split Number Text Desktop */
  .split-50-50-list,
  .split-number-text-desktop {
    display: none;
  }
}
</style>

<!-- DESKTOP: Image 19 (item 13) + product list 07–13 -->
<section class="split-50-50-list">
  <!-- LEFT IMAGE -->
  <div class="split-left-img">
    <a class="js-shop-the-collection" data-pid="PM2-26320280_BLK.EM" href="$url('Product-Show','pid','PM2-26320280_BLK.EM')$">
      <img src="../../media/portrait-1.jpg" alt="Bag">
    </a>
  </div>

  <!-- RIGHT TEXT: product list -->
  <div class="split-right-list">
    <div class="product-list">
      <div><span>( 07 )</span><p>Loli Leather Bucket Bag</p></div>
      <div><span>( 08 )</span><p>Pierce Crossbody Bag</p></div>
      <div><span>( 09 )</span><p>Utility Tote Bag</p></div>
      <div><span>( 10 )</span><p>Jatte Leather Charm Shoulder Bag</p></div>
      <div><span>( 11 )</span><p>Eny Leather Heel Sandals</p></div>
      <div><span>( 12 )</span><p>Talia Caged Sandals</p></div>
      <div><span>( 13 )</span><p>Crosby Crossbody Bag</p></div>
    </div>
  </div>
</section>

<!-- Item label 13 -->
<div class="split-number-text-desktop">
  <div class="left-num"><span>( 13 )</span></div>
  <div class="right-text"><span></span></div>
</div>
