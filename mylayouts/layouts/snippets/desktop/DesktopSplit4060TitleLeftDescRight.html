<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Split Top Row */
.split-top-row {
  align-items: center;
  display: grid;
  grid-template-columns: 40% 60%;
}

/* Split Title */
.split-title {
  font-family: aktiv-grotesk-extended;
  font-size: 24px;
  font-weight: 400;
  line-height: 1.2;
  margin: 0;
}

/* Split Desc */
.split-desc {
  font-size: 14px;
  line-height: 1.45;
  margin: 0;
}

/* Split Top Row Mobile */
.split-top-row-mobile {
  align-items: center;
  display: grid;
  grid-template-columns: 50% 50%;
}

/* Split Title Mobile */
.split-title-mobile {
  font-family: aktiv-grotesk-extended;
  font-size: 24px;
  font-weight: 400;
  line-height: 1.2;
  margin: 0;
}

/* Split Desc Mobile */
.split-desc-mobile {
  font-size: 14px;
  line-height: 1.45;
  margin: 0;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Split Top Row */
  .split-top-row {
    display: none;
  }
}

/* Desktop — min-width: 769px */
@media (min-width: 769px) {
  /* Split Top Row Mobile */
  .split-top-row-mobile {
    display: none;
  }
}
</style>

<!-- Desktop: 40/60 title left + description right -->
<div class="split-top-row" style="padding: 0px 20%; margin-bottom: 100px;">
    <p class="split-title">Collection Title</p>
    <p class="split-desc">
        Collection description text goes here. This sits in the right 60% column
        on desktop, aligned with the title on the left.
    </p>
</div>

<!-- Mobile: 50/50 title left + description right -->
<div class="split-top-row-mobile" style="padding: 0px 10%; margin-bottom: 100px;">
    <p class="split-title-mobile">Collection Title</p>
    <p class="split-desc-mobile">
        Collection description text goes here.
    </p>
</div>
