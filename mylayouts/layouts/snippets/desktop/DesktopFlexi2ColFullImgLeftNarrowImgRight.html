<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Flexi Col Image */
.flexi-col-image {
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin-bottom: 50px;
}

/* Flexi Col Image Right > A > Flexi Col Image Left */
.flexi-col-image-right a,
.flexi-col-image-left a {
  display: block;
  width: 100%;
}

/* Flexi Col Image Right */
.flexi-col-image-right {
  margin-left: auto;
  width: 70%;
}

/* Flexi Col Image Left > Span */
.flexi-col-image-left span {
  font-family: Baskerville;
  padding-left: 10px;
}

/* Flexi Col Image Right > Span */
.flexi-col-image-right span {
  font-family: Baskerville;
  padding-left: 10px;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Flexi Col Image */
  .flexi-col-image {
    display: none;
  }
}
</style>

<!-- DESKTOP: Flexi col — image 15 (item 10) left full + image 16 (item 11) right narrowed -->
<div class="flexi-col-image" style="width: 100%;">
  <!-- Left: image 15, item 10 -->
  <div class="flexi-col-image-left">
    <a class="js-shop-the-collection" data-pid="PW2-75210192_OLIVE" href="$url('Product-Show','pid','PW2-75210192_OLIVE')$">
      <picture>
        <source srcset="../../media/portrait-1.jpg" media="(min-width: 768px)">
        <img src="../../media/portrait-1.jpg" alt="Shoes on white background" style="width: 100%; height: 100%; object-fit: cover;">
      </picture>
    </a>
    <span>( 10 )</span>
  </div>

  <!-- Right: image 16, item 11 -->
  <div class="flexi-col-image-right">
    <a class="js-shop-the-collection" data-pid="PW1-26220095_COGNAC" href="$url('Product-Show','pid','PW1-26220095_COGNAC')$">
      <picture>
        <source srcset="../../media/portrait-2.jpg" media="(min-width: 768px)">
        <img src="../../media/portrait-2.jpg" alt="Shoes on white background" style="width: 100%; object-fit: cover;">
      </picture>
    </a>
    <span>( 11 )</span>
  </div>
</div>
