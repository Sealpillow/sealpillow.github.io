<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Product Split 50 50 */
.product-split-50-50 {
  display: grid;
  grid-template-columns: 50% 50%;
  width: 100%;
}

/* Product Left */
.product-left {
  display: grid;
  position: relative;
}

/* Product Left > Span */
.product-left span {
  font-family: Baskerville;
}

/* Product Top Image */
.product-top-image {
  width: 41%;
}

/* Product Top Image > Img */
.product-top-image img {
  display: block;
  width: 100%;
}

/* Product Top Image > Span */
.product-top-image span {
  display: block;
  font-size: 14px;
  margin-top: 8px;
  padding-left: 10px;
}

/* Product Left > Product List */
.product-left .product-list {
  align-self: end;
  padding: 40px 50px;
  position: relative;
  width: 100%;
}

/* Product Left > Product List > Div */
.product-left .product-list div {
  display: grid;
  grid-template-columns: 90px 1fr;
  margin-bottom: 14px;
}

/* Product Left > Product List > Span > P */
.product-left .product-list span,
.product-left .product-list p {
  font-size: 14px;
  line-height: 1.2;
  margin: 0;
}

/* Product Left > Product List > Span */
.product-left .product-list span {
  font-family: Baskerville;
}

/* Product Right > Img */
.product-right img {
  display: block;
  height: 100%;
  object-fit: cover;
  width: 100%;
}

/* Split Number Text Desktop */
.split-number-text-desktop {
  align-items: start;
  display: grid;
  grid-template-columns: 50% 50%;
  margin-bottom: 50px;
}

/* Left Num > Span */
.left-num span {
  font-family: Baskerville;
  font-size: 14px;
  letter-spacing: 0.08em;
  padding-left: 10px;
}

/* Right Text > Span */
.right-text span {
  display: block;
  font-family: Baskerville;
  font-size: 14px;
  letter-spacing: 0.08em;
  padding-left: 10px;
}

/* Mobile — max-width: 768px */
@media (max-width: 768px) {
  /* Product Split 50 50 > Split Number Text Desktop */
  .product-split-50-50,
  .split-number-text-desktop {
    display: none;
  }
}
</style>

<!-- DESKTOP: Product split 50/50 — image 09 (item 05) + image 10 (item 06) + product list 01–06 -->
<section class="product-split-50-50">
  <!-- LEFT -->
  <div class="product-left">
    <div class="product-top-image">
      <a class="js-shop-the-collection" data-pid="PW1-66220046_CHK.WE" href="$url('Product-Show','pid','PW1-66220046_CHK.WE')$">
        <img src="../../media/portrait.jpg" alt="">
      </a>
      <span>( 05 )</span>
    </div>

    <div class="product-list">
      <div><span>( 01 )</span><p>Melka Oversized Tote Bag</p></div>
      <div><span>( 02 )</span><p>Utility Tote Bag</p></div>
      <div><span>( 03 )</span><p>Orion Woven Tote Bag</p></div>
      <div><span>( 04 )</span><p>Loli Leather Bucket Bag</p></div>
      <div><span>( 05 )</span><p>Brynn Woven Loafers</p></div>
      <div><span>( 06 )</span><p>Woven Thong Sandals</p></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="product-right">
    <a class="js-shop-the-collection" data-pid="PM1-85110489_BLK.EM" href="$url('Product-Show','pid','PM1-85110489_BLK.EM')$">
      <img src="../../media/portrait.jpg" alt="">
    </a>
  </div>
</section>

<!-- Item label 06 -->
<div class="split-number-text-desktop">
  <div class="left-num"><span></span></div>
  <div class="right-text"><span>( 06 )</span></div>
</div>
