<link rel="preload" as="image" href="../../media/landscape-2.jpg" fetchpriority="high">

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
<script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>

<style>
.page,
.page.parallax {
  padding-top: 0px !important;
}

.parallax-container {
  position: relative;
  width: 100vw;
  height: 100%;
}

.parallax-banner-swiper {
  width: 100%;
  overflow: hidden;
}

.swiper-wrapper {
  width: 100%;
  height: 100%;
}

.swiper-slide {
  flex-shrink: 0;
  width: 100%;
  position: relative;
}

.swiper-wrapper img,
.swiper-wrapper video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  clip-path: fill-box;
}

/* Pagination bottom-right */
.parallax-banner-pagination {
  position: absolute;
  bottom: 20px !important;
  right: 2.5rem;
  left: auto !important;
  width: auto !important;
  display: flex;
  gap: 0px;
  z-index: 10;
}

.parallax-banner-pagination .swiper-pagination-bullet {
  width: 28px;
  height: 4px;
  border: none;
  outline: none;
  border-radius: 0;
  background-color: rgba(0, 0, 0, 0.3);
  opacity: 1;
  transition: all 0.3s ease;
}

.parallax-banner-pagination .swiper-pagination-bullet-active {
  height: 6px;
}

/* Overlay text */
.parallax-banner-text-overlay {
  position: absolute;
  bottom: 20px;
  left: 20px;
  z-index: 5;
}

.parallax-banner-bottom-left {
  font-weight: 600;
  font-size: 22px;
  line-height: 1.2;
}

.parallax-banner-bottom-left-discover {
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  position: relative;
  display: inline-block;
}

.parallax-banner-bottom-left-discover::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0%;
  height: 1px;
  background: #000;
  transition: width 0.35s ease;
}

.underline-black::after {
  background: #000;
}

.underline-white::after {
  background: #fff;
}

.parallax-container .swiper-slide a:hover .parallax-banner-bottom-left-discover::after {
  width: 100%;
}

/* Active bullet â€” color driven by data-pagination-color attribute */
.parallax-banner-swiper-desktop[data-pagination-color="white"] .swiper-pagination-bullet-active,
.parallax-banner-swiper-mobile[data-pagination-color="white"] .swiper-pagination-bullet-active {
  background-color: white;
}

.parallax-banner-swiper-desktop[data-pagination-color="black"] .swiper-pagination-bullet-active,
.parallax-banner-swiper-mobile[data-pagination-color="black"] .swiper-pagination-bullet-active {
  background-color: black;
}

/* Inactive bullets */
.parallax-banner-swiper .swiper-pagination .swiper-pagination-bullet:not(.swiper-pagination-bullet-active) {
  background-color: grey;
}
</style>

<div class="parallax-container js-vertical-slider">

  <!-- Desktop Swiper -->
  <div class="swiper parallax-banner-swiper-desktop d-none d-md-block">
    <div class="swiper-wrapper" id="parallax-banner-slides-desktop"></div>
    <div class="swiper-pagination parallax-banner-pagination parallax-banner-pagination-desktop"></div>
  </div>

  <!-- Mobile Swiper -->
  <div class="swiper parallax-banner-swiper-mobile d-block d-md-none">
    <div class="swiper-wrapper" id="parallax-banner-slides-mobile"></div>
    <div class="swiper-pagination parallax-banner-pagination parallax-banner-pagination-mobile"></div>
  </div>

</div>

<script>
const desktopSlides = [
  {
    title: "METRO MED",
    discoverText: "Discover More",
    textColor: "white",
    paginationColor: "white",
    link: "$url('Page-Show', 'cid', 'metro-med')$",
    analytics: { contentId: "a_mainbanner_pm_modelimage_1", contentType: "asset" },
    media: { type: "image", src: "../../media/landscape-1.jpg" },
    autoplaytimer: "5000"
  },
  {
    title: "GRANO ENGRAINED",
    discoverText: "Discover More",
    textColor: "black",
    paginationColor: "black",
    tabLink: { page: "material-story", tab: "grano" },
    analytics: { contentId: "a_mainbanner_pw_productimage_2", contentType: "asset" },
    media: { type: "image", src: "../../media/landscape-2.jpg" },
    autoplaytimer: "5000"
  },
  // Add more desktop slides here
];

const mobileSlides = [
  {
    title: "METRO MED",
    discoverText: "Discover More",
    textColor: "white",
    paginationColor: "white",
    link: "$url('Page-Show', 'cid', 'metro-med')$",
    analytics: { contentId: "a_mainbanner_pm_modelimage_1", contentType: "asset" },
    media: { type: "image", src: "../../media/portrait-1.jpg" },
    autoplaytimer: "5000"
  },
  {
    title: "METRO MED",
    discoverText: "Discover More",
    textColor: "white",
    paginationColor: "white",
    link: "$url('Page-Show', 'cid', 'metro-med')$",
    analytics: { contentId: "a_mainbanner_pm_modelimage_1", contentType: "asset" },
    media: { type: "image", src: "../../media/portrait-2.jpg" },
    autoplaytimer: "5000"
  },
  // Add more mobile slides here
];

function buildSlideHTML(slide) {
  const src = slide.media.src;
  const mediaHTML = slide.media.type === "image"
    ? `<img src="${src}" alt="${slide.title}">`
    : `<video autoplay muted loop><source src="${src}" type="video/mp4"></video>`;

  let href = "#";
  let extraAttrs = "";
  if (slide.link) {
    href = slide.link;
  } else if (slide.tabLink) {
    href = "#";
    extraAttrs = `class="js-tab-link" data-tab="${slide.tabLink.tab}" data-page="${slide.tabLink.page}"
      ${slide.tabLink.subtab ? `data-subtab="${slide.tabLink.subtab}"` : ""}`;
  }

  return `
    <a href="${href}" ${extraAttrs}
       data-content-analytic='{"contentId":"${slide.analytics.contentId}","contentType":"${slide.analytics.contentType}"}'>
      ${mediaHTML}
      <div class="parallax-banner-text-overlay" style="color:${slide.textColor}">
        <div class="parallax-banner-bottom-left">${slide.title}</div>
        <div class="parallax-banner-bottom-left-discover underline-${slide.textColor}">${slide.discoverText}</div>
      </div>
    </a>
  `;
}

function renderSlides(slides, wrapperId) {
  const wrapper = document.getElementById(wrapperId);
  slides.forEach(slide => {
    const slideEl = document.createElement('div');
    slideEl.className = 'swiper-slide';
    slideEl.setAttribute('data-swiper-autoplay', slide.autoplaytimer);
    slideEl.setAttribute('data-pagination-color', slide.paginationColor || 'white');
    slideEl.innerHTML = buildSlideHTML(slide);
    wrapper.appendChild(slideEl);
  });
}

function initSwiper(selector, paginationEl, slides) {
  const swiper = new Swiper(selector, {
    slidesPerView: 1,
    effect: 'fade',
    fadeEffect: { crossFade: true },
    speed: 800,
    loop: true,
    autoplay: {
      delay: 5000,
      disableOnInteraction: false,
      pauseOnMouseEnter: false
    },
    pagination: {
      el: paginationEl,
      clickable: true
    },
    on: {
      afterInit: function () {
        const color = slides[0].paginationColor || 'white';
        this.el.setAttribute('data-pagination-color', color);
      },
      slideChange: function () {
        const currentSlide = this.slides[this.activeIndex];
        const autoplaytimer = currentSlide.dataset.swiperAutoplay || 5000;
        this.params.autoplay.delay = autoplaytimer;
        this.autoplay.stop();
        this.autoplay.start();

        // â† use realIndex to look up original data, not the cloned DOM slide
        const color = slides[this.realIndex].paginationColor || 'white';
        this.el.setAttribute('data-pagination-color', color);
      }
    }
  });
  return swiper;
}

document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.js-tab-link').forEach(link => {
    const tab    = link.dataset.tab;
    const subtab = link.dataset.subtab;
    const page   = link.dataset.page;
    if (!tab || !page) return;

    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const countryCode = pathParts[0];

    let hash = `#tab=${tab}`;
    if (subtab) hash += `&subtab=${subtab}`;
    link.href = `/${countryCode}/${page}.html${hash}`;
  });
});

renderSlides(desktopSlides, 'parallax-banner-slides-desktop');
renderSlides(mobileSlides, 'parallax-banner-slides-mobile');

const desktopSwiper = initSwiper('.parallax-banner-swiper-desktop', '.parallax-banner-pagination-desktop', desktopSlides);
const mobileSwiper  = initSwiper('.parallax-banner-swiper-mobile',  '.parallax-banner-pagination-mobile',  mobileSlides);
</script>
