<!--
  SLIDER: Splide Carousel — Text Below Slide (Outside Image)
  SOURCE: SliderTextBelow-dynamic.html / SliderTextBelow-static.html
  PATTERN: createSplideSliderCarousel({ sliderId, slides, options })
  - Text rendered BELOW the image, outside the anchor — not overlaid
  - No autoScroll — manual drag only
  - splide.mount() — no Extensions needed
  - Supports images, videos, URL links, analytics
  - Default: 3 per page desktop, 2 mobile
  - Static variant: use perPage 8/5 for thumbnail strip layout
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>

<style>
/* Slider Container */
.slider-container {
  overflow: hidden;
  position: relative;
  width: 100%;
}

/* Slide Content */
.slide-content {
  line-height: 0;
  overflow: hidden;
  position: relative;
  width: 100%;
}

/* Slide Content > Img > Video */
.slide-content img,
  .slide-content video {
  display: block;
  height: auto;
  object-fit: cover;
  width: 100%;
}

/* Slide Text */
.slide-text {
  color: #333;
  padding: 8px 0;
  text-align: left;
  width: 100%;
}

/* Slide Text > H3 */
.slide-text h3 {
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 4px;
}

/* Slide Text > P */
.slide-text p {
  color: #666;
  font-size: 12px;
  margin: 0;
}

/* Splide__Arrows > Splide__Pagination */
.splide__arrows,
  .splide__pagination {
  display: none;
}

/* Splide__Track */
.splide__track {
  cursor: grab;
}

/* Splide__Track */
.splide__track:active {
  cursor: grabbing;
}
</style>

<!-- SLIDER HTML -->
<div class="slider-container">
  <div class="splide" id="carouselSlider1">
    <div class="splide__track">
      <ul class="splide__list"></ul>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  function createSplideSliderCarousel({ sliderId, slides, options = {} }) {
    const slider = document.getElementById(sliderId);
    if (!slider) return;

    const list = slider.querySelector('.splide__list');

    slides.forEach(slide => {
      const li = document.createElement('li');
      li.className = 'splide__slide';

      const wrapper = document.createElement('div');
      wrapper.className = 'slide-content';

      let mediaHtml = '';
      if (slide.type === 'video') {
        mediaHtml = `
          <video autoplay muted loop playsinline loading="lazy">
            <source src="${slide.src}" type="video/mp4">
          </video>
        `;
      } else {
        mediaHtml = `<img src="${slide.src}" alt="${slide.alt || ''}" loading="lazy">`;
      }

      /* Media wrapped in anchor */
      let content = '';
      if (slide.url) {
        if (slide.analytics) {
          content = `<a href="${slide.url}" data-content-analytic='{"contentId": "${slide.analytics}", "contentType": "asset"}'>${mediaHtml}</a>`;
        } else {
          content = `<a href="${slide.url}">${mediaHtml}</a>`;
        }
      } else {
        content = mediaHtml;
      }

      /* Text appended AFTER the anchor, outside it */
      if (slide.title || slide.description) {
        content += `
          <div class="slide-text">
            ${slide.title ? `<h3>${slide.title}</h3>` : ''}
            ${slide.description ? `<p>${slide.description}</p>` : ''}
          </div>
        `;
      }

      wrapper.innerHTML = content;
      li.appendChild(wrapper);
      list.appendChild(li);
    });

    const splide = new Splide(`#${sliderId}`, {
      type: 'loop',
      drag: 'free',
      focus: 'center',
      perPage: 3,
      arrows: false,
      pagination: false,
      breakpoints: {
        1024: { perPage: 2 },
        640: { perPage: 2 },
      },
      ...options,
    });

    splide.mount();
  }

  /* ======== USAGE ======== */
  createSplideSliderCarousel({
    sliderId: 'carouselSlider1',
    slides: [
      { type: 'video', src: '../../media/scrub-video-landscape.mp4', alt: 'Slide 1', url: '#', analytics: 'content-id-1', title: 'Product Name', description: 'Subtitle or price' },
      { type: 'image', src: '../../media/landscape.jpg', alt: 'Slide 2', url: '#', analytics: 'content-id-2', title: 'Product Name', description: 'Subtitle or price' },
      { type: 'video', src: '../../media/scrub-video-landscape.mp4', alt: 'Slide 3', url: '#', analytics: 'content-id-3', title: 'Product Name', description: 'Subtitle or price' },
      { type: 'image', src: '../../media/landscape.jpg', alt: 'Slide 4', url: '#', analytics: 'content-id-4', title: 'Product Name', description: 'Subtitle or price' },
    ],
    options: {
      perPage: 4,
      /* For thumbnail strip layout, use: perPage: 8, breakpoints: { 640: { perPage: 5 } } */
    }
  });

});
</script>
