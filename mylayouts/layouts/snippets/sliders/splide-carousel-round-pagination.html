<!--
  SLIDER: Splide Carousel — Drag Free, Round Pagination Dots
  SOURCE: SliderTextPagination-dynamic.html
  PATTERN: createSplideSliderCarousel({ sliderId, slides, options })
  - Round circular dots (8px, border-radius: 50%), scale on active
  - No autoScroll — manual drag only
  - splide.mount() — no Extensions needed
  - Supports images, videos, URL links, analytics, text overlay
  - Default: 3 per page desktop, 2 mobile
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>

<style>
/* Slider Container */
.slider-container {
  overflow: hidden;
  position: relative;
  width: 100%;
}

/* Slide Content */
.slide-content {
  line-height: 0;
  overflow: hidden;
  position: relative;
  width: 100%;
}

/* Slide Content > Img > Video */
.slide-content img,
  .slide-content video {
  display: block;
  height: auto;
  object-fit: cover;
  width: 100%;
}

/* Slide Text */
.slide-text {
  bottom: 20px;
  left: 20px;
  position: absolute;
  z-index: 10;
}

/* Slide Text > H3 */
.slide-text h3 {
  font-size: 14px;
  font-weight: 600;
  margin: 0 0 4px;
}

/* Slide Text > P */
.slide-text p {
  font-size: 12px;
  margin: 0;
}

/* Splide__Arrows */
.splide__arrows {
  display: none;
}

/* Splide__Pagination */
.splide__pagination {
  align-items: center;
  display: flex;
  gap: 6px;
  justify-content: center;
  padding: 12px 0;
}

/* Splide__Pagination__Page */
.splide__pagination__page {
  background: #ccc;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  height: 8px;
  outline: none;
  transition: background 0.3s, transform 0.3s;
  width: 8px;
}

/* Splide__Pagination__Page > Focus Visible */
.splide__pagination__page:focus,
  .splide__pagination__page:focus-visible {
  box-shadow: none;
  outline: none;
}

/* Splide__Pagination__Page > Is Active */
.splide__pagination__page.is-active {
  background: #000;
  transform: scale(1.3);
}

/* Splide__Track */
.splide__track {
  cursor: grab;
}

/* Splide__Track */
.splide__track:active {
  cursor: grabbing;
}
</style>

<!-- SLIDER HTML -->
<div class="slider-container">
  <div class="splide" id="carouselSlider1">
    <div class="splide__track">
      <ul class="splide__list"></ul>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  function createSplideSliderCarousel({ sliderId, slides, options = {} }) {
    const slider = document.getElementById(sliderId);
    if (!slider) return;

    const list = slider.querySelector('.splide__list');

    slides.forEach(slide => {
      const li = document.createElement('li');
      li.className = 'splide__slide';

      const wrapper = document.createElement('div');
      wrapper.className = 'slide-content';

      let mediaHtml = '';
      if (slide.type === 'video') {
        mediaHtml = `
          <video autoplay muted loop playsinline loading="lazy">
            <source src="${slide.src}" type="video/mp4">
          </video>
        `;
      } else {
        mediaHtml = `<img src="${slide.src}" alt="${slide.alt || ''}" loading="lazy">`;
      }

      if (slide.title || slide.description) {
        mediaHtml += `
          <div class="slide-text" style="color:${slide.textColor || '#fff'}">
            ${slide.title ? `<h3>${slide.title}</h3>` : ''}
            ${slide.description ? `<p>${slide.description}</p>` : ''}
          </div>
        `;
      }

      if (slide.url) {
        if (slide.analytics) {
          wrapper.innerHTML = `<a href="${slide.url}" data-content-analytic='{"contentId": "${slide.analytics}", "contentType": "asset"}'>${mediaHtml}</a>`;
        } else {
          wrapper.innerHTML = `<a href="${slide.url}">${mediaHtml}</a>`;
        }
      } else {
        wrapper.innerHTML = mediaHtml;
      }

      li.appendChild(wrapper);
      list.appendChild(li);
    });

    const splide = new Splide(`#${sliderId}`, {
      type: 'loop',
      drag: 'free',
      focus: 0,
      perPage: 3,
      arrows: false,
      pagination: true,
      breakpoints: {
        1024: { perPage: 2 },
        640: { perPage: 2 },
      },
      ...options,
    });

    splide.mount();
  }

  /* ======== USAGE ======== */
  createSplideSliderCarousel({
    sliderId: 'carouselSlider1',
    slides: [
      { type: 'video', src: '../../media/scrub-video-landscape.mp4', alt: 'Slide 1', url: '#', analytics: 'content-id-1' },
      { type: 'image', src: '../../media/landscape.jpg', alt: 'Slide 2', url: '#', analytics: 'content-id-2' },
      { type: 'video', src: '../../media/scrub-video-landscape.mp4', alt: 'Slide 3', url: '#' },
      { type: 'image', src: '../../media/landscape.jpg', alt: 'Slide 4', url: '#', analytics: 'content-id-4' },
    ],
    options: {
      perPage: 3,
    }
  });

});
</script>
