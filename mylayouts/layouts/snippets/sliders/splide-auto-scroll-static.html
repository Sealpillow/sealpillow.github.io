<!--
  SLIDER: Splide Auto-Scroll — Static HTML Slides
  SOURCE: SmoothAutoScroll-static.html
  PATTERN: Slides hardcoded in <li> markup — no JS generation
  - Auto-scroll via Extensions mount, inline (no wrapper function)
  - Multiple sliders on same page with different speed/perPage configs
  - REQUIRES: @splidejs/splide-extension-auto-scroll CDN
  - Use when: CMS injects slide markup, or slides don't need dynamic data
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide-extension-auto-scroll@0.5.3/dist/js/splide-extension-auto-scroll.min.js"></script>

<style>
/* Slider Container */
.slider-container {
  overflow: hidden;
  position: relative;
  width: 100%;
}

/* Slide Content */
.slide-content {
  line-height: 0;
  overflow: hidden;
  width: 100%;
}

/* Slide Content > Img > Video */
.slide-content img,
  .slide-content video {
  display: block;
  object-fit: cover;
  width: 100%;
}

/* Splide__Arrows > Splide__Pagination */
.splide__arrows,
  .splide__pagination {
  display: none;
}

/* Splide__Track */
.splide__track {
  cursor: grab;
}

/* Splide__Track */
.splide__track:active {
  cursor: grabbing;
}
</style>

<!-- SLIDER 1 — speed: 1, perPage: 3 -->
<div class="slider-container">
  <div class="splide" id="slider-1">
    <div class="splide__track">
      <ul class="splide__list">

        <li class="splide__slide">
          <div class="slide-content">
            <img src="../../media/landscape-1.jpg" alt="">
          </div>
        </li>

        <li class="splide__slide">
          <div class="slide-content">
            <img src="../../media/landscape-2.jpg" alt="">
          </div>
        </li>

        <li class="splide__slide">
          <div class="slide-content">
            <video autoplay muted loop playsinline>
              <source src="../../media/landscape_video-1.mp4" type="video/mp4">
            </video>
          </div>
        </li>

        <li class="splide__slide">
          <div class="slide-content">
            <img src="../../media/landscape-1.jpg" alt="">
          </div>
        </li>

      </ul>
    </div>
  </div>
</div>

<!-- SLIDER 2 — speed: 2, perPage: 4 -->
<div class="slider-container">
  <div class="splide" id="slider-2">
    <div class="splide__track">
      <ul class="splide__list">

        <li class="splide__slide">
          <div class="slide-content">
            <img src="../../media/landscape-2.jpg" alt="">
          </div>
        </li>

        <li class="splide__slide">
          <div class="slide-content">
            <img src="../../media/landscape-1.jpg" alt="">
          </div>
        </li>

        <li class="splide__slide">
          <div class="slide-content">
            <img src="../../media/landscape-2.jpg" alt="">
          </div>
        </li>

        <li class="splide__slide">
          <div class="slide-content">
            <img src="../../media/landscape-1.jpg" alt="">
          </div>
        </li>

      </ul>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  new Splide('#slider-1', {
    type: 'loop',
    drag: 'free',
    focus: 'center',
    perPage: 3,
    autoScroll: {
      speed: 1,
      pauseOnHover: true,
      pauseOnFocus: false,
    },
    arrows: false,
    pagination: false,
    breakpoints: {
      1024: { perPage: 2 },
      640: { perPage: 1 },
    },
  }).mount(window.splide.Extensions);

  new Splide('#slider-2', {
    type: 'loop',
    drag: 'free',
    focus: 'center',
    perPage: 4,
    autoScroll: {
      speed: 2,
      pauseOnHover: true,
      pauseOnFocus: false,
    },
    arrows: false,
    pagination: false,
    breakpoints: {
      1024: { perPage: 2 },
      640: { perPage: 1 },
    },
  }).mount(window.splide.Extensions);

});
</script>
