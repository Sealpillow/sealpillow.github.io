<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Demo Content */
.demo-section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  font-size: 13px;
  letter-spacing: 0.1em;
  color: #7a7268;
  border-bottom: 1px solid rgba(0,0,0,0.08);
}

/* ── Variables ─────────────────────────────────────── */
:root {
  --cream:      #f5f0e8;
  --gold:       #b89a6a;
  --gold-light: #d4b896;
  --text-soft:  #6d6255;
  --rule:       rgba(26,23,20,0.12);
}

/* ── Desktop: fixed left side nav ─────────────────── */
.section-nav {
  position: fixed;
  left: 28px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 90;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.section-nav-track {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--rule);
  transform: translateX(-50%);
  z-index: 0;
}

.section-nav-progress {
  position: absolute;
  left: 50%;
  top: 0;
  width: 1px;
  height: 0%;
  background: var(--gold);
  transform: translateX(-50%);
  z-index: 1;
  transition: height 0.15s ease;
}

.section-nav-dot {
  position: relative;
  z-index: 2;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.section-nav-dot::after {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1px solid var(--gold-light);
  background: var(--cream);
  transition: all 0.2s ease;
}

.section-nav-dot:hover::after,
.section-nav-dot.active::after {
  background: var(--gold);
  border-color: var(--gold);
  transform: scale(1.3);
}

.section-nav-label {
  position: absolute;
  left: calc(100% + 6px);
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-soft);
  white-space: nowrap;
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}

.section-nav-dot:hover .section-nav-label,
.section-nav-dot.active .section-nav-label {
  opacity: 1;
  transform: translateX(0);
}

/* ── Mobile: fixed bottom bar ──────────────────────── */
.section-nav-mobile {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 90;
  background: rgba(245, 240, 232, 0.92);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--rule);
  padding: 10px 24px 16px;
  flex-direction: column;
  gap: 6px;
}

.section-nav-mobile-labels {
  display: flex;
  justify-content: space-between;
  width: 100%;
}

.section-nav-mobile-label {
  font-size: 8px;
  font-weight: 400;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-soft);
  transition: color 0.2s ease;
  flex: 1;
  text-align: center;
}

.section-nav-mobile-label.active {
  color: var(--gold);
}

.section-nav-mobile-dots-row {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

.section-nav-mobile-track {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 1px;
  transform: translateY(-50%);
  background: var(--rule);
}

.section-nav-mobile-progress {
  position: absolute;
  top: 0;
  left: 0;
  height: 1px;
  width: 0%;
  background: var(--gold);
  transition: width 0.15s ease;
}

.section-nav-mobile-dot {
  position: relative;
  z-index: 2;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.section-nav-mobile-dot::after {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1px solid var(--gold-light);
  background: var(--cream);
  transition: all 0.2s ease;
}

.section-nav-mobile-dot.active::after {
  background: var(--gold);
  border-color: var(--gold);
  transform: scale(1.3);
}

@media (max-width: 900px) {
  .section-nav { display: none; }
  .section-nav-mobile { display: flex; }
  body { padding-bottom: 72px; }
}
</style>

<!-- Desktop side nav -->
<nav class="section-nav" aria-label="Page sections">
  <div class="section-nav-track"></div>
  <div class="section-nav-progress"></div>
  <button class="section-nav-dot" data-target="section-1">
    <span class="section-nav-label">Section 1</span>
  </button>
  <button class="section-nav-dot" data-target="section-2">
    <span class="section-nav-label">Section 2</span>
  </button>
  <button class="section-nav-dot" data-target="section-3">
    <span class="section-nav-label">Section 3</span>
  </button>
  <button class="section-nav-dot" data-target="section-4">
    <span class="section-nav-label">Section 4</span>
  </button>
</nav>

<!-- Mobile bottom nav -->
<nav class="section-nav-mobile" aria-label="Page sections">
  <div class="section-nav-mobile-labels">
    <span class="section-nav-mobile-label" data-target="section-1">Section 1</span>
    <span class="section-nav-mobile-label" data-target="section-2">Section 2</span>
    <span class="section-nav-mobile-label" data-target="section-3">Section 3</span>
    <span class="section-nav-mobile-label" data-target="section-4">Section 4</span>
  </div>
  <div class="section-nav-mobile-dots-row">
    <div class="section-nav-mobile-track">
      <div class="section-nav-mobile-progress"></div>
    </div>
    <button class="section-nav-mobile-dot" data-target="section-1"></button>
    <button class="section-nav-mobile-dot" data-target="section-2"></button>
    <button class="section-nav-mobile-dot" data-target="section-3"></button>
    <button class="section-nav-mobile-dot" data-target="section-4"></button>
  </div>
</nav>

<!-- Demo sections -->
<div class="demo-section" id="section-1">SECTION 1</div>
<div class="demo-section" id="section-2">SECTION 2</div>
<div class="demo-section" id="section-3">SECTION 3</div>
<div class="demo-section" id="section-4">SECTION 4</div>

<script>
  (function(){
    const dots       = Array.from(document.querySelectorAll('.section-nav-dot'));
    const progress   = document.querySelector('.section-nav-progress');
    const mobileDots = Array.from(document.querySelectorAll('.section-nav-mobile-dot'));
    const mobileProgress = document.querySelector('.section-nav-mobile-progress');
    const sections   = dots.map(d => document.getElementById(d.dataset.target));

    [...dots, ...mobileDots].forEach(dot => {
      dot.addEventListener('click', () => {
        const target = document.getElementById(dot.dataset.target);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    function update() {
      const scrollY = window.scrollY;
      const winH    = window.innerHeight;
      let activeIndex = 0;

      sections.forEach((sec, i) => {
        if (!sec) return;
        if (scrollY >= sec.offsetTop - winH * 0.4) activeIndex = i;
      });

      if (scrollY + winH >= document.documentElement.scrollHeight - 20) {
        activeIndex = sections.length - 1;
      }

      dots.forEach((dot, i) => dot.classList.toggle('active', i === activeIndex));

      const navH   = dots[dots.length - 1].offsetTop - dots[0].offsetTop;
      const filled = navH > 0 ? (dots[activeIndex].offsetTop - dots[0].offsetTop) / navH * 100 : 0;
      progress.style.height = filled + '%';

      const mobileLabels = Array.from(document.querySelectorAll('.section-nav-mobile-label'));
      mobileDots.forEach((dot, i) => dot.classList.toggle('active', i === activeIndex));
      mobileLabels.forEach((lbl, i) => lbl.classList.toggle('active', i === activeIndex));
      const mobileStep = activeIndex / (mobileDots.length - 1) * 100;
      mobileProgress.style.width = mobileStep + '%';
    }

    window.addEventListener('scroll', update, { passive: true });
    update();
  })();
</script>
