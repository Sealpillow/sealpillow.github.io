<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* Announcement Bar */
.announcement-bar {
  align-items: center;
  background: #000;
  display: flex;
  justify-content: center;
  padding: 10px 40px;
  position: relative;
  width: 100%;
}

/* Announcement Text */
.announcement-text {
  color: #fff;
  font-family: proxima-nova;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-align: center;
}

/* Announcement Text > A */
.announcement-text a {
  color: #fff;
  text-decoration: underline;
}

/* Announcement Close */
.announcement-close {
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 0;
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
}

/* Announcement Close > Hover */
.announcement-close:hover {
  color: #fff;
}
</style>

<div class="announcement-bar" id="announcementBar">
  <p class="announcement-text">Complimentary shipping on orders above $150. <a href="#">Shop Now</a></p>
  <button class="announcement-close" onclick="document.getElementById('announcementBar').style.display='none'" aria-label="Close">&times;</button>
</div>
