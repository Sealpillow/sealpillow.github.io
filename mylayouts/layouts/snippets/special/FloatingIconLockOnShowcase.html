<!-- ★ EXTRACT — the floating icon (JS). This is the whole behaviour:
     stays centred on screen until it lines up with the target element's
     centre, then moves up with it as if it were part of that section.
     Nothing in here references the carousel or anything else below —
     it only cares about whatever `data-stop-at` points at. -->
<script>
(function () {
  var icon = document.querySelector('.js-hero-float-icon');
  if (!icon) return;
  var target = document.querySelector(icon.getAttribute('data-stop-at'));
  if (!target) return;
  var ticking = false;

  function update() {
    ticking = false;
    var rect = target.getBoundingClientRect();
    var shift = Math.min(0, rect.top + rect.height / 2 - window.innerHeight / 2);
    icon.style.transform = 'translateY(calc(-50% + ' + shift + 'px))';
  }

  function onScroll() {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(update);
    }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  update();
})();
</script>

<!-- DEMO ONLY: this second script only drives the carousel below (the
     real target in this demo) — it has nothing to do with the floating
     icon and isn't needed when you extract it. -->
<script>
(function () {
  document.querySelectorAll('.js-center-slider').forEach(function (slider) {
    var track = slider.querySelector('.center-slider__track');
    var probe = slider.querySelector('.center-slider__probe');
    var slides = Array.prototype.slice.call(track.querySelectorAll('.center-slider__slide'));
    if (!slides.length) return;
    var imgs = slides.map(function (slide) {
      return slide.querySelector('.center-slider__slide-img');
    });

    var draggingClass = 'center-slider__track--dragging';
    var activeClass = 'center-slider__slide--active';
    var start = parseInt(slider.getAttribute('data-start'), 10);
    var index = isNaN(start) ? Math.floor((slides.length - 1) / 2) : start;
    var startX = null;
    var delta = 0;
    var dragged = false;

    function metrics() {
      return {
        h: probe.offsetWidth,
        hActive: probe.offsetHeight,
        gap: parseFloat(getComputedStyle(track).columnGap) || 0
      };
    }

    function ratio(n) {
      var img = imgs[n];
      return img && img.naturalWidth && img.naturalHeight ? img.naturalWidth / img.naturalHeight : 1;
    }

    function render() {
      var m = metrics();
      var offset = 0;
      for (var j = 0; j < index; j++) offset += m.h * ratio(j) + m.gap;
      offset += (m.hActive * ratio(index)) / 2;
      var x = slider.clientWidth / 2 - offset + delta;
      track.style.transform = 'translate3d(' + x + 'px, 0, 0)';
    }

    function goTo(i) {
      index = Math.min(Math.max(i, 0), slides.length - 1);
      slides.forEach(function (slide, n) {
        var isActive = n === index;
        slide.classList.toggle(activeClass, isActive);
        slide.setAttribute('aria-current', isActive ? 'true' : 'false');
      });
      render();
    }

    track.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      startX = e.clientX;
      delta = 0;
      dragged = false;
    });

    track.addEventListener('pointermove', function (e) {
      if (startX === null) return;
      delta = e.clientX - startX;
      if (!dragged && Math.abs(delta) > 6) {
        dragged = true;
        track.classList.add(draggingClass);
        track.setPointerCapture(e.pointerId);
      }
      if (dragged) render();
    });

    function endDrag() {
      if (startX === null) return;
      startX = null;
      track.classList.remove(draggingClass);
      if (!dragged) return;
      var m = metrics();
      var steps = Math.round(-delta / (m.h * ratio(index) + m.gap));
      if (steps === 0 && Math.abs(delta) > 40) steps = delta < 0 ? 1 : -1;
      delta = 0;
      goTo(index + steps);
    }

    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);

    track.addEventListener('click', function (e) {
      if (dragged) {
        dragged = false;
        return;
      }
      var slide = e.target.closest('.center-slider__slide');
      if (slide) goTo(slides.indexOf(slide));
    });

    slider.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goTo(index - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        goTo(index + 1);
      }
    });

    window.addEventListener('resize', render);

    imgs.forEach(function (img) {
      if (img && !img.complete) img.addEventListener('load', render);
    });

    track.classList.add(draggingClass);
    goTo(index);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        track.classList.remove(draggingClass);
      });
    });
  });
})();
</script>
