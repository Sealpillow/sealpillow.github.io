<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Timeline</title>
    <style>
/* * */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* Html > Body */
html, body {
  background: #0f0c29;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  height: 100%;
  overflow-x: auto;
  overflow-y: hidden;
}

/* Body >  Webkit Scrollbar */
body::-webkit-scrollbar {
  height: 12px;
}

/* Body >  Webkit Scrollbar Track */
body::-webkit-scrollbar-track {
  background: #1a1a2e;
}

/* Body >  Webkit Scrollbar Thumb */
body::-webkit-scrollbar-thumb {
  background: linear-gradient(90deg, #667eea, #764ba2);
  border-radius: 10px;
}

/* Timeline Wrapper */
.timeline-wrapper {
  display: flex;
  position: relative;
  width: max-content;
}

/* Timeline Line */
.timeline-line {
  background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  height: 3px;
  left: 0;
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 100%;
  z-index: 1;
}

/* Timeline Section */
.timeline-section {
  align-items: center;
  display: flex;
  height: 100vh;
  justify-content: center;
  min-width: 100vw;
  padding: 0 100px;
  position: relative;
}

/* Timeline Section > Nth Child > 1 */
.timeline-section:nth-child(1) {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}

/* Timeline Section > Nth Child > 2 */
.timeline-section:nth-child(2) {
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
}

/* Timeline Section > Nth Child > 3 */
.timeline-section:nth-child(3) {
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
}

/* Timeline Section > Nth Child > 4 */
.timeline-section:nth-child(4) {
  background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
}

/* Timeline Section > Nth Child > 5 */
.timeline-section:nth-child(5) {
  background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
}

/* Timeline Section > Nth Child > 6 */
.timeline-section:nth-child(6) {
  background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
}

/* Timeline Section > Nth Child > 7 */
.timeline-section:nth-child(7) {
  background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
}

/* Content Box */
.content-box {
  backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.95);
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  max-width: 600px;
  padding: 60px;
  position: relative;
  z-index: 2;
}

/* Year */
.year {
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background: linear-gradient(135deg, #667eea, #764ba2);
  background-clip: text;
  font-size: 80px;
  font-weight: bold;
  line-height: 1;
  margin-bottom: 20px;
}

/* Date */
.date {
  color: #764ba2;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 2px;
  margin-bottom: 15px;
  text-transform: uppercase;
}

/* Title */
.title {
  color: #333;
  font-size: 36px;
  font-weight: bold;
  line-height: 1.2;
  margin-bottom: 20px;
}

/* Description */
.description {
  color: #666;
  font-size: 18px;
  line-height: 1.8;
  margin-bottom: 30px;
}

/* Milestone Badge */
.milestone-badge {
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 20px;
  color: white;
  display: inline-block;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 8px 20px;
  text-transform: uppercase;
}

/* Scroll Hint */
.scroll-hint {
  animation: pulse 2s infinite;
  backdrop-filter: blur(10px);
  background: rgba(255, 255, 255, 0.2);
  border-radius: 30px;
  bottom: 30px;
  color: white;
  font-size: 14px;
  font-weight: 600;
  padding: 15px 25px;
  position: fixed;
  right: 30px;
  z-index: 100;
}

/* Keyframes > Pulse */
@keyframes pulse {
  /* 0 > 100 */
  0%, 100% {
    opacity: 0.6;
  }

  /* 50 */
  50% {
    opacity: 1;
  }
}

/* Section Number */
.section-number {
  color: rgba(255, 255, 255, 0.1);
  font-size: 120px;
  font-weight: bold;
  left: 30px;
  position: absolute;
  top: 30px;
  z-index: 1;
}
</style>
</head>
<body>
    <div class="scroll-hint">← Scroll Horizontally →</div>
    
    <div class="timeline-wrapper">
        <div class="timeline-line"></div>
        <!-- Timeline sections will be injected here dynamically -->
    </div>

    <script>
        // Timeline data array (you can replace this with data from a backend or JSON)
        const timelineData = [
            {
                year: 2020,
                date: "January 2020",
                title: "The Beginning",
                description: "Our journey started with a vision to create something extraordinary. The team came together, ideas were born, and the foundation was laid.",
                badge: "Inception",
                number: "01",
                bgColor: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)"
            },
            {
                year: 2020,
                date: "March 2020",
                title: "First Prototype",
                description: "After months of hard work, we developed our first working prototype. This was a pivotal moment that proved our concept was viable.",
                badge: "Development",
                number: "02",
                bgColor: "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)"
            },
            {
                year: 2020,
                date: "July 2020",
                title: "Beta Launch",
                description: "We opened our doors to early adopters and beta testers. Their feedback was invaluable, helping us refine features and shape the product.",
                badge: "Testing Phase",
                number: "03",
                bgColor: "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)"
            },
            {
                year: 2020,
                date: "December 2020",
                title: "Official Launch",
                description: "Version 1.0 went live to the world. Complete with comprehensive documentation, full feature set, and robust infrastructure.",
                badge: "Launch",
                number: "04",
                bgColor: "linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)"
            },
            {
                year: 2021,
                date: "June 2021",
                title: "Major Update",
                description: "Based on extensive user feedback, we released a major update with enhanced capabilities and exciting new features.",
                badge: "Growth",
                number: "05",
                bgColor: "linear-gradient(135deg, #fa709a 0%, #fee140 100%)"
            },
            {
                year: 2022,
                date: "January 2022",
                title: "Global Expansion",
                description: "We expanded to new markets across multiple continents and built strategic partnerships that accelerated our impact.",
                badge: "Expansion",
                number: "06",
                bgColor: "linear-gradient(135deg, #30cfd0 0%, #330867 100%)"
            },
            {
                year: 2022,
                date: "September 2022",
                title: "Milestone Achieved",
                description: "We reached unprecedented user growth, received industry recognition, and solidified our position as a leader.",
                badge: "Achievement",
                number: "07",
                bgColor: "linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)"
            }
        ];

        // Function to generate timeline section HTML from data
        function generateTimelineSections() {
            const timelineWrapper = document.querySelector('.timeline-wrapper');
            timelineData.forEach((item) => {
                const section = document.createElement('div');
                section.classList.add('timeline-section');
                section.innerHTML = `
                    <div class="section-number">${item.number}</div>
                    <div class="content-box">
                        <div class="year">${item.year}</div>
                        <div class="date">${item.date}</div>
                        <div class="title">${item.title}</div>
                        <div class="description">${item.description}</div>
                        <div class="milestone-badge">${item.badge}</div>
                    </div>
                `;
                section.style.background = item.bgColor;
                timelineWrapper.appendChild(section);
            });
        }

        // Call the function to generate the timeline
        generateTimelineSections();

        // Horizontal scroll functionality
        const scrollContainer = document.body;

        window.addEventListener('wheel', (e) => {
            if (e.deltaY !== 0) {
                e.preventDefault();
                scrollContainer.scrollLeft += e.deltaY;
            }
        }, { passive: false });
    </script>
</body>
</html>
