<style>
/* Body */
body {
  overflow-x: hidden;
}

/* Zoom Section */
.zoom-section {
  position: relative;
}

/* Sticky Wrapper */
.sticky-wrapper {
  align-items: center;
  display: flex;
  height: 100vh;
  justify-content: center;
  overflow: hidden;
  position: sticky;
  top: 0;
}

/* Zoom Image */
.zoom-image {
  position: relative;
  transition: transform 0.1s ease-out;
  will-change: transform;
}

/* Zoom Image > Img */
.zoom-image img {
  border-radius: 8px;
  display: block;
  height: 100%;
  max-width: 100%;
  object-fit: cover;
  width: 100%;
}

/* Section Label */
.section-label {
  backdrop-filter: blur(10px);
  background: rgba(0, 0, 0, 0.5);
  border-radius: 20px;
  font-size: 16px;
  left: 50%;
  opacity: 0.7;
  padding: 8px 18px;
  position: absolute;
  top: 40px;
  transform: translateX(-50%);
  z-index: 10;
}
</style>

<div id="zoom-container"></div>

<script>
// Configuration for dynamic sections
const config = [
  { zoomIn: false, zoomOverflow: 1.1, label: 'Portrait – Zoom Out', imgSrc: '../../media/portrait-1.jpg', height: '250vh', width: '300px', imgHeight: '400px' },
  { zoomIn: true, zoomOverflow: 1.2, label: 'Landscape – Zoom In', imgSrc: '../../media/landscape-1.jpg', height: '400vh', width: '600px', imgHeight: '400px' },
  { zoomIn: false, zoomOverflow: 1.05, label: 'Square – Zoom Out', imgSrc: '../../media/landscape-2.jpg', height: '300vh', width: '400px', imgHeight: '400px' },
  { zoomIn: true, zoomOverflow: 1.3, label: 'Tall – Zoom In', imgSrc: '../../media/portrait-2.jpg', height: '500vh', width: '250px', imgHeight: '450px' }
];

// Function to generate sections dynamically
function generateSections() {
  const container = document.getElementById('zoom-container');
  config.forEach((sectionConfig, i) => {
    // Create zoom-section div
    const section = document.createElement('div');
    section.classList.add('zoom-section');
    section.id = `zoom-section-${i}`;
    section.style.height = sectionConfig.height;
    
    // Create sticky-wrapper div
    const stickyWrapper = document.createElement('div');
    stickyWrapper.classList.add('sticky-wrapper');

    // Create section label
    const sectionLabel = document.createElement('div');
    sectionLabel.classList.add('section-label');
    sectionLabel.textContent = sectionConfig.label;

    // Create zoom-image div
    const zoomImage = document.createElement('div');
    zoomImage.classList.add('zoom-image');
    zoomImage.id = `zoom-image-${i}`;
    zoomImage.style.width = sectionConfig.width;
    zoomImage.style.height = sectionConfig.imgHeight;

    // Create img element
    const img = document.createElement('img');
    img.src = sectionConfig.imgSrc;

    // Append everything in the correct order
    zoomImage.appendChild(img);
    stickyWrapper.appendChild(sectionLabel);
    stickyWrapper.appendChild(zoomImage);
    section.appendChild(stickyWrapper);
    container.appendChild(section);
  });
}

// Configuration-based zoom logic
function easeOutCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}

function calculateProgress(section) {
  const rect = section.getBoundingClientRect();
  const sectionHeight = section.offsetHeight;
  const viewportHeight = window.innerHeight;

  if (rect.top > 0) return 0;
  if (rect.bottom < viewportHeight) return 1;

  const scrolled = -rect.top;
  const scrollable = sectionHeight - viewportHeight;
  return Math.min(Math.max(scrolled / scrollable, 0), 1);
}

function updateZoom(i) {
  const section = document.getElementById(`zoom-section-${i}`);
  const imageEl = document.getElementById(`zoom-image-${i}`);
  if (!section || !imageEl) return;

  const img = imageEl.querySelector('img');
  const cfg = config[i];
  const progress = easeOutCubic(calculateProgress(section));

  const baseW = imageEl.offsetWidth;
  const baseH = imageEl.offsetHeight;

  const fullScale = Math.max(
    window.innerWidth / baseW,
    window.innerHeight / baseH
  ) * cfg.zoomOverflow;

  const scale = cfg.zoomIn
    ? 1 + (fullScale - 1) * progress
    : fullScale - (fullScale - 1) * progress;

  imageEl.style.transform = `scale(${scale})`;
  img.style.borderRadius = `${cfg.zoomIn ? 8 * (1 - progress) : 8 * progress}px`;
}

function updateAll() {
  config.forEach((_, i) => updateZoom(i));
}

window.addEventListener('scroll', updateAll);
window.addEventListener('resize', updateAll);

// Generate sections on page load
generateSections();
updateAll();
</script>
