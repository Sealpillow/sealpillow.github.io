<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<!-- CSS for Responsiveness -->
<style>
/* Section */
section {
  display: flex;
  flex-wrap: wrap;
}

/* Desktop — min-width: 768px */
@media (min-width: 768px) {
  /* Image Container > Video Text Container */
  .image-container, .video-text-container {
    flex: 1 1 50%;
    max-width: 50%;
  }

  /* Video Container */
  .video-container {
    height: 50vh;
  }
}

/* Mobile — max-width: 767px */
@media (max-width: 767px) {
  /* Image Container > Video Text Container */
  .image-container, .video-text-container {
    flex: 1 1 100%;
    max-width: 100%;
  }

  /* Video Container */
  .video-container {
    height: 40vh;
  }

  /* Text Container */
  .text-container {
    padding: 20px;
  }

  /* Video Text Container */
  .video-text-container {
    order: 2;
  }

  /* Image Container */
  .image-container {
    order: 1;
  }
}
</style>
<section style="display: flex; flex-wrap: wrap; justify-content: center; width: 100%;">

    <!-- LEFT: IMAGE -->
    <div class="image-container" style="flex: 1 1 100%; padding: 0; height: 100%;">
        <img src="../../media/portrait-1.jpg" alt="Grano Leather" 
            style="width: 100%; height: 100%; object-fit: cover;">
    </div>

    <!-- RIGHT: VIDEO + TEXT -->
    <div class="video-text-container" style="flex: 1 1 100%;  display: flex; flex-direction: column; justify-content: center; padding: 40px; box-sizing: border-box;">
        
        <!-- VIDEO -->
        <div class="video-container" style="flex: 1; width: 100%; display: flex;">
            <video playsinline autoplay loop muted style="width: 100%; height: 100%; object-fit: cover; border-radius: 10px;">
                <source src="../../media/landscape_video-1.mp4" type="video/mp4">
            </video>
        </div>

        <!-- TEXT -->
        <div class="text-container" style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
            <p class="mb-0" style="font-family: proxima-nova; font-size: 14px; font-weight: 400; line-height: normal;">
                Speaking to the spirit of exploration,<br>
                one of the greatest virtues and character<br>
                traits of the human mind.<br>
            </p>
        </div>
    </div>

</section>
