<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  /* 50/50: a 4:5 image on the left, a left-aligned heading + body on the
     right, vertically centred and pushed in from the centre line. */
  .split-intro {
    --si-gutter: 40px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    margin-bottom: 100px;
    font-family: proxima-nova, "Helvetica Neue", Arial, sans-serif;
    color: #000;
    background: #fff;
    -webkit-font-smoothing: antialiased;
  }

  .split-intro *,
  .split-intro *::before,
  .split-intro *::after {
    box-sizing: border-box;
  }

  /* Natural ratio once loaded, 4:5 placeholder before */
  .split-intro__img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: auto 4 / 5;
    object-fit: cover;
    background: #efefef;
  }

  .split-intro__text {
    max-width: 82%;
    padding: 0 var(--si-gutter) 0 21%;
  }

  .split-intro__heading {
    margin: 0 0 18px;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.3;
  }

  .split-intro__body {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
  }

  /* Tablet */
  @media (max-width: 1023px) {
    .split-intro {
      --si-gutter: 28px;
    }

    .split-intro__text {
      max-width: 100%;
      padding-left: 12%;
    }
  }

  /* Mobile: image, then text at 90% width */
  @media (max-width: 767px) {
    .split-intro {
      grid-template-columns: 1fr;
    }

    .split-intro__text {
      width: 90%;
      max-width: none;
      margin: 0 auto;
      padding: 40px 0 0;
    }

    .split-intro__heading {
      font-size: 18px;
    }
  }
</style>

<section class="split-intro">
  <img class="split-intro__img" src="../../media/portrait-1.jpg" alt="" loading="lazy">
  <div class="split-intro__text">
    <h2 class="split-intro__heading">A short heading for this chapter<br>Name, role</h2>
    <p class="split-intro__body">
      A paragraph introducing the person or idea in the image: what they do, how they work, and why they are part of
      the story.
    </p>
  </div>
</section>
